; Raises the PHP-level upload ceiling above the app's own 10 MB limit
; (config/config.php: MAX_UPLOAD_BYTES) so a payment screenshot is never
; rejected by php.ini before the app's own, friendlier validation runs.
; Hostinger (and most shared hosts running PHP-FPM) read .user.ini per
; directory — changes can take a few minutes to apply after upload.
upload_max_filesize = 12M
post_max_size = 14M
