<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable-safe: full-bleed deep-navy field, motif kept within the inner 80% safe zone -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2540"/>
      <stop offset="1" stop-color="#081020"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C869"/>
      <stop offset="1" stop-color="#E8891C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- subtle saffron aura -->
  <circle cx="256" cy="230" r="180" fill="#E8891C" opacity="0.10"/>
  <!-- route arc -->
  <path d="M118 356 Q256 250 394 356" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 22" opacity="0.85"/>
  <circle cx="118" cy="356" r="12" fill="#EAF1FB"/>
  <circle cx="394" cy="356" r="12" fill="#E8891C"/>
  <!-- bus body -->
  <g transform="translate(256 214)">
    <rect x="-96" y="-64" width="192" height="128" rx="26" fill="url(#gold)"/>
    <rect x="-96" y="-64" width="192" height="128" rx="26" fill="none" stroke="#0A1628" stroke-width="4" opacity="0.25"/>
    <!-- windshield / windows -->
    <rect x="-78" y="-44" width="60" height="40" rx="9" fill="#0F2540"/>
    <rect x="-8" y="-44" width="42" height="40" rx="9" fill="#0F2540"/>
    <rect x="44" y="-44" width="34" height="40" rx="9" fill="#0F2540"/>
    <!-- headlight + trim -->
    <rect x="-96" y="8" width="192" height="12" fill="#0A1628" opacity="0.28"/>
    <circle cx="82" cy="34" r="7" fill="#EAF1FB"/>
    <!-- wheels -->
    <circle cx="-52" cy="64" r="20" fill="#0A1628"/>
    <circle cx="-52" cy="64" r="8" fill="#93A4BF"/>
    <circle cx="52" cy="64" r="20" fill="#0A1628"/>
    <circle cx="52" cy="64" r="8" fill="#93A4BF"/>
  </g>
  <!-- Om accent -->
  <text x="256" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="60" fill="#F5C869" opacity="0.9">ॐ</text>
</svg>
