# =====================================================================
#  Deploy to the Hostinger VPS — on demand, never automatically.
#
#  HOW TO USE:
#  1. Add these 4 secrets in GitHub → Settings → Secrets and variables → Actions:
#       VPS_SSH_KEY   private key for SSH access to the VPS
#       VPS_HOST      VPS IP or hostname (e.g. 93.127.167.249)
#       VPS_USER      SSH username (root or a sudoer)
#       VPS_PATH      /var/www/shreehariglobal.in/public_html
#
#  2. Go to Actions → Deploy to VPS → Run workflow
#  3. Set branch: claude/shreehari-global-upgrade-myl45u
#  4. Keep dry_run: true for the FIRST run to check what it would do
#  5. Run again with dry_run: false to actually deploy
#
#  The workflow clones the branch side-by-side, preserves config.php and
#  uploads/, runs migrations, swaps directories atomically, and rolls back
#  if the site stops answering 200.
# =====================================================================

name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'claude/shreehari-global-upgrade-myl45u'
      dry_run:
        description: 'Dry run — show what would happen, no changes'
        type: boolean
        default: true

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.dry_run && 'Dry run' || 'Deploy' }} ${{ inputs.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets are set
        env:
          KEY:  ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PATH_: ${{ secrets.VPS_PATH }}
        run: |
          missing=""
          [ -n "$KEY" ]   || missing="$missing VPS_SSH_KEY"
          [ -n "$HOST" ]  || missing="$missing VPS_HOST"
          [ -n "$USER" ]  || missing="$missing VPS_USER"
          [ -n "$PATH_" ] || missing="$missing VPS_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — add them in Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "All secrets present."

      - name: Setup SSH
        env:
          KEY:  ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # An unusable key otherwise surfaces much later as ssh's
          # `Load key ...: error in libcrypto`, which says nothing about what is
          # wrong with the secret. Check it here, where we can say.
          # stdin is /dev/null so a passphrase-protected key fails instead of hanging.
          key_ok() { ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1 < /dev/null; }

          # A secret that arrives as one line is nearly always a paste that lost
          # its newlines — the commonest way to get this wrong, and invisible
          # afterwards because GitHub will not show a secret back. So base64 of
          # the key file is accepted too: `base64 -w0 ~/.ssh/gh_deploy` pastes as
          # a single line that cannot be mangled. A real key is not valid base64
          # (the BEGIN/END lines have dashes), so this can only help.
          if ! key_ok && base64 -d < ~/.ssh/id_deploy > ~/.ssh/id_deploy.dec 2>/dev/null; then
            mv ~/.ssh/id_deploy.dec ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            key_ok && echo "VPS_SSH_KEY was base64; decoded it."
          fi
          rm -f ~/.ssh/id_deploy.dec

          if ! key_ok; then
            echo "::error::VPS_SSH_KEY is not a usable private key."
            echo "  starts with : $(head -1 ~/.ssh/id_deploy | cut -c1-40)"
            echo "  line count  : $(wc -l < ~/.ssh/id_deploy)"
            echo "  It must be the PRIVATE key file — the one whose first line is"
            echo "  -----BEGIN OPENSSH PRIVATE KEY----- — pasted whole, with its line"
            echo "  breaks intact, and with no passphrase. Not the .pub file."
            echo "  A line count of 1 means the newlines were lost in the paste."
            echo "  Easiest fix: set the secret to the output of"
            echo "      base64 -w0 ~/.ssh/gh_deploy"
            echo "  which is one line by design and is accepted here."
            exit 1
          fi
          echo "Key parses OK: $(ssh-keygen -l -f ~/.ssh/id_deploy | awk '{print $1, $4}')"

          # ssh-keyscan failing means the port never answered. That is a different
          # fault from a bad key — reachability, not credentials — so name it apart.
          if ! ssh-keyscan -T 10 -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            echo "::error::No host key from port ${PORT:-22} — the VPS did not answer."
            sed 's/^/  /' /tmp/keyscan.err
            echo "  The key may be fine; the server or its firewall is the thing to check."
            exit 1
          fi
          echo "Host key recorded."

      - name: ${{ inputs.dry_run && '[DRY RUN] Show what would be deployed' || 'Deploy' }}
        env:
          HOST:   ${{ secrets.VPS_HOST }}
          USER:   ${{ secrets.VPS_USER }}
          PORT:   ${{ secrets.VPS_PORT }}
          SITE:   ${{ secrets.VPS_PATH }}
          BRANCH: ${{ inputs.branch }}
          DRY:    ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          # ssh does not carry the runner's environment to the VPS, and the heredoc
          # below stays quoted so nothing expands on the runner. So the three values
          # the remote script needs are prepended as %q-quoted assignments instead.
          {
            printf 'SITE=%q\nBRANCH=%q\nDRY=%q\n' "$SITE" "$BRANCH" "$DRY"
            cat << 'REMOTE'
          set -euo pipefail

          REPO="https://github.com/shreehariglobalpvtltd-a11y/shreehari.git"
          SITE_PARENT="$(dirname "$SITE")"
          NEW_DIR="$SITE_PARENT/new_html_deploy"
          OLD_DIR="$SITE_PARENT/old_html_backup"

          echo "=== Deploy: $BRANCH -> $SITE ==="
          echo "Date: $(date '+%Y-%m-%d %H:%M:%S %Z')"

          # Backup current state. tar stores paths without the leading slash, so the
          # excludes are relative to -C and the heavy runtime trees really are skipped.
          BACKUP_DIR="/root/backups"
          mkdir -p "$BACKUP_DIR"
          STAMP="$(date +%Y%m%d-%H%M%S)"
          if [ "$DRY" != "true" ]; then
            echo "--- Backup: $BACKUP_DIR/pre-deploy-$STAMP.tar.gz"
            tar -czf "$BACKUP_DIR/pre-deploy-$STAMP.tar.gz" \
              --exclude=./uploads --exclude=./tickets \
              --exclude=./qr --exclude=./logs --exclude=./invoice \
              -C "$SITE" . 2>/dev/null || true
            echo "--- DB backup: $BACKUP_DIR/pre-deploy-$STAMP.sql.gz"
            mysqldump --single-transaction shari 2>/dev/null | gzip > "$BACKUP_DIR/pre-deploy-$STAMP.sql.gz" || true
          else
            echo "[DRY] Would backup to $BACKUP_DIR/pre-deploy-$STAMP.tar.gz"
          fi

          # Show current deployed commit
          if [ -d "$SITE/.git" ]; then
            echo "--- Current: $(git -C "$SITE" -c safe.directory="$SITE" log -1 --format='%h %s' 2>/dev/null || echo unknown)"
          fi

          # Clone branch
          echo "--- Cloning $BRANCH..."
          if [ "$DRY" != "true" ]; then
            rm -rf "$NEW_DIR"
            git clone --branch "$BRANCH" --depth 30 "$REPO" "$NEW_DIR"
            echo "--- Cloned: $(git -C "$NEW_DIR" log -1 --format='%h %s')"
          else
            echo "[DRY] Would clone $REPO branch $BRANCH to $NEW_DIR"
          fi

          # PHP lint
          echo "--- PHP syntax check..."
          if [ "$DRY" != "true" ]; then
            find "$NEW_DIR" -name '*.php' -not -path '*/vendor/*' | while read f; do
              php -l "$f" > /dev/null || { echo "FAIL: $f"; exit 1; }
            done
            echo "    PHP OK"
          else
            echo "[DRY] Would run php -l on all .php files"
          fi

          # Preserve config and the runtime trees. tickets/, invoice/ and backup/ are
          # gitignored, so a fresh clone has no such directory and an unguarded copy
          # would silently drop every generated ticket and invoice on the swap.
          echo "--- Preserving config.php and the runtime trees..."
          if [ "$DRY" != "true" ]; then
            cp "$SITE/config/config.php" "$NEW_DIR/config/config.php"
            for d in uploads tickets qr invoice backup; do
              [ -d "$SITE/$d" ] || continue
              mkdir -p "$NEW_DIR/$d"
              cp -a "$SITE/$d/." "$NEW_DIR/$d/"
              echo "    carried over $d/"
            done
          else
            echo "[DRY] Would copy config.php and carry over uploads/ tickets/ qr/ invoice/ backup/"
          fi

          # Migrations
          #
          # deploy/vps-pull-deploy.sh already owns the schema_migrations shape in
          # this repo — filename/applied_at/sha1 — and this step used to invent its
          # own `migration` column. On a live database carrying the other table the
          # lookup errored, every file counted as unapplied, and the deploy replayed
          # all 67 from the beginning; upgrade-2026-08-agent-role.sql then narrowed
          # admins.role back to a list without 'counter' and MySQL refused:
          # "Data truncated for column 'role' at row 12". Same table, same column
          # names, same tolerance as that script, so the two paths agree.
          echo "--- Running migrations..."
          if [ "$DRY" != "true" ]; then
            mysql shari -e "
              CREATE TABLE IF NOT EXISTS schema_migrations (
                filename   VARCHAR(190) NOT NULL PRIMARY KEY,
                applied_at DATETIME     NOT NULL,
                sha1       CHAR(40)     NOT NULL
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;"

            # First run on a database that predates this bookkeeping: the table is
            # empty while the schema is already 67 migrations deep, upgraded by hand.
            # Replaying from the beginning is not merely noisy — it is wrong, because
            # an early file can narrow what a later one widened. Exactly that happened:
            # upgrade-2026-08-agent-role.sql sets admins.role to an ENUM without
            # 'counter', which upgrade-2026-09-counter-role.sql added and a real admin
            # uses, and MySQL refused with "Data truncated for column 'role' at row 12".
            #
            # What the LIVE code shipped with is what the LIVE database has, so the
            # migrations sitting in the current document root are recorded as applied.
            # Files arriving only with the new code are not in that directory, so they
            # stay pending and still run. Only ever on an empty table, so a later
            # deploy cannot silently skip a migration.
            if [ "$(mysql shari -sNe 'SELECT COUNT(*) FROM schema_migrations')" -eq 0 ]; then
              seeded=0
              for old_f in "$SITE"/database/upgrade-*.sql; do
                [ -f "$old_f" ] || continue
                old_base="$(basename "$old_f")"
                old_sha="$(sha1sum "$old_f" | cut -d' ' -f1)"
                mysql shari -e "INSERT IGNORE INTO schema_migrations (filename, applied_at, sha1)
                                VALUES ('$old_base', NOW(), '$old_sha')"
                seeded=$((seeded+1))
              done
              [ "$seeded" -eq 0 ] \
                && echo "    schema_migrations was empty and the live tree has no migrations — nothing seeded" \
                || echo "    schema_migrations was empty: seeded $seeded file(s) already live"
            fi
          fi
          for f in "$NEW_DIR"/database/upgrade-*.sql; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            if [ "$DRY" = "true" ]; then
              echo "[DRY] Would consider: $base"
              continue
            fi
            exists=$(mysql shari -sNe "SELECT COUNT(*) FROM schema_migrations WHERE filename='$base'")
            if [ "${exists:-0}" -gt 0 ]; then
              echo "    Skip $base (already applied)"
              continue
            fi
            printf '    %s ... ' "$base"
            err="$(mysql shari < "$f" 2>&1 >/dev/null || true)"
            if [ -n "$err" ]; then
              # The house rule is additive files — IF NOT EXISTS, INSERT IGNORE — so
              # an object that is already there on a hand-upgraded database is
              # expected. Anything else is a real failure and stops the deploy
              # BEFORE the swap, leaving the current site untouched.
              if grep -qvE "Duplicate (column|key) name|Duplicate entry|already exists|Multiple primary key|check that column/key exists" <<< "$err"; then
                echo "FAILED"
                echo "$err" | head -5
                echo "    The site was NOT swapped; it is still serving the previous version."
                exit 1
              fi
              echo "already there"
            else
              echo "ok"
            fi
            sha="$(sha1sum "$f" | cut -d' ' -f1)"
            mysql shari -e "INSERT IGNORE INTO schema_migrations (filename, applied_at, sha1) VALUES ('$base', NOW(), '$sha')"
          done
          [ "$DRY" != "true" ] || echo "[DRY] (nothing cloned yet, so the list above may be empty)"

          # Atomic swap
          echo "--- Swapping directories..."
          if [ "$DRY" != "true" ]; then
            chown -R www-data:www-data "$NEW_DIR"
            chmod 640 "$NEW_DIR/config/config.php"
            rm -rf "$OLD_DIR"
            mv "$SITE" "$OLD_DIR"
            mv "$NEW_DIR" "$SITE"
            echo "    Swapped."
          else
            echo "[DRY] Would: mv $SITE -> $OLD_DIR && mv $NEW_DIR -> $SITE"
          fi

          # Reload services
          echo "--- Reloading services..."
          if [ "$DRY" != "true" ]; then
            systemctl reload php8.3-fpm 2>/dev/null && echo "    php8.3-fpm reloaded" || echo "    WARN: php-fpm reload failed (non-fatal)"
            systemctl reload nginx 2>/dev/null && echo "    nginx reloaded" || echo "    WARN: nginx reload failed (non-fatal)"
          else
            echo "[DRY] Would reload php8.3-fpm and nginx"
          fi

          # Health check
          echo "--- Health check..."
          if [ "$DRY" != "true" ]; then
            sleep 3
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://www.shreehariglobal.in/ || echo 000)
            echo "    Site answers: $CODE"
            if [ "$CODE" != "200" ]; then
              echo "ROLLBACK: site answered $CODE, restoring previous version..."
              mv "$SITE" "$SITE_PARENT/failed_$STAMP"
              mv "$OLD_DIR" "$SITE"
              systemctl reload php8.3-fpm 2>/dev/null || true
              systemctl reload nginx 2>/dev/null || true
              echo "ROLLBACK DONE. Check $SITE_PARENT/failed_$STAMP for the failed deploy."
              exit 1
            fi
            echo "    Deploy successful!"
          else
            echo "[DRY] Would check https://www.shreehariglobal.in/ returns 200"
            echo ""
            echo "=== DRY RUN COMPLETE - no changes were made ==="
          fi
          REMOTE
          } | ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o BatchMode=yes "$USER@$HOST" bash -s

      - name: Check site health
        if: always()
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://www.shreehariglobal.in/ || echo 000)
          echo "https://www.shreehariglobal.in/ -> HTTP $code"
          [ "$code" = "200" ] || echo "::warning::Site returned $code — check logs above"
