name: Application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PHP 8.3 and Node 24 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: |
          find assets/js tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          node --check sw-reset.js
      - name: PWA manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Asset versions
        run: php tests/asset-version-test.php
      - name: The committed bundle matches the sources
        run: |
          npm install --no-save --no-audit --no-fund esbuild
          node tools/build.mjs --check
      - name: Offline ticket behavior
        run: node tests/offline-ticket-test.js
      - name: Lazy-load recovery
        run: node tests/lazy-retry-test.js
      - name: Translations
        run: node tests/i18n-check.js

  battery:
    # The pre-deploy battery (tests/run-all.php --http) against a database
    # built from the repository alone: schema.sql + seed.sql + every upgrade
    # + tests/ci-fixtures.php. Until 24 Sep 2026 this ran only on the VPS's
    # copy of the live register, so a GitHub push could be green while a
    # money-path suite was red. The MariaDB service is reachable exactly the
    # way tests/e2e-booking-test.php hard-codes it: root, no password,
    # 127.0.0.1:3307, and it keeps the live server's IST clock so the
    # undo-window and reminder suites see the same NOW() as PHP.
    name: Booking battery (MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 1
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, intl, curl, pdo_mysql, mysqli, sodium, zip, exif, fileinfo
          ini-values: date.timezone=Asia/Kolkata, memory_limit=512M
          coverage: none
          tools: none
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: MariaDB keeps India time
        run: mysql -h127.0.0.1 -P3307 -uroot -e "SET GLOBAL time_zone = '+05:30'; SELECT @@global.time_zone, NOW();"
      - name: Build shari_test from the repository
        run: bash tests/ci-setup.sh
      - name: Start the dev server on :8899
        run: |
          # PHP_CLI_SERVER_WORKERS: the built-in server is single-threaded
          # without it, and one open /api/seat-events.php stream (25 s by
          # default, and production holds it open the same way) blocks every
          # other request until it ends. Production is nginx + PHP-FPM with
          # many workers; four here is enough to behave the same.
          (PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8899 -t . tests/dev-router.php > /tmp/php-server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8899/index.php && break; sleep 1; done
          curl -s -o /dev/null -w "dev server: HTTP %{http_code}\n" http://127.0.0.1:8899/index.php
      - name: Run the battery
        run: php tests/run-all.php --http
      - name: A real browser opens the app and picks a seat
        run: |
          npm install --no-save --no-audit --no-fund playwright-core
          node tests/browser-smoke.mjs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Server log on failure
        if: failure()
        run: tail -n 100 /tmp/php-server.log || true
