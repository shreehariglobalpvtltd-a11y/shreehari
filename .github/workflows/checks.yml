name: Application checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PHP 8.3 and Node 24 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: |
          find assets/js tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          node --check sw-reset.js
      - name: PWA manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Asset versions
        run: php tests/asset-version-test.php
      - name: AI tool loop (no database)
        run: php tests/ai-turn-test.php
      - name: AI report charts (no database)
        run: php tests/ai-chart-test.php
      - name: Offline ticket behavior
        run: node tests/offline-ticket-test.js
      - name: Lazy-load recovery
        run: node tests/lazy-retry-test.js
      - name: Translations
        run: node tests/i18n-check.js
