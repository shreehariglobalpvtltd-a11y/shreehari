<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B1426">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SHARI NAV · Navigate</title>
<meta name="description" content="SHARI NAV by Shree Hari Global: free turn-by-turn navigation for India and Nepal. Car, bus, bike and walking routes, voice guidance, speed limits and offline maps.">
<link rel="manifest" href="/navigate.webmanifest">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/assets/vendor/maplibre-gl-4.7.1/maplibre-gl.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.5.0/maplibre-gl.min.css'">
<!--
  SHARI NAV · navigate.html (20 Oct 2026)
  One self-contained navigation page. Everything runs on free / own services:
    map tiles   /navdata/ (our OpenStreetMap tiles)  -> CartoCDN if unreachable
    routing     /api/nav-route.php (our Valhalla, OSRM-shaped answer) -> public OSRM
    search      /api/nav-search.php (our place index) -> Nominatim, on request only
    speed limit /api/nav-limits.php
    elevation   /api/nav-elevation.php (our Valhalla /height, SRTM tiles)  [nv4, bike/walk]
    weather     /api/nav-weather.php (MET Norway, cached 30 min)           [nv4]
  Trip log + battery saver live in this phone's localStorage only.
  No Google API. No build step.
-->
<style>
:root{
  --bg:#0B1426; --surface:#111D33; --card:#162240; --card2:#1B2A4D;
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.11);
  --text:#EEF2FA; --text2:#A8B4CC; --text3:#6F7D99;
  --gold:#D4A843; --cta:#E8652E; --cta2:#F07A45; --ok:#34C759; --bad:#FF453A;
  --car:#4A9EFF; --bus:#D4A843; --bike:#34C759; --walk:#FF9F0A;
  --mode:#4A9EFF;
  --r:14px; --rs:8px; --sh:0 4px 20px rgba(0,0,0,.25); --sh2:0 10px 40px rgba(0,0,0,.45);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --sheet-top:100vh; --ctrl-b:24px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;overflow:clip}   /* clip: the off-screen sheet must never make the page scrollable (focus / marker scrolls moved the whole UI up) */
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3,h4,.pop{font-family:Poppins,Inter,sans-serif}
svg{display:block}
.glass{background:rgba(17,29,51,.9);border:1px solid var(--line);box-shadow:var(--sh);
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
.ic{width:44px;height:44px;min-width:44px;display:grid;place-items:center;border-radius:50%;color:var(--text2);
  transition:background .2s,color .2s,transform .15s}
.ic:active{transform:scale(.92);background:rgba(255,255,255,.07)}
.ic svg{width:22px;height:22px}

/* ---------- map ---------- */
#map{position:absolute;inset:0;background:var(--bg)}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:calc(100vh - var(--sheet-top) + 2px);transition:opacity .2s}
.maplibregl-ctrl-attrib{background:rgba(11,20,38,.75)!important;color:var(--text3)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--text2)!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
body[data-lvl=nav] .maplibregl-ctrl-bottom-left,body[data-lvl=nav] .maplibregl-ctrl-bottom-right{bottom:calc(var(--sb) + 96px)}

/* ---------- loading bar ---------- */
#bar{position:fixed;left:0;right:0;top:0;height:3px;z-index:90;pointer-events:none;opacity:0;transition:opacity .3s}
#bar.on{opacity:1}
#bar::after{content:"";position:absolute;inset:0;width:35%;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:barmove 1.1s ease-in-out infinite}
@keyframes barmove{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .5s}
#boot.gone{opacity:0;pointer-events:none}
.boot-in{text-align:center}
.boot-logo{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(145deg,#1B2A4D,#0F1A30);border:1px solid var(--line2);box-shadow:var(--sh2)}
.boot-logo svg{width:34px;height:34px}
/* 22 Oct 2026: the official logo on the splash (owner: "logo sahit ko nav system") */
#boot{background:radial-gradient(120% 80% at 50% 30%,#16264a 0%,var(--bg) 62%)}
.boot-logo.img{width:min(62vw,240px);height:auto;aspect-ratio:439/228;padding:14px 18px;border-radius:26px;
  background:linear-gradient(160deg,#fff,#eef3fb);border:0;box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);
  animation:bootIn .7s var(--spring) both}
.boot-logo.img img{width:100%;height:auto;display:block}
.boot-t{font:600 18px Poppins,sans-serif;letter-spacing:.3px}
.boot-t b{color:var(--gold)}
.boot-in .boot-t{font-size:22px;margin-top:6px;animation:bootIn .7s .12s var(--ease) both}
.boot-s{color:var(--text3);font-size:13px;margin-top:4px}
.boot-in .boot-s{animation:bootIn .7s .2s var(--ease) both}
/* 22 Oct 2026 (owner: "suru ma S Hari ko logo, fast animate"): the logo pops in
   in under half a second with one light sweep, the splash leaves in .25 s */
#boot{transition:opacity .25s}
.boot-logo.img{position:relative;overflow:hidden;animation:bootPop .42s var(--spring) both}
.boot-logo.img::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.85) 48%,transparent 66%);
  transform:translateX(-120%);animation:bootShine .6s .3s ease-out both}
.boot-in .boot-t{animation-duration:.32s;animation-delay:.12s}
.boot-in .boot-s{animation-duration:.32s;animation-delay:.18s}
.boot-bar::after{animation-duration:.7s}
@keyframes bootPop{0%{opacity:0;transform:scale(.6) rotate(-4deg)}70%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:none}}
@keyframes bootShine{to{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.boot-logo.img::after{display:none}}
.boot-bar{width:140px;height:3px;margin:18px auto 0;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.boot-bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:3px;background:linear-gradient(90deg,#1F6FD1,var(--cta),var(--gold));animation:barmove 1.1s ease-in-out infinite}
@keyframes bootIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.boot-logo.img,.boot-in .boot-t,.boot-in .boot-s,.boot-bar::after{animation:none}}
.boot-err{max-width:300px;margin:16px auto 0;color:var(--text2);font-size:14px}

/* ---------- top (home) ---------- */
.top{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(var(--st) + 10px) calc(var(--sr) + 12px) 0 calc(var(--sl) + 12px);
  pointer-events:none;transition:transform .35s var(--ease),opacity .25s}
.top>*{pointer-events:auto}
.searchbar{display:flex;align-items:center;height:52px;border-radius:26px;padding:0 4px;max-width:560px}
.sb-text{flex:1;min-width:0;height:44px;text-align:left;padding:0 6px;color:var(--text2);font-size:16px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-text.has{color:var(--text);font-weight:500}
.brand{width:36px;height:36px;margin:0 4px 0 4px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(145deg,#1F3160,#0F1A30);border:1px solid var(--line2)}
.brand svg{width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 2px 6px;margin:0 -12px;padding-left:12px;padding-right:12px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 12px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 12px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;display:inline-flex;align-items:center;gap:7px;
  background:rgba(17,29,51,.92);border:1px solid var(--line2);box-shadow:var(--sh);font-weight:500;font-size:14px;white-space:nowrap;
  transition:transform .15s,background .2s,border-color .2s}
.chip:active{transform:scale(.95)}
.chip svg{width:17px;height:17px;color:var(--gold)}
.chip.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.chip.on svg{color:#1a1405}
.chip .em{font-size:15px;line-height:1}

/* 22 Oct 2026: on the white day map the floating search bar, chips and map
   buttons turn white too (Google Maps style); sheets keep the S Hari navy */
html[data-map=light] #map{background:#F5F6F8}
html[data-map=light] .top .searchbar.glass{background:rgba(255,255,255,.97);border-color:rgba(60,64,67,.08);box-shadow:0 1px 3px rgba(60,64,67,.25),0 4px 12px rgba(60,64,67,.12)}
html[data-map=light] .top .sb-text{color:#5F6368}
html[data-map=light] .top .sb-text.has{color:#202124}
html[data-map=light] .top .searchbar .ic{color:#5F6368}
html[data-map=light] .top .brand{background:linear-gradient(145deg,#1F3160,#0F1A30)}
html[data-map=light] .top .chip:not(.on){background:#FFFFFF;color:#3C4043;border-color:rgba(60,64,67,.12);box-shadow:0 1px 3px rgba(60,64,67,.2)}
html[data-map=light] .top .chip:not(.on) svg{color:#1A73E8}
html[data-map=light] .ctrls .fab{background:#FFFFFF;color:#3C4043;border-color:rgba(60,64,67,.1);box-shadow:0 1px 3px rgba(60,64,67,.28),0 4px 10px rgba(60,64,67,.12)}
html[data-map=light] .ctrls .fab.on,html[data-map=light] .ctrls #cLoc.follow{color:#1A73E8}
html[data-map=light] .ctrls #cLoc.compass{color:#fff;background:#1A73E8}
html[data-map=light] .ctrls .zoom{background:#FFFFFF;color:#3C4043;border-color:rgba(60,64,67,.1);box-shadow:0 1px 3px rgba(60,64,67,.28)}
html[data-map=light] .ctrls .zoom button{color:#3C4043}
html[data-map=light] .ctrls .zoom button+button{border-top-color:rgba(60,64,67,.12)}
html[data-map=light] .maplibregl-ctrl-attrib{background:rgba(255,255,255,.8)!important;color:#70757A!important}
html[data-map=light] .maplibregl-ctrl-attrib a{color:#5F6368!important}
html[data-map=light] .maplibregl-ctrl-attrib-button{filter:none}

/* ---------- controls ---------- */
.ctrls{position:absolute;right:calc(var(--sr) + 12px);bottom:var(--ctrl-b);z-index:15;display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  transition:opacity .25s}
.ctrls.fade{opacity:0;pointer-events:none}
.fab{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--text);
  background:rgba(17,29,51,.94);border:1px solid var(--line2);box-shadow:var(--sh);transition:transform .15s,color .2s,background .2s,opacity .25s}
.fab:active{transform:scale(.9)}
.fab svg{width:22px;height:22px}
.fab.sm{width:44px;height:44px}
.fab.on{color:var(--car)}
.fab.lit{color:var(--gold)}
#cLoc{width:56px;height:56px;border-radius:18px}
#cLoc.follow{color:var(--car)}
#cLoc.compass{color:#fff;background:var(--car)}
#c3d{font:700 13px Poppins,sans-serif}
#cCompass{transition:opacity .3s,transform .15s}
#cCompass.hide{opacity:0;pointer-events:none;transform:scale(.6)}
#needle{transition:transform .08s linear}
.zoom{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:rgba(17,29,51,.94);border:1px solid var(--line2);box-shadow:var(--sh)}
.zoom button{width:44px;height:44px;display:grid;place-items:center;font-size:22px;color:var(--text)}
.zoom button+button{border-top:1px solid var(--line2)}
.zoom button:active{background:rgba(255,255,255,.08)}
body[data-lvl=nav] .zoom,body[data-lvl=nav] #cLayers,body[data-lvl=nav] #cLoc,body[data-lvl=search] .ctrls{display:none}
body[data-lvl=nav] .ctrls{bottom:calc(var(--sb) + 112px)}

/* ---------- me puck ---------- */
.me{width:24px;height:24px;position:relative;pointer-events:none}
.me-dot{position:absolute;inset:3px;border-radius:50%;background:#4A9EFF;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.45);z-index:2}
.me-pulse{position:absolute;inset:-14px;border-radius:50%;background:rgba(74,158,255,.35);animation:pulse 2.2s cubic-bezier(.2,.6,.3,1) infinite;z-index:0}
@keyframes pulse{0%{transform:scale(.35);opacity:.9}80%,100%{transform:scale(1.25);opacity:0}}
.me-cone{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-64px 0 0 -32px;transform-origin:50% 100%;z-index:1;display:none;
  background:radial-gradient(ellipse at 50% 100%,rgba(74,158,255,.55),rgba(74,158,255,0) 70%);clip-path:polygon(50% 100%,12% 0,88% 0)}
.me.head .me-cone{display:block}
.me-arrow{display:none;position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:3;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.me.nav{width:46px;height:46px}
.me.nav .me-arrow{display:block}
.me.nav .me-dot,.me.nav .me-pulse,.me.nav .me-cone{display:none}
/* the drive arrow takes the mode colour; walking keeps Google's dot + beam, cycling a smaller arrow */
.me-arrow path{fill:var(--mode)}
.me-arrow circle{fill:var(--mode);fill-opacity:.18}
.me.nav.walk{width:24px;height:24px}
.me.nav.walk .me-arrow{display:none}
.me.nav.walk .me-dot,.me.nav.walk .me-cone{display:block}
.me.nav.bike .me-arrow{width:36px;height:36px;margin:-18px 0 0 -18px}
.me.stale .me-dot{background:#8A94A6}
.me.stale .me-pulse{display:none}

/* ---------- markers ---------- */
.pin{position:relative;width:34px;height:46px;pointer-events:auto;cursor:pointer;transform-origin:50% 100%}
.pin svg{width:34px;height:46px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.pin.drop{animation:drop .55s var(--spring) both}
@keyframes drop{0%{transform:translateY(-60px) scale(.6);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.pin-shadow{position:absolute;left:50%;bottom:-3px;width:14px;height:5px;margin-left:-7px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(1px)}
.start-dot{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid #1D4E8F;box-shadow:0 1px 5px rgba(0,0,0,.5)}
.poi{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;cursor:pointer;
  background:var(--cta);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);animation:pop .35s var(--spring) both}
.poi span{transform:rotate(45deg);font-size:14px;line-height:1}
@keyframes pop{from{transform:rotate(-45deg) scale(0)}to{transform:rotate(-45deg) scale(1)}}
.bub{padding:5px 9px;border-radius:9px;font:600 12.5px Inter,sans-serif;white-space:nowrap;cursor:pointer;
  background:#fff;color:#0B1426;box-shadow:0 2px 10px rgba(0,0,0,.4);transform:translateY(-6px);animation:fadein .3s ease both}
.bub.alt{background:#2A3550;color:#D6DDEA}
.bub small{display:block;font-weight:500;font-size:11px;opacity:.7}
@keyframes fadein{from{opacity:0;transform:translateY(0)}to{opacity:1;transform:translateY(-6px)}}

/* ---------- search overlay ---------- */
.search{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;
  animation:sdown .28s var(--ease) both}
@keyframes sdown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.s-head{display:flex;align-items:center;gap:2px;padding:calc(var(--st) + 8px) calc(var(--sr) + 8px) 8px calc(var(--sl) + 6px);border-bottom:1px solid var(--line)}
.s-head input{flex:1;min-width:0;height:44px;border:0;background:transparent;font-size:17px;outline:none;padding:0 4px}
.s-head input::placeholder{color:var(--text3)}
.s-head input::-webkit-search-cancel-button{display:none}
.s-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:6px 0 calc(var(--sb) + 20px)}
.s-sec{padding:14px 18px 6px;color:var(--text3);font:600 12px Poppins,sans-serif;letter-spacing:.8px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 18px;text-align:left;
  animation:rowin .3s var(--ease) both;transition:background .15s}
.row:active{background:rgba(255,255,255,.05)}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row-ic{width:40px;height:40px;min-width:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--text2);font-size:17px}
.row-ic svg{width:20px;height:20px}
.row-ic.gold{color:var(--gold)} .row-ic.blue{color:var(--car)} .row-ic.org{color:var(--cta)}
.row-tx{flex:1;min-width:0}
.row-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:13px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-t mark{background:none;color:var(--gold);font-weight:600}
.row-d{font-size:12.5px;color:var(--text3);white-space:nowrap}
.row-x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text3)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px 12px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:12px;font-size:12px;color:var(--text2);
  animation:rowin .3s var(--ease) both}
.cat:active{background:rgba(255,255,255,.05)}
.cat i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-style:normal;font-size:20px;border:1px solid var(--line)}
.empty{padding:28px 24px;text-align:center;color:var(--text3)}
.wide{color:var(--gold)}

/* ---------- directions panel ---------- */
.dir{position:absolute;z-index:22;left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);top:calc(var(--st) + 8px);border-radius:18px;padding:6px 6px 8px;max-width:560px;
  animation:sdown .32s var(--ease) both}
.dir-row{display:flex;align-items:center;gap:2px}
.dir-fields{flex:1;min-width:0;display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-rows:auto auto;column-gap:6px;row-gap:6px}
.dir-fields .field{width:100%;min-width:0;grid-column:2}
#fFrom{grid-row:1} #fTo{grid-row:2}
.dots{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dots .a{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--car)}
.dots .l{width:2px;height:16px;background:repeating-linear-gradient(var(--text3) 0 2px,transparent 2px 5px)}
.dots .b{width:11px;height:11px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--bad)}
.field{height:42px;border-radius:var(--rs);padding:0 12px;text-align:left;background:var(--card);border:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;transition:border-color .2s}
.field.me{color:var(--car);font-weight:500}
.field.ph{color:var(--text3)}
.field:active{border-color:var(--gold)}
#swap{transition:transform .35s var(--spring)}
#swap.spin{transform:rotate(180deg)}
.modes{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:8px 2px 0;padding:4px;border-radius:12px;background:rgba(0,0,0,.18)}
.ink{position:absolute;top:4px;bottom:4px;left:4px;border-radius:9px;background:rgba(255,255,255,.07);background:color-mix(in srgb,var(--mode) 18%,transparent);
  border:1.5px solid var(--mode);transition:transform .38s var(--spring),width .38s var(--spring),border-color .25s,background .25s;pointer-events:none}
.mode{position:relative;z-index:1;height:58px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--text2);transition:color .25s}
.mode svg{width:22px;height:22px;transition:transform .3s var(--spring)}
.mode .mt{font-size:12px;font-weight:600;white-space:nowrap;min-height:16px}
.mode .mt.wait{width:30px;height:8px;min-height:8px;margin-top:4px;border-radius:4px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));
  background-size:200% 100%;animation:shim 1.1s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.mode.on{color:var(--mode)}
.mode.on svg{transform:scale(1.1)}
.mode .tick{position:absolute;top:3px;right:6px;width:15px;height:15px;border-radius:50%;background:var(--mode);color:#0B1426;
  display:grid;place-items:center;transform:scale(0);transition:transform .3s var(--spring)}
.mode .tick svg{width:10px;height:10px}
.mode.on .tick{transform:scale(1)}
.dir-opts{display:flex;align-items:center;gap:8px;padding:8px 6px 0;overflow-x:auto;scrollbar-width:none}
.dir-opts::-webkit-scrollbar{display:none}
.mini{flex:none;height:32px;padding:0 12px;border-radius:16px;font-size:13px;font-weight:500;background:var(--card);border:1px solid var(--line2);color:var(--text2);
  display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,border-color .2s}
.mini.on{background:rgba(212,168,67,.16);border-color:var(--gold);color:var(--gold)}
.mini svg{width:15px;height:15px}

/* ---------- bottom sheet ---------- */
.sheet{position:absolute;left:0;right:0;top:0;height:100%;z-index:25;transform:translate3d(0,110vh,0);will-change:transform;
  display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--line2);box-shadow:0 -8px 40px rgba(0,0,0,.4);
  max-width:620px;margin:0 auto;touch-action:none}
.grab-zone{flex:none;height:26px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.sheet-body{flex:1;overflow:hidden;padding:0 16px calc(var(--sb) + 30px);touch-action:none;overscroll-behavior:contain}
.sheet.full .sheet-body{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.sk{height:14px;border-radius:7px;margin:10px 0;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:shim 1.2s linear infinite}
.place-t{font:600 21px/1.25 Poppins,sans-serif;margin:2px 0 4px}
.place-s{color:var(--text2);font-size:14px}
.place-l{color:var(--text3);font-size:13px;margin-top:2px}
.acts{display:flex;gap:8px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.acts::-webkit-scrollbar{display:none}
.btn{flex:none;height:44px;padding:0 18px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;
  transition:transform .15s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn svg{width:19px;height:19px}
.btn.cta{background:var(--cta);color:#fff;box-shadow:0 6px 18px rgba(232,101,46,.35)}
.btn.cta:hover{background:var(--cta2)}
.btn.go{background:var(--cta);color:#fff;min-width:132px;height:48px;border-radius:24px;font-size:16px;box-shadow:0 6px 22px rgba(232,101,46,.4)}
.btn.go:hover{background:var(--cta2)}
.btn.ghost{background:var(--card);border:1px solid var(--line2);color:var(--text)}
.btn.ghost.on{color:var(--gold);border-color:rgba(212,168,67,.5)}
.btn.ghost svg{color:var(--gold)}
.rs{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rs-time{font:600 26px/1.15 Poppins,sans-serif;color:var(--ok)}
.rs-time.slow{color:var(--gold)}
.rs-dist{color:var(--text2);font-size:16px}
.rs-via{color:var(--text2);font-size:14px;margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{height:24px;padding:0 9px;border-radius:12px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.06);color:var(--text2)}
.badge.g{background:rgba(52,199,89,.14);color:#5EDB7F}
.badge.y{background:rgba(212,168,67,.15);color:var(--gold)}
.badge.r{background:rgba(255,69,58,.14);color:#FF7A70}
.badge.b{background:rgba(74,158,255,.14);color:#7CB8FF}
.sub-h{font:600 13px Poppins,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin:20px 0 8px}
.alts{display:flex;flex-direction:column;gap:8px}
.alt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);text-align:left;
  transition:border-color .25s,background .25s}
.alt.on{border-color:var(--mode);background:color-mix(in srgb,var(--mode) 9%,var(--card))}
.alt-l{flex:1;min-width:0}
.alt-t{font-weight:600}
.alt-s{font-size:13px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:14px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.step-ic{width:34px;min-width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card);color:var(--text)}
.step-ic svg{width:24px;height:24px}
.step-t{font-size:15px}
.step-s{font-size:13px;color:var(--text3);margin-top:2px}
.note{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);font-size:13.5px;color:var(--text2)}
.note b{color:var(--gold)}
.note a{color:var(--gold);font-weight:600;text-decoration:none}
.err{padding:18px 4px;color:var(--text2)}
.err b{display:block;color:var(--text);font:600 17px Poppins,sans-serif;margin-bottom:4px}
.list-h{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.list-h h3{margin:0;font-size:18px}
.peek-end{height:1px}

/* ---------- navigation ---------- */
.nav-top{position:absolute;z-index:30;left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);top:calc(var(--st) + 8px);max-width:560px;
  animation:sdown .35s var(--ease) both}
.ban{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:#0E6B43;color:#fff;box-shadow:var(--sh2);
  transition:background .4s}
.ban.pre{background:#1B2A4D}
.ban.arr{background:#0E5A9E}
.ban.off{background:#5A3A12}
.ban-ic{width:60px;min-width:60px;height:60px;display:grid;place-items:center}
.ban-ic svg{width:56px;height:56px}
.ban-main{flex:1;min-width:0}
.ban-dist{font:700 28px/1.05 Poppins,sans-serif;letter-spacing:-.3px;display:inline-block;transform-origin:0 70%;transition:transform .35s var(--ease),color .35s}
/* the turn is close: the distance grows and turns yellow; at the turn the banner flashes */
.ban.near .ban-dist{color:#FFD60A;transform:scale(1.14)}
.ban.now .ban-dist{color:#fff;transform:scale(1.22)}
.ban.now{animation:turnflash .9s ease-out}
@keyframes turnflash{0%{background:#1FB866}100%{background:#0E6B43}}
.faster{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;margin-top:6px;padding:10px 10px 10px 14px;border-radius:16px;background:rgba(17,29,51,.96);border:1px solid rgba(52,199,89,.45);box-shadow:var(--sh);
  animation:sdown .3s var(--ease) both}
.faster .t{flex:1;min-width:0;font-size:14px;line-height:1.3}
.faster .t b{display:block;color:var(--ok);font:600 15px/1.25 Poppins,sans-serif}
.faster .btn{height:40px;min-width:44px;padding:0 14px}
.faster .fx{width:40px;padding:0;display:grid;place-items:center}
.faster .fx svg{width:18px;height:18px}
.faster i{position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:2px;background:var(--ok);transform-origin:0 50%;animation:fshrink 15s linear both}
@keyframes fshrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.ban-txt{font:500 17px/1.25 Inter,sans-serif;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ban-sub{display:flex;gap:8px;margin-top:6px;align-items:flex-start}
.then{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:12px;background:#0A5333;color:#E6FFF1;font-weight:600;font-size:14px;box-shadow:var(--sh);
  animation:sdown .3s var(--ease) both}
.then svg{width:22px;height:22px}
.lanes{display:inline-flex;gap:2px;height:40px;padding:4px 8px;border-radius:12px;background:#0A5333;box-shadow:var(--sh);animation:sdown .3s var(--ease) both}
.lanes i{width:28px;display:grid;place-items:center;opacity:.35}
.lanes i.v{opacity:1}
.lanes i svg{width:24px;height:24px}
.pv{display:flex;gap:8px;margin-top:6px}
.pv button{flex:1;height:44px;border-radius:12px;background:rgba(17,29,51,.94);border:1px solid var(--line2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.pv button svg{width:20px;height:20px}
.pv span{align-self:center;min-width:64px;text-align:center;color:var(--text2);font-size:13px}
.nav-bot{position:absolute;z-index:30;left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);bottom:calc(var(--sb) + 8px);max-width:560px;margin:0 auto;
  display:flex;align-items:center;gap:4px;padding:8px;border-radius:22px;animation:sup .35s var(--ease) both}
@keyframes sup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.nb-x{width:52px;height:52px;min-width:52px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;transition:transform .15s}
.nb-x:active{transform:scale(.9)}
.nb-x svg{width:24px;height:24px}
.nb-mid{flex:1;min-width:0;text-align:center;padding:0 4px}
.nb-time{font:600 22px/1.1 Poppins,sans-serif;color:var(--ok)}
.nb-sub{font-size:13.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-btn{width:44px;height:44px;min-width:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--text);transition:transform .15s,color .2s}
.nb-btn:active{transform:scale(.9)}
.nb-btn svg{width:21px;height:21px}
.nb-btn.on{color:var(--gold)}
.nav-side{position:absolute;z-index:29;left:calc(var(--sl) + 12px);bottom:calc(var(--sb) + 104px);display:flex;align-items:flex-end;gap:8px}
.speed{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(17,29,51,.95);border:1px solid var(--line2);box-shadow:var(--sh);transition:background .3s,color .3s}
.speed b{font:700 22px/1 Poppins,sans-serif}
.speed small{font-size:10px;color:var(--text2);margin-top:2px}
.speed.over{background:var(--bad);color:#fff}
.speed.over small{color:#fff}
.limit{width:50px;height:50px;border-radius:50%;background:#fff;border:5px solid #E0242A;display:grid;place-items:center;color:#111;font:700 18px Poppins,sans-serif;box-shadow:var(--sh);
  animation:pop2 .35s var(--spring) both}
@keyframes pop2{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.recenter{position:absolute;z-index:31;left:50%;bottom:calc(var(--sb) + 112px);transform:translateX(-50%);height:44px;padding:0 18px;border-radius:22px;
  display:flex;align-items:center;gap:8px;background:rgba(17,29,51,.96);border:1px solid var(--line2);box-shadow:var(--sh2);font-weight:600;color:var(--car);
  animation:sup .3s var(--ease) both}
.recenter svg{width:20px;height:20px}
.then.gps{background:#5A3A12;color:#FFE2B8}
.vlist{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.vopt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);text-align:left;transition:border-color .2s,background .2s}
.vopt b{display:block;font:600 15px Poppins,Inter,sans-serif}
.vopt small{display:block;color:var(--text3);font-size:12.5px}
.vopt .vdot{width:20px;height:20px;min-width:20px;border-radius:50%;border:2px solid var(--text3);position:relative}
.vopt.on{border-color:var(--gold);background:rgba(212,168,67,.08)}
.vopt.on .vdot{border-color:var(--gold)}
.vopt.on .vdot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--gold)}
.stop-pin{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1a1405;border:2.5px solid #fff;display:grid;place-items:center;font:700 13px Poppins,sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.mini.stopc{background:rgba(212,168,67,.14);border-color:rgba(212,168,67,.45);color:var(--gold)}
.mini.stopc b{width:18px;height:18px;border-radius:50%;background:var(--gold);color:#1a1405;display:grid;place-items:center;font-size:11px}
.resume{display:flex;align-items:center;gap:12px}
.resume .row-tx{flex:1}
body.big .ban-dist{font-size:36px}
body.big .ban-txt{font-size:21px;-webkit-line-clamp:3}
body.big .ban-ic,body.big .ban-ic svg{width:70px;height:70px;min-width:70px}
body.big .nb-time{font-size:27px}
body.big .nb-sub{font-size:15px}
body.big .speed{width:78px;height:78px}
body.big .speed b{font-size:28px}
body.big .nb-btn{width:50px;height:50px;min-width:50px}
body.big .then,body.big .lanes{height:44px;font-size:16px}

/* ---------- level visibility ---------- */
body:not([data-lvl=home]):not([data-lvl=list]):not([data-lvl=place]) .top{transform:translateY(-130%);opacity:0;pointer-events:none}
body:not([data-lvl=home]) #chips,body:not([data-lvl=home]) #nearChips{display:none}

/* ---------- pick on map ---------- */
.pick{position:absolute;inset:0;z-index:24;pointer-events:none}
.pick-pin{position:absolute;left:50%;top:50%;width:34px;height:46px;margin:-46px 0 0 -17px;transition:transform .2s}
.pick-pin.lift{transform:translateY(-10px)}
.pick-pin svg{width:34px;height:46px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.pick-bar{position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 16px);max-width:560px;margin:0 auto;padding:12px;border-radius:18px;display:flex;align-items:center;gap:10px;pointer-events:auto}
.pick-bar .t{flex:1;min-width:0}
.pick-bar .t b{display:block}
.pick-bar .t span{font-size:13px;color:var(--text3)}
.pick-top{position:absolute;left:8px;top:calc(var(--st) + 8px);pointer-events:auto;border-radius:50%}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:60;background:rgba(3,7,16,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{width:100%;max-width:560px;max-height:86vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(var(--sb) + 20px);background:var(--surface);
  animation:sup2 .35s var(--ease) both;touch-action:pan-y}
@keyframes sup2{from{transform:translateY(100%)}to{transform:none}}
.modal-card h3{font-size:18px;margin:12px 0 12px}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.type{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px;color:var(--text2)}
.type i{width:100%;aspect-ratio:1.3;border-radius:12px;border:2px solid transparent;display:block;transition:border-color .2s}
.type.on{color:var(--gold);font-weight:600}
.type.on i{border-color:var(--gold)}
.t-dark{background:linear-gradient(135deg,#0B1426 30%,#1C2D4F 31%,#1C2D4F 36%,#0B1426 37%),#0B1426}
.t-light{background:linear-gradient(135deg,#eef0f3 30%,#fff 31%,#fff 36%,#eef0f3 37%),#eef0f3}
.t-auto{background:linear-gradient(135deg,#eef0f3 49.5%,#0B1426 50.5%)}
.t-sat{background:radial-gradient(circle at 30% 40%,#4c6b3a,#24361f 60%,#1a2617)}
.t-hyb{background:linear-gradient(118deg,transparent 46%,rgba(255,214,120,.95) 47%,rgba(255,214,120,.95) 50%,transparent 51%),linear-gradient(28deg,transparent 58%,rgba(255,255,255,.75) 59%,rgba(255,255,255,.75) 61%,transparent 62%),radial-gradient(circle at 30% 40%,#4c6b3a,#24361f 60%,#1a2617)}
.types.five{grid-template-columns:repeat(5,minmax(0,1fr))}
/* 22 Oct 2026: S Hari offices on the map (logo pin) */
.ofc-pin{width:38px;height:38px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:#fff;border:2px solid var(--gold);box-shadow:0 6px 16px rgba(0,0,0,.45);display:grid;place-items:center;cursor:pointer}
.ofc-pin img{width:30px;height:auto;transform:rotate(45deg)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}
.tg span small{display:block;color:var(--text3);font-size:12.5px}
.sw{position:relative;width:48px;height:28px;border-radius:14px;background:#2B3A5C;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s var(--spring)}
.sw.on{background:var(--gold)}
.sw.on::after{transform:translateX(20px)}
.seg{display:inline-flex;border-radius:10px;background:var(--card);padding:3px;gap:2px}
.seg button{height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--gold);color:#1a1405}
.prog{height:6px;border-radius:3px;background:var(--card);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 24px);z-index:95;max-width:min(92vw,440px);padding:12px 18px;border-radius:14px;
  background:#1E2C4E;border:1px solid var(--line2);box-shadow:var(--sh2);font-size:14px;transform:translate(-50%,30px);opacity:0;pointer-events:none;
  transition:transform .35s var(--spring),opacity .25s}
.toast.on{transform:translate(-50%,0);opacity:1}
body[data-lvl=nav] .toast{bottom:calc(var(--sb) + 112px)}

@media (min-width:900px){
  .sheet{left:12px;right:auto;width:420px;margin:0;border-radius:22px 22px 0 0}
  .dir{right:auto;width:420px}
  .top{right:auto;width:460px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .me-pulse{display:none}
}
/* ---------- nv4: weather, elevation, trips, battery saver, high contrast ---------- */
.mode .md{font-size:10px;color:var(--text3);white-space:nowrap;line-height:1;min-height:10px}
.mode.on .md{color:inherit;opacity:.75}
.wx{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);font-size:13.5px;color:var(--text2)}
.wx .wx-e{font-size:26px;line-height:1}
.wx b{color:var(--text);font:600 18px Poppins,sans-serif}
.wx .wx-h{display:flex;gap:10px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.wx .wx-h span{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--text3);min-width:30px}
.wx .wx-h span i{font-style:normal;font-size:15px}
.wx-warn{border-color:rgba(255,214,10,.35);background:rgba(255,214,10,.07)}
.wx-warn .acts{margin-top:8px}
.elev{margin-top:14px;padding:12px 14px 10px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--text2)}
.elev svg{display:block;width:100%;height:64px;margin:8px 0 4px}
.elev .el-row{display:flex;flex-wrap:wrap;gap:6px 14px}
.elev .el-row b{color:var(--text)}
.trip{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.trip:last-child{border-bottom:0}
.trip .tr-ic{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--m) 16%,transparent);color:var(--m)}
.trip .tr-ic svg{width:20px;height:20px}

/* ---------- ai1 add-on modules ---------- */
/* @@CSS:AI@@ */
/* ---------- S Hari AI Guide (ai1) ---------- */
/* fab: bottom-left, rides on the sheet like the attribution (P8); only where a rider browses */
.ai-fab{position:absolute;left:calc(var(--sl) + 12px);bottom:clamp(calc(var(--sb) + 18px),calc(100vh - var(--sheet-top) + 36px),62vh);z-index:15;
  height:50px;padding:0 16px 0 5px;border-radius:25px;display:none;align-items:center;gap:8px;color:var(--text);
  background:linear-gradient(145deg,rgba(27,42,77,.96),rgba(11,20,38,.96));border:1px solid rgba(212,168,67,.45);
  box-shadow:var(--sh),0 0 22px rgba(212,168,67,.16);font:700 14px Poppins,Inter,sans-serif;letter-spacing:.5px;
  transition:opacity .25s,transform .15s}
.ai-fab b{color:var(--gold)}
.ai-fab:active{transform:scale(.94)}
body[data-lvl=home] .ai-fab,body[data-lvl=list] .ai-fab,body[data-lvl=place] .ai-fab,body[data-lvl=dir] .ai-fab{display:inline-flex}
.ctrls.fade~.ai-fab,body.ai-on .ai-fab{opacity:0;pointer-events:none}
.ai-ring{width:40px;height:40px;min-width:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;
  background:radial-gradient(circle at 35% 30%,#2A3D6B,#0F1A30 70%);box-shadow:0 0 0 2px var(--gold) inset,0 0 12px rgba(212,168,67,.4)}
.ai-ring.sm{width:30px;height:30px;min-width:30px;font-size:15px}
.ai-navask{justify-content:flex-start;gap:12px}

/* panel: a sheet from the bottom on phones, a docked card bottom-left on wide screens */
.ai-panel{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.ai-scrim{position:absolute;inset:0;background:rgba(3,7,16,.42);pointer-events:auto;animation:aiFade .25s both}
.ai-card{position:relative;pointer-events:auto;width:100%;max-width:560px;height:86vh;max-height:92vh;display:flex;flex-direction:column;
  border-radius:26px 26px 0 0;padding-bottom:var(--sb);color:var(--text);overflow:hidden;
  background:linear-gradient(180deg,rgba(27,42,77,.97) 0%,rgba(17,29,51,.97) 38%,rgba(11,20,38,.98) 100%);
  border:1px solid rgba(212,168,67,.24);border-bottom:0;box-shadow:0 -14px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);animation:aiUp .38s var(--ease) both}
.ai-card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
@keyframes aiUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes aiFade{from{opacity:0}to{opacity:1}}
@media (min-width:760px){
  .ai-panel{justify-content:flex-start;align-items:flex-end;padding:0 0 calc(var(--sb) + 16px) calc(var(--sl) + 16px)}
  .ai-scrim{background:rgba(3,7,16,.18)}
  .ai-card{width:420px;height:min(78vh,700px);border-radius:24px;border-bottom:1px solid rgba(212,168,67,.24);box-shadow:var(--sh2),0 0 40px rgba(212,168,67,.08)}
}

/* header */
.ai-head{flex:none;display:flex;align-items:center;gap:10px;padding:12px 6px 6px 14px;position:relative}
.ai-ava{width:30px;height:30px;min-width:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;align-self:flex-start;
  background:radial-gradient(circle at 35% 30%,#2A3D6B,#0F1A30 70%);box-shadow:0 0 0 1.5px var(--gold) inset}
.ai-ava.lg{width:42px;height:42px;min-width:42px;font-size:21px;align-self:center;box-shadow:0 0 0 2px var(--gold) inset,0 0 14px rgba(212,168,67,.35)}
.ai-ht{flex:1;min-width:0}
.ai-ht h2{margin:0;font:600 16.5px Poppins,Inter,sans-serif;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-ht small{display:block;color:var(--text3);font-size:11.5px;line-height:1.35;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-menu{position:absolute;right:10px;top:56px;z-index:3;min-width:236px;padding:6px;border-radius:16px;background:var(--surface);
  border:1px solid var(--line2);box-shadow:var(--sh2);animation:aiFade .15s both}
.ai-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:0 12px;border-radius:11px;text-align:left;font-size:14px}
.ai-menu button:active{background:rgba(255,255,255,.06)}

.ai-menu #aiClear{justify-content:flex-start;color:#FF8A80}
.ai-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 14px 8px}
.ai-bar .seg{min-width:0;overflow-x:auto;scrollbar-width:none}
.ai-bar .seg button{padding:0 9px;flex:none}
.ai-off,.ai-badge{height:24px;padding:0 9px;border-radius:12px;display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;
  background:rgba(255,159,10,.14);color:#FFB547}
.ai-badge{margin-bottom:6px}

/* messages */
.ai-msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:12px;padding:10px 12px 14px;border-top:1px solid var(--line);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14px);mask-image:linear-gradient(180deg,transparent 0,#000 14px)}
.ai-msg{display:flex;gap:8px;align-items:flex-end;animation:aiIn .28s var(--ease) both}
@keyframes aiIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ai-msg.user{justify-content:flex-end}
.ai-bub{max-width:min(86%,380px);padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.ai-msg.bot .ai-bub{background:rgba(27,42,77,.85);border:1px solid var(--line2);border-bottom-left-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.ai-msg.user .ai-bub{background:linear-gradient(135deg,#E9BB5A,#D4A843 55%,#B8892B);color:#1a1405;font-weight:500;border-bottom-right-radius:6px;
  box-shadow:0 4px 14px rgba(212,168,67,.25)}
.ai-msg.bot .ai-tx b{color:var(--gold);font-weight:600}
.ai-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ai-acts .btn{height:44px;padding:0 15px;font-size:13.5px;border-radius:22px}
.ai-acts .btn.ghost{background:rgba(11,20,38,.6)}
.ai-rows{margin:8px -4px 0;display:flex;flex-direction:column;gap:2px}
.ai-row{display:flex;width:100%;align-items:center;gap:10px;min-height:48px;padding:6px 8px;border-radius:12px;text-align:left;transition:background .15s}
.ai-row:active{background:rgba(255,255,255,.07)}
.ai-re{width:32px;height:32px;min-width:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:rgba(212,168,67,.12)}
.ai-rt{flex:1;min-width:0;display:flex;flex-direction:column}
.ai-rt b{font-weight:600;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-rt small{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-rd{flex:none;font-size:12px;color:var(--gold);font-weight:600;text-align:right;max-width:40%}
.ai-dots{display:flex;gap:5px;padding:4px 2px}
.ai-dots i{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.35;animation:aiDot 1.1s infinite ease-in-out}
.ai-dots i:nth-child(2){animation-delay:.15s}
.ai-dots i:nth-child(3){animation-delay:.3s}
@keyframes aiDot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

/* quick chips sit right above the input: the thumb zone */
.ai-quick.chips{flex:none;margin:0;padding:8px 12px 4px;border-top:1px solid var(--line);touch-action:pan-x}
.ai-quick .chip{height:38px;background:rgba(27,42,77,.9)}
.ai-quick .chip:active{background:rgba(212,168,67,.18)}

/* input row: 56 px+ */
.ai-in{flex:none;display:flex;align-items:center;gap:6px;min-height:64px;padding:6px 10px 10px}
.ai-in input{flex:1;min-width:0;height:50px;padding:0 18px;border-radius:25px;font-size:16px;color:var(--text);

.ai-in input::placeholder{color:var(--text3)}
.ai-mic.on,.ai-bigmic.on{color:var(--bad)}
.ai-mic.on{animation:aiPulse 1.2s infinite}
.ai-send{width:50px;height:50px;min-width:50px;border-radius:50%;display:grid;place-items:center;color:#1a1405;
  background:linear-gradient(145deg,#E9BB5A,#C9982F);box-shadow:0 6px 18px rgba(212,168,67,.3);transition:transform .15s}
.ai-send:active{transform:scale(.92)}
.ai-send svg{width:21px;height:21px}
@keyframes aiPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,69,58,.45)}50%{box-shadow:0 0 0 8px rgba(255,69,58,0)}}

/* P7: voice first while driving — short panel, one big mic, 2-line bubbles, 56 px actions */
.ai-drive{display:none;flex:none;align-items:center;gap:16px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.ai-bigmic{width:76px;height:76px;min-width:76px;border-radius:50%;display:grid;place-items:center;color:#1a1405;
  background:linear-gradient(145deg,#E9BB5A,#C9982F);box-shadow:0 8px 26px rgba(212,168,67,.4)}
.ai-bigmic svg{width:34px;height:34px}

.ai-dtx{display:flex;flex-direction:column;gap:8px;min-width:0}

.ai-dtx .btn{height:44px}

.sr-label{display:none;position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);max-width:140px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font:600 11.5px/1.2 Inter,sans-serif;font-style:normal;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.75);pointer-events:none}
.sr-m.lbl .sr-label{display:block}
body.big .sr-label{font-size:13.5px;max-width:180px}
/* the departures card under the place card */
.sr-card{margin-top:14px;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid rgba(212,168,67,.28);font-size:13.5px;color:var(--text2)}
.sr-head{display:flex;align-items:center;gap:10px}
.sr-em{width:40px;height:40px;min-width:40px;border-radius:12px;display:grid;place-items:center;color:var(--gold);background:rgba(212,168,67,.14)}
.sr-em svg{width:22px;height:22px}
.sr-tx{flex:1;min-width:0}
.sr-t{font:600 15px/1.3 Poppins,sans-serif;color:var(--text)}
.sr-s{font-size:12.5px;color:var(--text3);margin-top:1px}
.sr-head .badge{flex:none}
.sr-sec{font:600 12px Poppins,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);margin:14px 0 6px}
.sr-sec small{font:500 11px Inter,sans-serif;letter-spacing:0;text-transform:none;margin-left:4px}
.sr-dep{display:flex;align-items:center;gap:12px;min-height:48px;padding:7px 0;border-top:1px solid var(--line)}
.sr-dep.dim{opacity:.62}
.sr-time{flex:none;min-width:56px;font:600 17px/1.1 Poppins,sans-serif;color:var(--text)}
.sr-time small{display:block;font:500 11px Inter,sans-serif;color:var(--text3);margin-top:2px}
.sr-dtx{flex:1;min-width:0}
.sr-dt{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-ds{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-size:12.5px;color:var(--text3)}
.sr-ds .badge{height:22px;font-size:11.5px}
.sr-wait{flex:none;max-width:38%;text-align:right;font-size:12.5px;color:var(--gold);font-weight:600;white-space:normal;line-height:1.25}
.sr-fare{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(212,168,67,.1);border:1px solid rgba(212,168,67,.3);color:var(--text)}
.sr-fare b{color:var(--gold);font-size:15px}
.sr-fare small{color:var(--text3)}
.sr-paused{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.35);color:var(--text);font-weight:500}
.sr-paused small{display:block;font-weight:400;color:var(--text2);margin-top:3px}
.sr-note{margin-top:10px;color:var(--text2);line-height:1.4}
.sr-note.sr-bd{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--text)}
.sr-approx{margin-top:8px;font-size:12px;color:var(--text3)}
/* the buttons are links (Book / Track / Call open other pages): keep the page's button look */
.sr-card .acts{margin:12px 0 0}
.sr-card .acts a.btn{text-decoration:none;color:var(--text)}
.sr-card .acts a.btn.cta{color:#fff}
body.big .sr-card{font-size:16px}
body.big .sr-time{font-size:20px}
body.big .sr-dt{white-space:normal}
/* @@END:CSS:SHGROUTE@@ */
