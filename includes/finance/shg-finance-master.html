    var i = E.loanInterest(st, loan, asOf);
    if (!(i.toExpense > 0)) return { ok: false, errors: ['लेख्न बाँकी ब्याज छैन।'] };
    return E.commit(st, user, { entity: loan.entity, date: asOf, memo: 'ब्याज खर्च लेखियो (accrual): ' + E.partyName(st, loan.lenderId), cat: 'interest_accrual',
      lines: [{ acc: '7110', party: loan.lenderId, sub: loan.id, dr: i.toExpense, cr: 0 }, { acc: '2070', party: loan.lenderId, sub: loan.id, dr: 0, cr: i.toExpense }] }, { level: 2 });
  };
  E.emi = function (P, annualRate, months) {
    if (!(months > 0)) return 0;
    var r = annualRate / 1200;
    if (!r) return Math.round(P / months);

  };
  E.emiSchedule = function (P, annualRate, months) {
    var e = E.emi(P, annualRate, months), r = annualRate / 1200, bal = P, rows = [];
    for (var i = 1; i <= months; i++) {

    return rows;
  };
  E.simpleInterest = function (P, rate, days, basis) { return Math.round(P * rate / 100 * days / (basis || 365)); };
  E.compoundInterest = function (P, rate, years, n) { return Math.round(P * (Math.pow(1 + rate / 100 / n, n * years) - 1)); };

  /* ------------------------------------------------------------------
     13. PAYROLL
     ------------------------------------------------------------------ */
  E.EMP_CATS = { director: 'CEO / निर्देशक', gm: 'जनरल म्यानेजर', booking: 'बुकिङ म्यानेजर', counter: 'काउन्टर अपरेटर', call: 'कल सेन्टर',

  E.payrollCalc = function (it) {

  /** postDate: defaults to month-end, but never later than today (a current-month run is booked today). */
  E.postPayroll = function (st, entity, month, items, user, postDate) {
    var date = postDate || E.monthEnd(month + '-01');
    if (date > E.today()) date = E.today();
    if (date < month + '-01') return { ok: false, errors: ['तलब लेख्ने मिति सोही महिनाभित्र हुनुपर्छ।'] };
    if (st.payrollRuns.some(function (r) { return r.entity === entity && r.month === month && (r.status === 'posted' || r.status === 'paid' || r.status === 'pending'); }))
      return { ok: false, errors: [month + ' को तलब पहिले नै लेखिसकिएको छ।'] };
    var lines = [], bad = [];

      if (!c.gross) return;

      if (it.advance) lines.push({ acc: '1230', party: emp.id, dr: 0, cr: it.advance, memo: 'अग्रिम कट्टी' });
      if (it.tds) lines.push({ acc: '2050', dr: 0, cr: it.tds, memo: 'TDS ' + emp.name });

      status: 'pending', journalId: '', paidJournalId: '', createdAt: new Date().toISOString() };
    st.payrollRuns.push(run);
    var r = E.commit(st, user, { entity: entity, date: date, memo: month + ' को तलब लेखियो', cat: 'payroll', source: { type: 'payroll', id: run.id },
      idem: 'payroll:' + entity + ':' + month, lines: lines }, { level: 2, hook: { name: 'payroll', args: { id: run.id } } });
    if (!r.ok) st.payrollRuns.pop();
    r.run = run;

  };
  HOOKS.payroll = function (st, args, j, what) { var r = E.find(st.payrollRuns, args.id); if (r) { r.status = what === 'posted' ? 'posted' : 'rejected'; if (j) r.journalId = j.id; } };
  E.payPayroll = function (st, runId, account, date, user) {
    var run = E.find(st.payrollRuns, runId);
    if (!run || run.status !== 'posted') return { ok: false, errors: ['पहिले तलब लेख्नुहोस् (posted)।'] };
    var accr = E.find(st.journals, run.journalId);
    if (accr && date < accr.date) return { ok: false, errors: ['भुक्तानी मिति (' + date + ') तलब लेखेको मिति (' + accr.date + ') भन्दा अघि हुन सक्दैन।'] };
    var lines = [], tot = 0;
    run.items.forEach(function (it) { if (it.net > 0) { lines.push({ acc: '2030', party: it.empId, dr: it.net, cr: 0 }); tot += it.net; } });
    lines.push({ acc: account, dr: 0, cr: tot });
    return E.commit(st, user, { entity: run.entity, date: date, memo: run.month + ' को तलब भुक्तानी', cat: 'out_salary', idem: 'payrollpay:' + run.id, lines: lines },
      { level: E.requiredLevel(st, 'out', tot, false), hook: { name: 'payrollPaid', args: { id: run.id } } });
  };
  HOOKS.payrollPaid = function (st, args, j, what) { var r = E.find(st.payrollRuns, args.id); if (r && what === 'posted') { r.status = 'paid'; r.paidJournalId = j.id; } };

  /** Advance settlement: bills submitted (expense) + unused cash returned. */
  E.settleAdvance = function (st, d, user) {
    var bal = E.balance(st, d.entity, '1230', { party: d.empId, to: d.date });
    var used = d.used || 0, ret = d.returned || 0;
    if (used + ret <= 0) return { ok: false, errors: ['खर्च वा फिर्ता रकम लेख्नुहोस्।'] };
    if (used + ret > bal) return { ok: false, errors: ['अग्रिम बाँकी ' + fmt(bal) + ' मात्र छ।'] };
    var lines = [];
    if (used) lines.push({ acc: d.expenseAcc, dr: used, cr: 0, trip: d.trip || undefined });
    if (ret) lines.push({ acc: d.account, dr: ret, cr: 0 });
    lines.push({ acc: '1230', party: d.empId, dr: 0, cr: used + ret });
    lines.forEach(function (l) { if (!l.trip) delete l.trip; });
    return E.commit(st, user, { entity: d.entity, date: d.date, memo: 'अग्रिम फर्छ्यौट: ' + E.partyName(st, d.empId), cat: 'adv_settle', lines: lines }, { level: 1 });
  };

  /* ------------------------------------------------------------------
     14. TRIPS & VEHICLES
     ------------------------------------------------------------------ */
  E.DIRS = { up: 'गुजरात → रुपैडिहा', down: 'रुपैडिहा → गुजरात' };
  E.tripResult = function (st, trip) {
    var rev = 0, refunds = 0, costs = {}, direct = 0;
    E.lines(st, { entity: trip.entity, trip: trip.id }).forEach(function (x) {
      var a = E.account(st, x.l.acc);
      if (a.code === '4015') refunds += x.l.dr - x.l.cr;
      else if (a.type === 'revenue') rev += x.l.cr - x.l.dr;
      else if (a.type === 'expense') { var v = x.l.dr - x.l.cr; costs[a.code] = (costs[a.code] || 0) + v; direct += v; }
    });
    var net = rev - refunds, contribution = net - direct;
    var cap = trip.capacity || 0;
    return { gross: rev, refunds: refunds, net: net, costs: costs, direct: direct, contribution: contribution,
      afterOverhead: contribution - (st.settings.overheadPerTrip || 0), occupancy: cap ? (trip.pax || 0) * 100 / cap : 0 };
  };
  E.tripRows = function (st, entity, from, to) {
    return st.trips.filter(function (t) { return t.entity === entity && t.date >= from && t.date <= to; })
      .map(function (t) { var r = E.tripResult(st, t); r.trip = t; r.vehicle = E.find(st.vehicles, t.vehicleId); return r; })
      .sort(function (a, b) { return a.trip.date < b.trip.date ? 1 : -1; });
  };
  E.groupTrips = function (rows, keyFn) {
    var g = {};
    rows.forEach(function (r) {
      var k = keyFn(r), o = g[k] || (g[k] = { key: k, trips: 0, pax: 0, net: 0, direct: 0, contribution: 0 });
      o.trips++; o.pax += r.trip.pax || 0; o.net += r.net; o.direct += r.direct; o.contribution += r.contribution;
    });
    return Object.keys(g).map(function (k) { return g[k]; });
  };
  /** One sheet of trip expenses → one journal, every line tagged with the trip. */
  E.tripExpenses = function (st, trip, rows, account, date, user) {
    var lines = [], tot = 0;
    rows.forEach(function (r) { if (r.amount > 0) { lines.push({ acc: r.acc, dr: r.amount, cr: 0, trip: trip.id, memo: r.note || '' }); tot += r.amount; } });
    if (!tot) return { ok: false, errors: ['कम्तीमा एउटा खर्च लेख्नुहोस्।'] };
    lines.forEach(function (l) { if (!l.memo) delete l.memo; });

  };

  E.recordBill = function (st, b, user) {

      entity: b.entity, trip: b.trip || '', note: b.note || '', status: 'pending', journalId: '' };
    st.bills.push(bill);
    var l1 = { acc: b.acc, dr: b.amount, cr: 0 }; if (bill.trip) l1.trip = bill.trip;
    var r = E.commit(st, user, { entity: b.entity, date: b.date, memo: 'बिल: ' + E.partyName(st, b.vendorId) + (bill.billNo ? ' #' + bill.billNo : ''), ref: bill.billNo,
      cat: 'bill', source: { type: 'bill', id: bill.id }, idem: bill.billNo ? 'bill:' + b.vendorId + ':' + bill.billNo : '',
      lines: [l1, { acc: '2010', party: b.vendorId, sub: bill.id, dr: 0, cr: b.amount }] }, { level: 1, hook: { name: 'bill', args: { id: bill.id } } });
    if (!r.ok || r.duplicate) st.bills.pop();

  HOOKS.bill = function (st, args, j, what) { var b = E.find(st.bills, args.id); if (b) { b.status = what === 'posted' ? 'open' : 'rejected'; if (j) b.journalId = j.id; } };

  /** FIFO: vendor payments settle the oldest bills first. */
  E.vendorAging = function (st, entity, asOf) {
    var out = [];
    st.people.filter(function (p) { return p.kind === 'vendor'; }).forEach(function (v) {
      var bills = st.bills.filter(function (b) { return b.vendorId === v.id && b.entity === entity && b.status === 'open' && b.date <= asOf; })
        .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      // Whatever is no longer owed has been settled; settle the oldest bills first.
      var billTotal = E.sum(bills, function (b) { return b.amount; });
      var owed = Math.max(0, E.balance(st, entity, '2010', { party: v.id, to: asOf }));
      var paid = Math.max(0, billTotal - owed);
      bills.forEach(function (b) {
        var use = Math.min(paid, b.amount); paid -= use;
        var open = b.amount - use; if (!open) return;
        var late = E.daysBetween(b.due, asOf);
        out.push({ vendor: v.name, vendorId: v.id, bill: b, open: open, late: late,
          bucket: late <= 0 ? 'चालु' : late <= 30 ? '१–३०' : late <= 60 ? '३१–६०' : late <= 90 ? '६१–९०' : '९०+' });
      });
    });
    return out;
  };

  E.addAsset = function (st, a, user) {

    var credit = a.vendorId ? { acc: '2010', party: a.vendorId, dr: 0, cr: a.cost } : { acc: a.account, dr: 0, cr: a.cost };
    var r = E.commit(st, user, { entity: asset.entity, date: a.date, memo: 'स्थिर सम्पत्ति खरिद: ' + a.name, cat: 'asset', source: { type: 'asset', id: asset.id },

  E.accumulatedDep = function (st, asset, asOf) { return -E.balance(st, asset.entity, '1590', { sub: asset.id, to: asOf }); };
  E.monthlyDep = function (asset) { return Math.round((asset.cost - asset.salvage) / asset.lifeMonths); };
  E.runDepreciation = function (st, entity, month, user) {
    if (st.depRuns.some(function (d) { return d.entity === entity && d.month === month && !d.reversed; })) return { ok: false, errors: [month + ' को ह्रास पहिले नै लेखिसकियो।'] };

  /* ------------------------------------------------------------------
     16. BANK RECONCILIATION
     ------------------------------------------------------------------ */
  E.parseCSV = function (text) {
    var rows = [], row = [], cur = '', q = false;
    text = String(text).replace(/^﻿/, '');
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
  };
  function normDate(s) {
    s = String(s).trim();
    var m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s);
    if (m) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
    m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(s);     // Indian banks: DD/MM/YYYY
    if (m) { var y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + pad(+m[2]) + '-' + pad(+m[1]); }
    return '';
  }
  E.normDate = normDate;
  /** Map a bank CSV to {date, desc, amount(+in/−out), ref}. Accepts Amount or Debit/Credit columns. */
  E.statementFromCSV = function (rows) {
    if (!rows.length) return { lines: [], errors: ['फाइल खाली छ।'] };
    var h = rows[0].map(function (c) { return String(c).toLowerCase().trim(); });
    var idx = function (re) { for (var i = 0; i < h.length; i++) if (re.test(h[i])) return i; return -1; };
    var iD = idx(/date|मिति/), iDesc = idx(/desc|narration|particular|remark|विवरण/), iAmt = idx(/^amount|रकम/),
      iDr = idx(/debit|withdraw|dr\b/), iCr = idx(/credit|deposit|cr\b/), iRef = idx(/ref|utr|chq|cheque|txn/);
    if (iD < 0 || (iAmt < 0 && iDr < 0 && iCr < 0)) return { lines: [], errors: ['Date र Amount (वा Debit/Credit) स्तम्भ चाहिन्छ।'] };
    var out = [], errs = [];
    rows.slice(1).forEach(function (r, n) {

  ACT.unlock = function () { confirmBox('बन्द अवधि खोल्दा पुराना मितिमा इन्ट्री गर्न मिल्छ। CA लाई जानकारी दिनुहोस्।', function (why) { if (!why) return toast('कारण लेख्नुहोस्।', 'bad'); E.audit(B(), U_(), 'period.unlock', B().settings.lockDate + ' ' + why); B().settings.lockDate = ''; save(); render(); }, { reason: 'कारण', danger: true }); };
  LIVE.userRole = function (f) {

  /* backup / restore */
  function b64(u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function aesKey(pass, salt) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']).then(function (k) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
  }
  FORM.backup = function (f, v) {
    var b = B(), payload = { shgfm: 'book1', app: E.VERSION, exportedAt: new Date().toISOString(), mode: b.mode, checksum: E.sha256(JSON.stringify(b)), book: b };
    var name = 'shg-finance-' + b.mode + '-' + today();
    var fin = function () { S.meta.lastBackup = new Date().toISOString(); U.saveMeta(); E.audit(b, U_(), 'backup.export', v.pass ? 'encrypted' : 'plain'); save(); toast('ब्याकअप डाउनलोड भयो — सुरक्षित ठाउँमा राख्नुहोस्', 'ok'); render(); };
    if (!v.pass) { U.io.download(name + '.json', JSON.stringify(payload), 'application/json'); return fin(); }
    if (!window.crypto || !crypto.subtle) return toast('यो ब्राउजरमा इन्क्रिप्सन चल्दैन — HTTPS बाट खोल्नुहोस् वा पासवर्ड नराख्नुहोस्।', 'bad');
    var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    aesKey(v.pass, salt).then(function (k) { return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, new TextEncoder().encode(JSON.stringify(payload))); })
      .then(function (ct) { U.io.download(name + '.enc.json', JSON.stringify({ shgfm: 'enc1', salt: b64(salt), iv: b64(iv), data: b64(new Uint8Array(ct)) }), 'application/json'); fin(); })
      .catch(function (e) { toast('इन्क्रिप्ट हुन सकेन: ' + e.message, 'bad'); });
  };
  FORM.restore = function (f, v) {
    var file = $('input[type=file]', f).files[0]; if (!file) return toast('फाइल छान्नुहोस्।', 'bad');
    var rd = new FileReader();
    rd.onload = function () {
      var obj; try { obj = JSON.parse(rd.result); } catch (e) { return toast('फाइल पढ्न सकिएन।', 'bad'); }
      if (obj.shgfm === 'enc1') {
        if (!v.pass) return toast('यो फाइल इन्क्रिप्ट छ — पासवर्ड लेख्नुहोस्।', 'bad');
        aesKey(v.pass, unb64(obj.salt)).then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(obj.iv) }, k, unb64(obj.data)); })
          .then(function (pt) { check(JSON.parse(new TextDecoder().decode(pt))); }).catch(function () { toast('पासवर्ड मिलेन वा फाइल बिग्रिएको छ।', 'bad'); });
      } else check(obj);
    };
    rd.readAsText(file);
    function check(p) {
      if (!p || p.shgfm !== 'book1' || !p.book || !Array.isArray(p.book.journals)) return toast('यो SHG Finance ब्याकअप होइन।', 'bad');
      if (E.sha256(JSON.stringify(p.book)) !== p.checksum) return toast('checksum मिलेन — फाइल परिवर्तन भएको छ। रिस्टोर रोकियो।', 'bad');
      if (p.book.mode !== B().mode) return toast('यो ' + (p.book.mode === 'demo' ? 'डेमो' : 'वास्तविक') + ' किताबको ब्याकअप हो — सोही मोडमा मात्र रिस्टोर गर्नुहोस्।', 'bad');
      var unsafe = E.unsafeId(p.book);
      if (unsafe) return toast('ब्याकअपमा असामान्य मान (' + unsafe + ') — सुरक्षाका लागि रिस्टोर रोकियो।', 'bad');
      var bad = p.book.journals.filter(function (j) { return E.journalTotal(j) !== E.sum(j.lines, function (l) { return l.cr; }); }).length;
      if (bad) return toast(bad + ' जर्नल सन्तुलित छैनन् — रिस्टोर रोकियो।', 'bad');
      confirmBox('ब्याकअप: ' + esc(p.exportedAt.slice(0, 16).replace('T', ' ')) + ' · ' + p.book.journals.length + ' जर्नल · ' + p.book.users.length + ' प्रयोगकर्ता।<br>हालको किताब यसले बदलिन्छ। पहिले हालको ब्याकअप लिनुभयो?', function () {
        S.book = p.book; E.audit(S.book, U_(), 'backup.restore', p.exportedAt); save(); S.user = null; render(); toast('रिस्टोर भयो — फेरि लगइन गर्नुहोस्', 'ok');
      }, { title: 'रिस्टोर गर्ने?', danger: true, yes: 'रिस्टोर' });
    }
  };
  ACT.resetDemo = function () { confirmBox('डेमो किताब नयाँ काल्पनिक डाटासहित सुरुबाट बन्छ।', function () { U.lsDel(U.bookKey('demo')); S.book = E.buildDemo(today()); save(); S.user = null; render(); }); };

      if (w !== 'मेटाउनुहोस्') return toast('पुष्टि शब्द मिलेन — केही मेटिएन।', 'warn');
      var b = B(); U.io.download('shg-finance-real-before-erase-' + today() + '.json', JSON.stringify({ shgfm: 'book1', app: E.VERSION, exportedAt: new Date().toISOString(), mode: b.mode, checksum: E.sha256(JSON.stringify(b)), book: b }), 'application/json');
      U.lsDel(U.bookKey('real')); S.book = null; S.user = null; U.openBook(); render();
    }, { title: 'वास्तविक किताब मेटाउने?', reason: 'पुष्टि शब्द', danger: true, yes: 'मेटाउनुहोस्' });

  /* keyboard: Enter on a focusable KPI card behaves like a click */
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.matches && e.target.matches('[data-act][tabindex]')) { e.preventDefault(); e.target.click(); } });
