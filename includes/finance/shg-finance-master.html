      if (d.amount && E.journalTotal(j) === d.amount && j.date === d.date && j.cat && j.cat === d.cat) out.push({ j: j, why: 'उही मिति, रकम र प्रकार' });
    });
    return out;
  };

  /* ------------------------------------------------------------------
     9. MONEY IN / OUT  →  journal
     d = {dir, cat, amount, account (cash/bank code), party, trip, date,
          entity, ref, method, memo, tds, loanType, sub}
     ------------------------------------------------------------------ */
  /* Accounts whose open balance a payment/receipt is checked against (bug #18). */
  var OPEN_CHECK = { '2100': 1, '2110': 1, '2120': 1, '2020': 1, '2080': 1, '2030': 1, '1210': 1, '2990': 1, '2010': 1, '1220': 1, '1230': 1, '2040': 1 };
  E.OPEN_CHECK = OPEN_CHECK;
  E.buildMoneyJournal = function (st, d) {
    var c = E.cat(st, d.cat);
    if (!c) return { errors: ['कारोबारको प्रकार छान्नुहोस्।'] };
    var amt = d.amount, tds = d.tds || 0, lines = [];
    if (!(amt > 0) || amt !== Math.round(amt)) return { errors: ['रकम लेख्नुहोस्।'] };
    if (tds < 0 || tds >= amt) return { errors: ['TDS रकम मिलेन।'] };
    // Loan-aware categories: d.loan (or the older d.sub = loan id) picks the agreement.
    var loan = null;
    if (c.acc === '@loan' || c.id === 'out_interest') {
      var lid = d.loan || (d.sub && E.find(st.loans || [], d.sub) ? d.sub : '');
      if (lid) {
        loan = E.find(st.loans || [], lid);
        if (!loan) return { errors: ['ऋण सम्झौता भेटिएन।'] };
        if (d.entity && loan.entity && loan.entity !== d.entity) return { errors: ['यो ऋण अर्को कम्पनीको हो।'] };
      }
    }
    var acc = c.acc === '@loan' ? (loan ? loan.acc : E.LOAN_ACCS[d.loanType || 'director']) : c.acc;
    var party = loan ? loan.lenderId : d.party, sub = loan ? loan.id : d.sub;
    var counter = { acc: acc, party: party || undefined, trip: c.trip ? d.trip : undefined, sub: sub || undefined };
    var warnings = [], open = null, cur = (E.entity(st, d.entity) || {}).currency;
    if (c.dir === 'in') {
      lines.push({ acc: d.account, dr: amt, cr: 0 });
      lines.push(Object.assign({}, counter, { dr: 0, cr: amt }));
    } else {
      if (c.id === 'out_interest' && loan) {
        // Interest already expensed by "ब्याज खर्च लेख्ने" sits in 2070: clear that first,
        // only the rest is new interest expense (bug #0 — never expense it twice).
        var owed = Math.max(0, E.balance(st, loan.entity, '2070', { party: loan.lenderId, sub: loan.id, to: d.date }));
        var toLiab = Math.min(amt, owed), toExp = amt - toLiab;
        if (toLiab) lines.push({ acc: '2070', party: loan.lenderId, sub: loan.id, dr: toLiab, cr: 0, memo: 'लेखिसकेको ब्याज तिरियो' });
        if (toExp) lines.push({ acc: '7110', party: loan.lenderId, sub: loan.id, dr: toExp, cr: 0 });
      } else lines.push(Object.assign({}, counter, { dr: amt, cr: 0 }));
      lines.push({ acc: d.account, dr: 0, cr: amt - tds });
      if (tds) lines.push({ acc: '2050', dr: 0, cr: tds, memo: 'TDS कट्टी' });
    }
    lines.forEach(function (l) { Object.keys(l).forEach(function (k) { if (l[k] === undefined || l[k] === '') delete l[k]; }); });
    // Over-payment check: what is still open on this payable/receivable?
    var a = E.account(st, acc), reduces = a && ((c.dir === 'out' && a.type === 'liability') || (c.dir === 'in' && a.type === 'asset'));
    if (c.id === 'out_interest' && loan) {
      var li = E.loanInterest(st, loan, d.date);
      open = { acc: '2070', party: loan.lenderId, sub: loan.id, amount: li.due };
      if (amt > li.due) warnings.push('यो ऋणको ब्याज बाँकी ' + fmt(li.due, cur) + ' मात्र छ — ' + fmt(amt - li.due, cur) + ' बढी (अग्रिम) भुक्तानी हुन्छ।');
    } else if (reduces && OPEN_CHECK[acc] && party && E.validIso(d.date)) {
      var ob = loan ? E.loanOutstanding(st, loan, d.date) : E.openBalance(st, d.entity, acc, party, sub, d.date);
      open = { acc: acc, party: party, sub: sub || '', amount: ob };
      if (amt > ob) warnings.push((ob > 0 ? a.name + ' मा ' + E.partyName(st, party) + ' को बाँकी ' + fmt(ob, cur) + ' मात्र छ — ' + fmt(amt - ob, cur) + ' बढी हुन्छ'
        : a.name + ' मा ' + E.partyName(st, party) + ' को केही बाँकी छैन — पूरै रकम अग्रिम/बढी हुन्छ') + ' (बढी भुक्तानी/अग्रिम)।');
    }
    return {
      journal: { entity: d.entity, date: d.date, memo: d.memo || c.ne, ref: d.ref || '', method: d.method || '', cat: c.id, idem: d.idem || '', attach: d.attach || '', lines: lines },
      level: E.requiredLevel(st, c.dir, amt, c.special), cat: c, warnings: warnings, open: open, loan: loan ? loan.id : ''
    };
  };

  E.buildTransferJournal = function (st, d) {
    if (d.from === d.to) return { errors: ['एउटै खाताबाट सोही खातामा ट्रान्सफर हुँदैन।'] };
    return { journal: { entity: d.entity, date: d.date, memo: d.memo || 'आन्तरिक ट्रान्सफर', ref: d.ref || '', method: d.method || 'transfer', cat: 'transfer', idem: d.idem || '',
      lines: [{ acc: d.to, dr: d.amount, cr: 0 }, { acc: d.from, dr: 0, cr: d.amount }] }, level: E.requiredLevel(st, 'out', d.amount, false) };
  };

  /** Plain-Nepali explanation of what a journal does to the company. */
  E.explain = function (st, j, cur) {
    var says = [], cash = 0, profit = 0, liab = 0, eq = 0, other = 0;
    j.lines.forEach(function (l) {
      var a = E.account(st, l.acc); if (!a) return;
      var v = natural(st, l.acc, l.dr || 0, l.cr || 0);
      var up = v > 0, amt = fmt(Math.abs(v), cur);
      if (E.CASH_KINDS[a.kind]) { cash += v; says.push(a.name + ' ' + amt + ' ले ' + (up ? 'बढ्छ' : 'घट्छ') + '।'); }
      else if (a.type === 'expense') { profit -= v; says.push(a.name + ' (खर्च) ' + amt + ' ले ' + (up ? 'बढ्छ' : 'घट्छ') + '।'); }
      else if (a.type === 'revenue') { profit += v; says.push(a.name + ' (आम्दानी) ' + amt + ' ले ' + (up ? 'बढ्छ' : 'घट्छ') + '।'); }
      else if (a.type === 'liability') { liab += v; says.push(a.name + ' (तिर्नुपर्ने दायित्व) ' + amt + ' ले ' + (up ? 'बढ्छ' : 'घट्छ') + '।'); }
      else if (a.type === 'equity') { eq += v; says.push(a.name + ' ' + amt + ' ले ' + (up ? 'बढ्छ' : 'घट्छ') + '।'); }
      else { other += v; says.push(a.name + ' ' + amt + ' ले ' + (up ? 'बढ्छ' : 'घट्छ') + '।'); }
    });
    var tail = [];
    if (profit) tail.push('अन्य कुरा उस्तै भए कम्पनीको नाफा ' + fmt(Math.abs(profit), cur) + ' ले ' + (profit > 0 ? 'बढ्छ' : 'घट्छ') + '।');
    else tail.push('यसले नाफा/घाटा बदल्दैन।');
    if (liab > 0 && cash > 0) tail.push('यसलाई बिक्री वा नाफा मानिँदैन — यो फिर्ता/तिर्नुपर्ने रकम हो।');
    if (eq > 0 && cash > 0) tail.push('यो शेयर पूँजी हो, नाफा होइन।');
    if (other > 0 && cash < 0 && !profit) tail.push('पैसा अर्को सम्पत्ति/पेश्कीमा गयो — यो खर्च होइन, हिसाब फर्छ्यौट हुँदा मात्र खर्च लेखिन्छ।');
    if (cash === 0 && !profit && j.lines.every(function (l) { var a = E.account(st, l.acc); return a && E.CASH_KINDS[a.kind]; }))
      tail.push('कम्पनीको कुल नगद तथा बैंक रकम उत्तिकै रहन्छ — यो आम्दानी वा खर्च होइन।');
    return { lines: says, summary: tail, cash: cash, profit: profit, liability: liab, equity: eq };
  };

  /* ------------------------------------------------------------------
     10. AGENTS & COMMISSION
     ------------------------------------------------------------------ */
  E.nextAgentCode = function (st) {
    var max = 0;
    st.agents.forEach(function (a) { var m = /SHG-(\d+)/.exec(a.code); if (m) max = Math.max(max, +m[1]); });
    return 'SHG-' + ('000' + (max + 1)).slice(-4);
  };
  E.addAgent = function (st, a, user) {
    var code = (a.code || '').trim().toUpperCase() || E.nextAgentCode(st);
    if (!/^[A-Z0-9][A-Z0-9-]{0,19}$/.test(code)) return { ok: false, errors: ['एजेन्ट कोडमा अंग्रेजी अक्षर, अंक र - मात्र (जस्तै SHG-0012)।'] };
    if (st.agents.some(function (x) { return x.code === code; })) return { ok: false, errors: ['यो एजेन्ट कोड पहिले नै छ: ' + code] };
    var ag = { id: E.uid('a'), code: code, name: a.name, phone: a.phone || '', area: a.area || '', tier: a.tier === 'team' ? 'team' : 'direct',
      override: a.override || { mode: '', value: 0 }, active: true, createdAt: new Date().toISOString() };
    st.agents.push(ag);
    E.audit(st, user, 'agent.add', code + ' ' + a.name);
    return { ok: true, agent: ag };
  };

  E.ruleAt = function (st, date) {
    var rules = st.settings.commissionRules.slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; });
    var r = rules[0];
    rules.forEach(function (x) { if (x.from <= date) r = x; });
    return r;
  };
  /** New effective-dated commission rule (₹200 → ₹400 etc). Old sales keep their snapshot. */
  E.setCommissionRule = function (st, rule, user) {
    if (!E.validIso(rule.from)) return { ok: false, errors: ['लागू हुने मिति मिलेन।'] };
    if (!(rule.direct >= 0 && rule.team >= 0 && rule.percent >= 0 && rule.percent <= 100)) return { ok: false, errors: ['दर मिलेन।'] };
    var list = st.settings.commissionRules.filter(function (x) { return x.from !== rule.from; });
    var r = { from: rule.from, mode: rule.mode === 'percent' ? 'percent' : 'flat', direct: rule.direct, team: rule.team, percent: +rule.percent,
      by: user ? user.name : 'system', at: new Date().toISOString(), note: rule.note || '' };
    list.push(r);
    st.settings.commissionRules = list;
    E.audit(st, user, 'commission.rule', r.from + ' ' + r.mode + ' direct ' + fmt(r.direct) + ' team ' + fmt(r.team) + ' ' + r.percent + '%');
    return { ok: true, rule: r };
  };
  /** Commission for a sale: agent override > company rule for the agent's tier. */
  E.commissionFor = function (st, agent, pax, amount, date) {
    var rule = E.ruleAt(st, date), ov = agent.override || {};
    var mode = ov.mode || rule.mode;
    if (mode === 'percent') {
      var pct = ov.mode === 'percent' ? +ov.value : rule.percent;
      return { amount: E.pctOf(amount, pct), basis: pct + '% × ' + fmt(amount), mode: 'percent', rate: pct, ruleFrom: rule.from };
    }
    var rate = ov.mode === 'flat' ? ov.value : (agent.tier === 'team' ? rule.team : rule.direct);
    return { amount: rate * pax, basis: pax + ' यात्रु × ' + fmt(rate), mode: 'flat', rate: rate, ruleFrom: rule.from };
  };

  /** Record an agent's ticket sale: revenue + commission accrual in ONE journal. */
  E.recordAgentSale = function (st, s, user) {
    var ag = E.find(st.agents, s.agentId);
    if (!ag) return { ok: false, errors: ['एजेन्ट छान्नुहोस्।'] };
    if (!(s.pax > 0) || !(s.amount > 0)) return { ok: false, errors: ['यात्रु संख्या र टिकट रकम लेख्नुहोस्।'] };
    var com = s.commissionOverride != null && s.commissionOverride >= 0
      ? { amount: s.commissionOverride, basis: 'हातैले तोकिएको: ' + (s.overrideReason || ''), mode: 'manual' }
      : E.commissionFor(st, ag, s.pax, s.amount, s.date);
    var sale = { id: E.uid('s'), agentId: ag.id, date: s.date, pax: s.pax, amount: s.amount, tripId: s.tripId || '', entity: s.entity,
      collectedBy: s.collectedBy === 'company' ? 'company' : 'agent', account: s.account || '', commission: com.amount, basis: com.basis,
      pnr: s.pnr || '', status: 'pending', journalId: '', createdAt: new Date().toISOString() };
    var debit = sale.collectedBy === 'agent' ? { acc: '1210', party: ag.id, dr: s.amount, cr: 0 } : { acc: s.account, dr: s.amount, cr: 0 };
    var lines = [debit, { acc: '4010', dr: 0, cr: s.amount, trip: sale.tripId || undefined }];
    if (com.amount > 0) {
      lines.push({ acc: '5040', party: ag.id, dr: com.amount, cr: 0, trip: sale.tripId || undefined });
      lines.push({ acc: '2020', party: ag.id, dr: 0, cr: com.amount });
    }
    lines.forEach(function (l) { if (!l.trip) delete l.trip; });
    var j = { entity: s.entity, date: s.date, memo: ag.code + ' बिक्री: ' + s.pax + ' यात्रु' + (sale.pnr ? ' (' + sale.pnr + ')' : ''), ref: sale.pnr,
      cat: 'agent_sale', source: { type: 'agentSale', id: sale.id }, idem: 'sale:' + (sale.pnr ? ag.id + ':' + sale.pnr + ':' : '') + sale.id, lines: lines };
    // A PNR may be sold again only after the earlier sale was cancelled, reversed or rejected (bug #4).
    if (sale.pnr && st.agentSales.some(function (x) { return x.agentId === ag.id && x.pnr === sale.pnr && x.status !== 'cancelled' && x.status !== 'rejected' && x.status !== 'reversed'; }))
      return { ok: false, errors: ['यही PNR/बुकिङमा यो एजेन्टको कमिसन पहिले नै लेखिएको छ — दोहोरो कमिसन रोकियो।'] };
    st.agentSales.push(sale);
    var r = E.commit(st, user, j, { level: 1, label: j.memo, hook: { name: 'agentSale', args: { id: sale.id } } });
    if (!r.ok || r.duplicate) {
      var k = st.agentSales.indexOf(sale); if (k >= 0) st.agentSales.splice(k, 1);
      if (r.ok) r = { ok: false, duplicate: true, journal: r.journal, errors: ['यो बिक्री पहिले नै लेखिएको छ (' + (r.journal ? r.journal.no : 'स्वीकृतिको पर्खाइमा') + ')।'] };
    }
    r.sale = sale; r.commission = com;
    return r;
  };
  HOOKS.agentSale = function (st, args, j, what) {
    var s = E.find(st.agentSales, args.id); if (!s) return;
    if (what === 'posted') { s.status = 'active'; s.journalId = j.id; }
    else if (what === 'reversed') { s.status = 'reversed'; s.reversedJournalId = j ? j.reversedBy : ''; }
    else s.status = 'rejected';
  };

  /** What is still cancellable on a sale (after posted cancels and cancels waiting for approval). */
  E.saleRemaining = function (st, s) {
    var c = s.cancelled || { amount: 0, pax: 0, fee: 0, commission: 0 }, amt = s.amount - (c.amount || 0), pax = s.pax - (c.pax || 0), com = s.commission - (c.commission || 0);
    (st.pending || []).forEach(function (p) {
      if (p.status === 'submitted' && p.hook && p.hook.name === 'agentCancel' && p.hook.args && p.hook.args.id === s.id) {
        amt -= p.hook.args.amount || 0; pax -= p.hook.args.pax || 0; com -= p.hook.args.commission || 0;
      }
    });
    return { amount: amt, pax: pax, commission: com };
  };
  /** Cancel all or part of a sale (bug #20, contract C2).
      opt = {amount?, pax?, fee?, refund?: 'agent'|'payable'|'paid', refundAccount?, reverseCommission?, date?, reason?, party?}
      Refund to the passenger = amount − fee; the fee simply stays in ticket revenue. */
  E.cancelAgentSale = function (st, saleId, opt, user) {
    opt = opt || {};
    var s = E.find(st.agentSales, saleId);
    if (!s || s.status !== 'active') return { ok: false, errors: ['सक्रिय बिक्री भेटिएन।'] };
    var rem = E.saleRemaining(st, s);
    if (rem.amount <= 0) return { ok: false, errors: ['यो बिक्रीको बाँकी सबै रकम रद्द भइसकेको (वा स्वीकृतिको पर्खाइमा) छ।'] };
    var amount = opt.amount == null || opt.amount === '' ? rem.amount : +opt.amount;
    if (!(amount > 0) || amount !== Math.round(amount) || amount > rem.amount) return { ok: false, errors: ['रद्द रकम ' + fmt(rem.amount) + ' भन्दा बढी वा गलत भयो।'] };
    var full = amount === rem.amount, pax;
    if (opt.pax == null || opt.pax === '') pax = full ? rem.pax : Math.min(rem.pax, Math.round(s.pax * amount / s.amount));
    else pax = +opt.pax;
    if (!(pax >= 0) || pax !== Math.round(pax) || pax > rem.pax) return { ok: false, errors: ['यात्रु संख्या मिलेन (बाँकी ' + rem.pax + ')।'] };
    var fee = opt.fee ? +opt.fee : 0;
    if (!(fee >= 0) || fee !== Math.round(fee) || fee > amount) return { ok: false, errors: ['रद्द शुल्क रकमभन्दा बढी हुन सक्दैन।'] };
    var refundAmt = amount - fee;
    var reverseCom = opt.reverseCommission == null ? st.settings.reverseCommissionOnCancel : !!opt.reverseCommission;
    var com = 0;
    if (reverseCom && rem.commission > 0) {
      com = full ? rem.commission : (opt.pax != null && opt.pax !== '' && s.pax ? Math.round(s.commission * pax / s.pax) : Math.round(s.commission * amount / s.amount));
      com = Math.max(0, Math.min(com, rem.commission));
    }
    var mode = s.collectedBy === 'agent' ? 'agent' : (opt.refund === 'paid' || opt.refund === 'agent' ? opt.refund : 'payable');
    var lines = [];
    if (refundAmt > 0) {
      lines.push({ acc: '4015', dr: refundAmt, cr: 0, trip: s.tripId || undefined });
      if (mode === 'agent') lines.push({ acc: '1210', party: s.agentId, dr: 0, cr: refundAmt });
      else if (mode === 'paid') lines.push({ acc: opt.refundAccount || s.account, dr: 0, cr: refundAmt });
      else lines.push({ acc: '2040', party: opt.party || s.id, sub: s.id, dr: 0, cr: refundAmt });
    }
    if (com > 0) {
      lines.push({ acc: '2020', party: s.agentId, dr: com, cr: 0 });
      lines.push({ acc: '5040', party: s.agentId, dr: 0, cr: com, trip: s.tripId || undefined });
    }
    lines.forEach(function (l) { if (!l.trip) delete l.trip; });
    var ag = E.find(st.agents, s.agentId) || { code: '' };
    var n = (s.cancels || []).length + 1;
    var args = { id: s.id, n: n, amount: amount, pax: pax, fee: fee, commission: com, refund: mode, reason: opt.reason || '' };
    if (!lines.length) {   // the whole cancelled amount is kept as a fee and no commission to reverse: nothing to post
      HOOKS.agentCancel(st, args, null, 'posted', user);
      E.audit(st, user, 'agent.cancel', ag.code + ' ' + (s.pnr || s.id) + ' शुल्क मात्र ' + fmt(fee), { obj: 'agentSale', id: s.id });
      return { ok: true, noJournal: true, sale: s, errors: [] };
    }
    var memo = ag.code + ' बिक्री ' + (full && !(s.cancelled && s.cancelled.amount) ? 'रद्द' : 'आंशिक रद्द') + (s.pnr ? ' (' + s.pnr + ')' : '') + (fee ? ', शुल्क ' + fmt(fee) : '') + (com ? ' + कमिसन फिर्ता' : '') + (opt.reason ? ' — ' + opt.reason : '');
    var r = E.commit(st, user, { entity: s.entity, date: opt.date || E.today(), memo: memo, ref: s.pnr || '',
      cat: 'agent_cancel', source: { type: 'agentCancel', id: s.id, n: n }, idem: 'cancel:' + s.id + ':' + n, lines: lines }, { level: 1, label: memo, hook: { name: 'agentCancel', args: args } });
    r.sale = s;
    return r;
  };
  HOOKS.agentCancel = function (st, args, j, what) {
    var s = E.find(st.agentSales, args.id); if (!s) return;
    s.cancels = s.cancels || [];
    s.cancelled = s.cancelled || { amount: 0, pax: 0, fee: 0, commission: 0 };
    if (what === 'posted') {
      var amount = args.amount == null ? s.amount - s.cancelled.amount : args.amount;   // old queued requests carried only {id}
      var pax = args.pax == null ? s.pax - s.cancelled.pax : args.pax;
      var com = args.commission == null ? (st.settings.reverseCommissionOnCancel ? s.commission - (s.cancelled.commission || 0) : 0) : args.commission;
      s.cancels.push({ n: args.n || s.cancels.length + 1, journalId: j ? j.id : '', amount: amount, pax: pax, fee: args.fee || 0, commission: com, refund: args.refund || '', reason: args.reason || '', at: new Date().toISOString() });
      s.cancelled.amount += amount; s.cancelled.pax += pax; s.cancelled.fee += args.fee || 0; s.cancelled.commission = (s.cancelled.commission || 0) + com;
      if (j) s.cancelJournalId = j.id;
    } else if (what === 'reversed' && j) {
      var c = s.cancels.filter(function (x) { return x.journalId === j.id && !x.reversed; })[0];
      if (!c) return;
      c.reversed = true;
      s.cancelled.amount -= c.amount; s.cancelled.pax -= c.pax; s.cancelled.fee -= c.fee || 0; s.cancelled.commission = (s.cancelled.commission || 0) - (c.commission || 0);

    } else return;
    s.partial = s.cancelled.amount > 0 && s.cancelled.amount < s.amount;
    if (s.status === 'active' && s.cancelled.amount >= s.amount) s.status = 'cancelled';
  };
  /** Pay out a refund that a company-collected cancellation left in 2040 (refund payable). */
  E.payRefund = function (st, saleId, account, date, user, amount) {
    var s = E.find(st.agentSales, saleId);
    if (!s) return { ok: false, errors: ['बिक्री भेटिएन।'] };
    var party = null;
    E.lines(st, { entity: s.entity, acc: '2040', sub: s.id }).forEach(function (x) { if (!party && x.l.party) party = x.l.party; });
    if (!party) return { ok: false, errors: ['यो बिक्रीको फिर्ता तिर्न बाँकी रकम छैन।'] };
    var open = E.balance(st, s.entity, '2040', { party: party, sub: s.id, to: date });
    var amt = amount == null ? open : amount;
    if (!(amt > 0) || amt > open) return { ok: false, errors: ['फिर्ता तिर्न बाँकी ' + fmt(open) + ' मात्र छ।'] };
    return E.commit(st, user, { entity: s.entity, date: date, memo: 'यात्रु फिर्ता भुक्तानी' + (s.pnr ? ' (' + s.pnr + ')' : ''), ref: s.pnr || '', cat: 'refund_pay',
      lines: [{ acc: '2040', party: party, sub: s.id, dr: amt, cr: 0 }, { acc: account, dr: 0, cr: amt }] }, { level: E.requiredLevel(st, 'out', amt, false) });
  };

  /** Net settlement: agent keeps the commission out of the cash they hold. */
  E.netSettle = function (st, entity, agentId, date, user) {
    if (!st.settings.netSettlementAllowed) return { ok: false, errors: ['नेट सेटलमेन्ट सेटिङमा बन्द छ — कमिसन छुट्टै भुक्तानी गर्नुहोस्।'] };
    var recv = E.balance(st, entity, '1210', { party: agentId, to: date });
    var pay = E.balance(st, entity, '2020', { party: agentId, to: date });
    var amt = Math.min(recv, pay);
    if (!(amt > 0)) return { ok: false, errors: ['मिलान गर्नुपर्ने रकम छैन (एजेन्टसँग नगद वा कमिसन बाँकी छैन)।'] };
    var ag = E.find(st.agents, agentId);
    return E.commit(st, user, { entity: entity, date: date, memo: ag.code + ' कमिसन नगदबाटै मिलान (नेट सेटलमेन्ट)', cat: 'net_settle',
      lines: [{ acc: '2020', party: agentId, dr: amt, cr: 0 }, { acc: '1210', party: agentId, dr: 0, cr: amt }] }, { level: 1 });
  };

  E.agentPosition = function (st, entity, agentId, asOf) {
    var held = E.balance(st, entity, '1210', { party: agentId, to: asOf });
    var payable = E.balance(st, entity, '2020', { party: agentId, to: asOf });
    return { held: held, payable: payable, net: held - payable };
  };
  /** One row per agent. Single pass over sales + two party-balance maps (bug #14). */
  E.agentSummary = function (st, entity, from, to) {
    var by = {};
    st.agentSales.forEach(function (s) {
      if (s.entity !== entity || s.date < from || s.date > to || (s.status !== 'active' && s.status !== 'cancelled')) return;
      var o = by[s.agentId] || (by[s.agentId] = { pax: 0, sales: 0, cancelled: 0, commission: 0 });
      if (s.status === 'active') {
        var c = s.cancelled || {};
        o.pax += s.pax - (c.pax || 0); o.sales += s.amount - (c.amount || 0); o.commission += s.commission - (c.commission || 0);
      } else o.cancelled++;
    });
    var held = E.partyBalances(st, entity, '1210', to), pay = E.partyBalances(st, entity, '2020', to);
    return st.agents.map(function (ag) {
      var o = by[ag.id] || { pax: 0, sales: 0, cancelled: 0, commission: 0 }, h = held[ag.id] || 0, p = pay[ag.id] || 0;

    });
  };
  /** Statement lines for one agent: + means agent owes the company. */
  E.agentStatement = function (st, entity, agentId, from, to) {
    var open = E.agentPosition(st, entity, agentId, E.addDays(from, -1)).net;
    var rows = [], run = open;
    E.lines(st, { entity: entity, acc: ['1210', '2020'], party: agentId, from: from, to: to }).forEach(function (x) {
      var v = x.l.dr - x.l.cr;   // 1210 debit = owes more; 2020 debit = we owe less → also +
      run += v;
      rows.push({ date: x.j.date, no: x.j.no, memo: x.j.memo, acc: x.l.acc, change: v, balance: run });
    });
    return { opening: open, rows: rows, closing: run };
  };

  /* ------------------------------------------------------------------
     11. SHARES & CAPITAL
     ------------------------------------------------------------------ */
  E.addPerson = function (st, p, user) {
    var o = { id: E.uid('p'), name: p.name, kind: p.kind || 'pending', phone: p.phone || '', idNo: p.idNo || '', address: p.address || '',
      entity: p.entity || 'IN', note: p.note || '', createdAt: new Date().toISOString(), history: [] };
    st.people.push(o);

    return o;
  };

  /** Holdings per holder per class from allotments ± transfers (as of a date). */
  E.holdings = function (st, asOf) {
    var h = {};
    var add = function (pid, cls, n) { var k = pid + '|' + cls; h[k] = (h[k] || 0) + n; };
    st.allotments.forEach(function (a) { if (a.status === 'approved' && (!asOf || a.date <= asOf)) add(a.holderId, a.cls, a.shares); });
    st.transfers.forEach(function (t) { if (t.status === 'approved' && (!asOf || t.date <= asOf)) { add(t.fromId, t.cls, -t.shares); add(t.toId, t.cls, t.shares); } });
    return h;
  };

  /** Paid money (face + premium) per allotment id, one pass over 3010/3020 (memoised). */
  function allotPaidMap(st) {
    var x = lx(st);
    if (!x.memo.allotPaid) {
      var m = {};
      scan(st, { acc: ['3010', '3020'] }, function (q) { if (q.l.sub) m[q.l.sub] = (m[q.l.sub] || 0) + q.l.cr - q.l.dr; });
      x.memo.allotPaid = m;
    }
    return x.memo.allotPaid;
  }
  /** Paid money (face + premium) received against one allotment. */
  E.allotmentPaid = function (st, allotId) { return allotPaidMap(st)[allotId] || 0; };

  E.capTable = function (st, asOf) {
    var h = E.holdings(st, asOf), rows = {}, totalEq = 0, paidMap = allotPaidMap(st);
    Object.keys(h).forEach(function (k) {
      var p = k.split('|'), n = h[k]; if (!n) return;
      var r = rows[p[0]] || (rows[p[0]] = { id: p[0], name: E.partyName(st, p[0]), eq: 0, pref: 0, nominal: 0, due: 0, paid: 0 });
      var cls = E.find(st.shareClasses, p[1]);
      if (cls && cls.voting) { r.eq += n; totalEq += n; } else r.pref += n;
      r.nominal += n * (cls ? cls.face : 0);
    });
    st.allotments.forEach(function (a) {
      if (a.status !== 'approved' || (asOf && a.date > asOf)) return;
      var r = rows[a.holderId] || (rows[a.holderId] = { id: a.holderId, name: E.partyName(st, a.holderId), eq: 0, pref: 0, nominal: 0, due: 0, paid: 0 });
      r.due += a.shares * a.issuePrice;
      r.paid += paidMap[a.id] || 0;
    });
    var list = Object.keys(rows).map(function (k) { var r = rows[k]; r.pct = totalEq ? r.eq * 100 / totalEq : 0; r.unpaid = r.due - r.paid; return r; })
      .sort(function (a, b) { return b.eq - a.eq; });
    return { rows: list, totalEq: totalEq, totalPref: E.sum(list, function (r) { return r.pref; }), nominal: E.sum(list, function (r) { return r.nominal; }),
      due: E.sum(list, function (r) { return r.due; }), paid: E.sum(list, function (r) { return r.paid; }) };
  };

  /** Pure ownership maths for one equal-rights class. */
  E.ownership = function (holders) {
    var total = E.sum(holders, function (h) { return h.shares; });
    return holders.map(function (h) { return { name: h.name, shares: h.shares, pct: total ? h.shares * 100 / total : 0 }; });
  };
  E.shareMaths = function (shares, face, issuePrice, paid) {
    var nominal = shares * face, due = shares * issuePrice;
    return { nominal: nominal, premium: shares * (issuePrice - face), due: due, outstanding: due - (paid || 0) };
  };

  /** Record a legal allotment (CEO only). Optional money received now.
      Atomic (bug #13): paidNow is validated before anything is saved, and the
      allotment is removed again when the payment cannot be posted.
      Returns {ok, allotment, payment:{ok, errors, queued?}}. */
  E.allotShares = function (st, a, user) {
    if (E.levelOf(user.role) < 3) return { ok: false, errors: ['शेयर बाँडफाँट CEO/निर्देशकले मात्र गर्न सक्छ।'] };
    var cls = E.find(st.shareClasses, a.cls || 'EQ');
    if (!cls) return { ok: false, errors: ['शेयर वर्ग भेटिएन।'] };
    if (!(a.shares > 0) || a.shares !== Math.round(a.shares)) return { ok: false, errors: ['शेयर संख्या पूर्णाङ्क हुनुपर्छ।'] };
    var issuePrice = a.issuePrice || cls.face;
    if (issuePrice < cls.face) return { ok: false, errors: ['अंकित मूल्यभन्दा कममा शेयर जारी गर्न मिल्दैन (discount issue निषेधित)।'] };
    if (st.mode === 'real' && !a.docRef) return { ok: false, errors: ['बोर्ड निर्णय / बाँडफाँट कागजातको नम्बर अनिवार्य छ।'] };
    if (!E.validIso(a.date)) return { ok: false, errors: ['बाँडफाँट मिति मिलेन।'] };
    if (!a.holderId) return { ok: false, errors: ['शेयरधनी छान्नुहोस्।'] };
    var authorized = st.settings.capital.authorized;
    var issuedNominal = E.capTable(st).nominal;
    if (authorized > 0 && issuedNominal + a.shares * cls.face > authorized)
      return { ok: false, errors: ['अधिकृत पूँजी (' + fmt(authorized) + ') नाघ्छ। पहिले अधिकृत पूँजी कानुनी रूपमा बढाउनुहोस् (SH-7)।'] };
    var paidNow = a.paidNow || 0;
    if (paidNow && (!(paidNow > 0) || paidNow !== Math.round(paidNow))) return { ok: false, errors: ['बुझाएको रकम मिलेन।'], payment: { ok: false, errors: ['बुझाएको रकम मिलेन।'] } };
    if (paidNow > a.shares * issuePrice) {
      var e1 = 'बुझाएको रकम (' + fmt(paidNow) + ') शेयरको जम्मा मूल्य (' + fmt(a.shares * issuePrice) + ') भन्दा बढी भयो।';
      return { ok: false, errors: [e1], payment: { ok: false, errors: [e1] } };
    }
    var al = { id: E.uid('al'), date: a.date, holderId: a.holderId, cls: cls.id, shares: a.shares, face: cls.face, issuePrice: issuePrice,
      docRef: a.docRef || '', certNo: a.certNo || '', status: 'approved', by: user.name, createdAt: new Date().toISOString() };
    var pj = null;
    if (paidNow > 0) {
      pj = sharePayJournal(st, al, paidNow, a.account, a.date, a.entity || 'IN', a.fromPending);
      if (pj.errors) return { ok: false, errors: pj.errors, payment: { ok: false, errors: pj.errors } };
    }
    st.allotments.push(al);
    var p = E.find(st.people, a.holderId), kind0 = p ? p.kind : null;
    if (p && (p.kind === 'pending' || !p.kind)) p.kind = cls.voting ? 'equity' : 'preference';
    var r = { ok: true, allotment: al };
    if (pj) {
      r.payment = E.commit(st, user, pj.journal, { level: 3 });
      if (!r.payment.ok) {
        st.allotments.splice(st.allotments.indexOf(al), 1);
        if (p) p.kind = kind0;
        return { ok: false, allotment: null, payment: r.payment, errors: r.payment.errors || ['भुक्तानी लेख्न सकिएन।'] };
      }
    }
    E.audit(st, user, 'shares.allot', E.partyName(st, a.holderId) + ' ' + a.shares + ' ' + cls.id + ' @ ' + fmt(issuePrice), { obj: 'allotment', id: al.id, after: { shares: al.shares, cls: al.cls, issuePrice: al.issuePrice } });
    return r;
  };
  /* Journal for money received against an allotment (validated, not posted). */
  function sharePayJournal(st, al, amount, account, date, entity, fromPending) {
    var due = al.shares * al.issuePrice - E.allotmentPaid(st, al.id);
    if (!(amount > 0) || amount !== Math.round(amount)) return { errors: ['रकम मिलेन।'] };
    if (amount > due) return { errors: ['बाँकी भन्दा बढी रकम (' + fmt(due) + ' मात्र बाँकी)।'] };
    if (fromPending) {
      var pend = E.balance(st, entity, '2990', { party: al.holderId, to: date });
      if (amount > pend) return { errors: ['यो व्यक्तिको वर्गीकरण बाँकी रकम (2990) ' + fmt(pend) + ' मात्र छ।'] };
    } else if (!account) return { errors: ['पैसा आएको खाता छान्नुहोस्।'] };
    var face = Math.round(amount * al.face / al.issuePrice), prem = amount - face;
    var lines = [fromPending ? { acc: '2990', party: al.holderId, dr: amount, cr: 0 } : { acc: account, dr: amount, cr: 0 },
      { acc: '3010', party: al.holderId, sub: al.id, dr: 0, cr: face }];
    if (prem) lines.push({ acc: '3020', party: al.holderId, sub: al.id, dr: 0, cr: prem });
    if (!face) lines.splice(1, 1);
    var j = { entity: entity, date: date, memo: 'शेयर रकम प्राप्त: ' + E.partyName(st, al.holderId), cat: 'share_pay', source: { type: 'allotment', id: al.id }, lines: lines };
    var errs = E.validateJournal(st, j);
    return errs.length ? { errors: errs } : { journal: j };
  }
  /** Money received for shares: split into face (3010) and premium (3020) pro-rata. */
  E.payForShares = function (st, allotId, amount, account, date, entity, user, fromPending) {
    var al = E.find(st.allotments, allotId);
    if (!al) return { ok: false, errors: ['बाँडफाँट भेटिएन।'] };
    var pj = sharePayJournal(st, al, amount, account, date, entity, fromPending);

    return E.commit(st, user, pj.journal, { level: 3 });
  };
  /* Reversing a share payment needs no bookkeeping: paid amounts are always

    if (al && what === 'reversed') al.lastPaymentReversed = j ? j.id : '';
  };

  E.transferShares = function (st, t, user) {

    if (st.mode === 'real' && !t.docRef) return { ok: false, errors: ['SH-4 / हस्तान्तरण कागजातको नम्बर अनिवार्य छ।'] };
    var tr = { id: E.uid('tr'), date: t.date, fromId: t.fromId, toId: t.toId, cls: t.cls || 'EQ', shares: t.shares, price: t.price || 0,
      docRef: t.docRef || '', status: 'approved', by: user.name };

    var p = E.find(st.people, t.toId); if (p && p.kind === 'pending') p.kind = 'equity';

  /** "Give N new shares to someone" — preview only, nothing is saved. */
  E.dilution = function (current, newShares, issuePrice, face, authorized, issuedNominal) {
    var before = E.sum(current, function (h) { return h.shares; }), after = before + newShares;
    var rows = current.map(function (h) {
      var b = before ? h.shares * 100 / before : 0, a = after ? h.shares * 100 / after : 0;
      return { name: h.name, shares: h.shares, before: b, after: a, change: a - b };

    rows.push({ name: 'नयाँ शेयरधनी', shares: newShares, before: 0, after: after ? newShares * 100 / after : 0, change: after ? newShares * 100 / after : 0, isNew: true });

  E.capitalSummary = function (st, entity, asOf) {

      premium: b(['3020']), reserves: b(['3030']), directorLoan: b(['2100']), unsecuredLoans: b(['2110', '2120']),
      retained: b(['3040']) + bs.currentEarnings, opening: b(['3050']), cash: cp.cash, bank: cp.bank,

      pendingClassification: b(['2990'])
    };
  };

  /* Dividends: preview → declare (CEO, legal checklist) → pay via Money Out */
  E.dividendPreview = function (st, pool, recordDate, tdsPct) {
    var ct = E.capTable(st, recordDate), alloc = 0;
    var rows = ct.rows.filter(function (r) { return r.eq > 0; }).map(function (r) {
      var gross = Math.floor(pool * r.eq / ct.totalEq); alloc += gross;
      return { id: r.id, name: r.name, shares: r.eq, pct: r.pct, gross: gross };
    });
    for (var i = 0; alloc < pool && rows.length; i = (i + 1) % rows.length) { rows[i].gross++; alloc++; }   // largest-remainder pennies
    rows.forEach(function (r) { r.tds = E.pctOf(r.gross, tdsPct || 0); r.net = r.gross - r.tds; });
    return { rows: rows, pool: pool, totalShares: ct.totalEq };
  };
  E.declareDividend = function (st, d, user) {
    if (E.levelOf(user.role) < 3) return { ok: false, errors: ['लाभांश घोषणा CEO/बोर्डको अधिकार हो।'] };
    if (!d.resolution) return { ok: false, errors: ['बोर्ड/साधारण सभाको निर्णय नम्बर अनिवार्य छ।'] };
    if (!d.caConfirmed) return { ok: false, errors: ['वितरणयोग्य नाफा CA ले पुष्टि गरेको चिन्ह लगाउनुहोस्।'] };
    var pv = E.dividendPreview(st, d.pool, d.recordDate, d.tdsPct);
    if (!pv.rows.length) return { ok: false, errors: ['रेकर्ड मितिमा कुनै साधारण शेयरधनी छैन।'] };
    // Holders whose share rounds to ₹0 (or whose net is 0 after 100% TDS) get no line (bug #23).
    var lines = [];
    pv.rows.forEach(function (r) { if (r.gross > 0) lines.push({ acc: '3060', party: r.id, dr: r.gross, cr: 0 }); });
    pv.rows.forEach(function (r) {
      if (r.net > 0) lines.push({ acc: '2080', party: r.id, dr: 0, cr: r.net });
      if (r.tds > 0) lines.push({ acc: '2050', dr: 0, cr: r.tds, memo: 'लाभांश TDS ' + r.name });
    });
    if (!lines.length) return { ok: false, errors: ['लाभांश रकम शून्य भयो।'] };
    var dec = { id: E.uid('dv'), date: d.date, recordDate: d.recordDate, pool: d.pool, tdsPct: d.tdsPct || 0, resolution: d.resolution, rows: pv.rows, status: 'pending' };
    st.dividends.push(dec);
    var r = E.commit(st, user, { entity: d.entity || 'IN', date: d.date, memo: 'लाभांश घोषणा (' + d.resolution + ')', cat: 'dividend', source: { type: 'dividend', id: dec.id }, lines: lines },
      { level: 3, hook: { name: 'dividend', args: { id: dec.id } } });
    if (!r.ok) st.dividends.pop();

  };
  HOOKS.dividend = function (st, args, j, what) {

  E.DIRS = { up: 'गुजरात → रुपैडिहा', down: 'रुपैडिहा → गुजरात' };

          cat: 'web_deposit', idem: idemFor('web:dp:' + did + ':' + hash), lines: d.lines,

    function deletedSimple(kind, short, regMap, seen, ne) {

        src[kind + 'Id'] = id;
        var it = { key: short + ':' + id, kind: kind, id: id, pnr: '', label: 'हटाइएको ' + ne + ' #' + id, date: date, journal: null, amount: 0,
          warnings: ['वेबसाइटबाट हटाइयो — पहिलेको इन्ट्री उल्टाइयो।'], status: 'deleted', basis: digest(posted), reg: { t: short, id: id, del: true } };

  /* ------------------------------------------------------------------
     6. APPLY — create masters, post every item, update registry/sync.
     ------------------------------------------------------------------ */
  W.apply = function (st, plan, user) {
    var res = { ok: false, posted: 0, duplicates: 0, queued: 0, errors: [], run: null };
    if (!user || !E.can(user.role, 'post')) { res.errors.push('तपाईंको भूमिकाले वेबसाइट आयात गर्न मिल्दैन (post अनुमति चाहिन्छ)।'); return res; }
    if (!plan || !Array.isArray(plan.items)) { res.errors.push('आयात योजना भेटिएन — पहिले सिंक गर्नुहोस्।'); return res; }
    var w = W.ensure(st), cr = plan.create || {}, i;
    var put = function (list, o) { if (o && o.id && !E.find(list, o.id)) list.push(E.clone(o)); };
    st.people = st.people || []; st.vehicles = st.vehicles || []; st.trips = st.trips || []; st.agents = st.agents || [];
    (cr.people || []).forEach(function (o) { put(st.people, o); });
    (cr.vehicles || []).forEach(function (o) { put(st.vehicles, o); });
    (cr.trips || []).forEach(function (o) { put(st.trips, o); });
    (cr.agents || []).forEach(function (o) { put(st.agents, o); });

    var made = (cr.agents || []).length + (cr.trips || []).length + (cr.vehicles || []).length + (cr.people || []).length;

    var idx = buildIndex(st), failedKinds = {};
    function regSet(r) {

  /* ------------------------------------------------------------------
     7. RECONCILE — website day-book vs the app's web-sourced journals
     ------------------------------------------------------------------ */
  var BUCKETS = ['upi', 'esewa', 'cash', 'bank', 'wallet', 'cod_pending', 'unknown'];
  function bucketOf(src) {
    if (src.state === 'cod_due') return 'cod_pending';
    var m = lc(src.method);

  }
  W.reconcile = function (st, daybook, from, to) {

    var cell = function (m, k) { return m[k] || (m[k] = { count: 0, amount: 0 }); };
    rows.forEach(function (r) {

    Object.keys(app).forEach(function (k) { keys[k] = 1; });

    Object.keys(keys).sort(function (a, b) {

      return pa[0] < pb[0] ? -1 : pa[0] > pb[0] ? 1 : bo(pa[1]) - bo(pb[1]) || (pa[1] < pb[1] ? -1 : 1);

    });

  };

  /* ------------------------------------------------------------------
     8. COMPANY DETAILS from the website (meta.company + logo URL)
     ------------------------------------------------------------------ */
  W.mergeCompany = function (st, meta, user) {

    if (en) {
      var pick = function (field, val) { val = str(val).trim(); if (val && en[field] !== val) { en[field] = val; changed.push(field); } };

      pick('address', company.address);

  FORM.approval = function (f, v) { if (!ceoOnly()) return; var a = B().settings.approval, t1 = money(v.t1), t2 = money(v.t2); if (!(t1 >= 0 && t2 >= t1)) return toast('सीमा मिलेन (दोस्रो ≥ पहिलो)।', 'bad'); a.t1 = t1; a.t2 = t2; a.segregation = !!v.seg; E.audit(B(), U_(), 'approval.policy', Mt(t1) + ' / ' + Mt(t2) + ' seg ' + a.segregation); save(); toast('नीति सेभ भयो', 'ok'); render(); };
  FORM.fx = function (f, v) { var r = parseFloat(E.toAscii(v.rate || '')); if (!(r > 0 && r < 1000)) return toast('दर मिलेन।', 'bad'); if (!E.validIso(v.from)) return toast('मिति मिलेन।', 'bad'); B().settings.fx.push({ from: v.from, rate: r, note: v.note, by: U_().name }); E.audit(B(), U_(), 'fx.add', v.from + ' ' + r); save(); render(); };
  FORM.cat = function (f, v) {
    var b = B(), icon = String(v.icon || '🏷️').trim();

  ACT.catDel = function (el) { var b = B(); var c = b.settings.customCats.splice(+el.getAttribute('data-i'), 1)[0]; E.audit(b, U_(), 'category.remove', c.ne); save(); render(); };
  FORM.account = function (f, v) {
    var b = B(); if (!/^\d{4}$/.test(v.code)) return toast('कोड ४ अंकको हुनुपर्छ।', 'bad'); if (E.account(b, v.code)) return toast('यो कोड पहिले नै छ।', 'bad');
    var first = { asset: '1', liability: '2', equity: '3', revenue: '4' }[v.type]; if (first && v.code[0] !== first) return toast(E.TYPE_NE[v.type] + ' खाताको कोड ' + first + ' बाट सुरु हुनुपर्छ।', 'bad');
    if (v.type === 'expense' && '567'.indexOf(v.code[0]) < 0) return toast('खर्च खाताको कोड ५, ६ वा ७ बाट सुरु हुनुपर्छ।', 'bad');
    b.accounts.push({ code: v.code, name: v.name, en: '', type: v.type, kind: v.kind, cf: v.kind === 'fixed' ? 'inv' : v.type === 'equity' ? 'fin' : 'op', party: '' });
    b.accounts.sort(function (a, c) { return a.code < c.code ? -1 : 1; });
    E.audit(b, U_(), 'account.add', v.code + ' ' + v.name); save(); render();
  };
  ACT.accRename = function (el) { var a = E.account(B(), el.getAttribute('data-c')); if (!a) return; modal('खाताको नाम — ' + esc(a.code), '<form data-form="accRename" class="stack"><input type="hidden" name="c" value="' + esc(a.code) + '"><label class="f"><span>नयाँ नाम</span><input name="name" value="' + esc(a.name) + '" required></label><p class="small muted">कोड र पुराना कारोबार उस्तै रहन्छन्।</p><button class="btn">सेभ</button></form>'); };
  FORM.accRename = function (f, v) { var a = E.account(B(), v.c); if (!a || !String(v.name || '').trim()) return toast('नाम लेख्नुहोस्।', 'bad'); E.audit(B(), U_(), 'account.rename', a.code + ' ' + a.name + ' → ' + v.name); a.name = v.name; save(); closeModal(); render(); };
  FORM.lock = function (f, v) { if (!ceoOnly() || !E.validIso(v.d)) return; var b = B(), pend = b.pending.filter(function (p) { return p.status === 'submitted' && p.journal.date <= v.d; }); if (pend.length) return toast(pend.length + ' वटा स्वीकृति बाँकी इन्ट्री यो अवधिभित्र छन् — पहिले निर्णय गर्नुहोस्।', 'bad'); b.settings.lockDate = v.d; E.audit(b, U_(), 'period.lock', v.d); save(); toast(v.d + ' सम्म बन्द भयो', 'ok'); render(); };
  ACT.unlock = function () { confirmBox('बन्द अवधि खोल्दा पुराना मितिमा इन्ट्री गर्न मिल्छ। CA लाई जानकारी दिनुहोस्।', function (why) { if (!why) return toast('कारण लेख्नुहोस्।', 'bad'); E.audit(B(), U_(), 'period.unlock', B().settings.lockDate + ' ' + why); B().settings.lockDate = ''; save(); render(); }, { reason: 'कारण', danger: true }); };
  LIVE.userRole = function (f) {
    var v = vals(f), b = B(), list = v.role === 'agent' ? b.agents.map(function (a) { return [a.id, a.code + ' ' + a.name]; }) : v.role === 'investor' ? b.people.map(function (p) { return [p.id, p.name]; }) : v.role === 'driver' ? b.employees.map(function (e) { return [e.id, e.name]; }) : null;
    var box = $('#linkBox'); if (!box) return;

  };
  FORM.user = function (f, v) {
    if (!/^\d{4,6}$/.test(v.pin)) return toast('PIN ४–६ अंक।', 'bad');
    if (['agent', 'investor', 'driver'].indexOf(v.role) >= 0 && !v.link) return toast('यो भूमिकाका लागि व्यक्ति जोड्नुहोस्।', 'bad');
    var u = U.makeUser(v.name, v.role, v.pin, v.link); B().users.push(u); E.audit(B(), U_(), 'user.add', v.name + ' (' + v.role + ')'); save(); toast('प्रयोगकर्ता थपियो', 'ok'); render();
  };
  ACT.userToggle = function (el) { var u = E.find(B().users, el.getAttribute('data-id')); if (!u) return; u.active = u.active === false; E.audit(B(), U_(), 'user.toggle', u.name + ' ' + u.active); save(); render(); };
  ACT.userPin = function (el) { var u = E.find(B().users, el.getAttribute('data-id')); if (!u) return; modal('नयाँ PIN — ' + esc(u.name), '<form data-form="userPin" class="stack"><input type="hidden" name="id" value="' + esc(u.id) + '"><label class="f"><span>नयाँ PIN</span><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" required autocomplete="new-password"></label><button class="btn">सेभ</button></form>'); };
  FORM.userPin = function (f, v) { if (!/^\d{4,6}$/.test(v.pin || '')) return toast('PIN ४–६ अंक।', 'bad'); var u = E.find(B().users, v.id); if (!u) return; var n = U.makeUser(u.name, u.role, v.pin, u.link); u.salt = n.salt; u.pin = n.pin; u.pinLen = n.pinLen; E.audit(B(), U_(), 'user.pin', u.name); save(); closeModal(); toast('PIN बदलियो', 'ok'); };
  FORM.security = function (f, v) { var b = B(); b.settings.autoLockMin = Math.max(1, Math.min(240, parseInt(E.toAscii(v.lock), 10) || 10)); b.settings.saveReceiptPhotos = !!v.photos; E.audit(b, U_(), 'security.edit', b.settings.autoLockMin + ' min'); save(); toast('सेभ भयो', 'ok'); render(); };

  /* backup / restore */
  function b64(u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function aesKey(pass, salt) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']).then(function (k) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
  }
  FORM.backup = function (f, v) {
    var b = B(), name = 'shg-finance-' + b.mode + '-' + today();
    if (v.pass && (!window.crypto || !crypto.subtle)) return toast('यो ब्राउजरमा इन्क्रिप्सन चल्दैन — HTTPS बाट खोल्नुहोस् वा पासवर्ड नराख्नुहोस्।', 'bad');
    // receipt photos travel inside the backup (bug #22) — they live in IndexedDB, not in the book
    U.saveNow().then(function () { return U.store.attAll(b.mode); }).then(function (att) {
      var payload = { shgfm: 'book1', app: E.VERSION, exportedAt: new Date().toISOString(), mode: b.mode, checksum: E.sha256(JSON.stringify(b)), book: b };
      var keys = Object.keys(att || {}).filter(function (k) { return /^[A-Za-z0-9_.:-]{1,80}$/.test(k) && U.store.isImgData(att[k]); });
      if (keys.length) { payload.att = {}; keys.forEach(function (k) { payload.att[k] = att[k]; }); payload.attChecksum = E.sha256(JSON.stringify(payload.att)); }
      var fin = function () { S.meta.lastBackup = new Date().toISOString(); U.saveMeta(); E.audit(b, U_(), 'backup.export', (v.pass ? 'encrypted' : 'plain') + (keys.length ? ' +' + keys.length + ' photos' : '')); save(); toast('ब्याकअप डाउनलोड भयो — सुरक्षित ठाउँमा राख्नुहोस्', 'ok'); render(); };
      if (!v.pass) { U.io.download(name + '.json', JSON.stringify(payload), 'application/json'); return fin(); }
      var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
      return aesKey(v.pass, salt).then(function (k) { return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, new TextEncoder().encode(JSON.stringify(payload))); })
        .then(function (ct) { U.io.download(name + '.enc.json', JSON.stringify({ shgfm: 'enc1', salt: b64(salt), iv: b64(iv), data: b64(new Uint8Array(ct)) }), 'application/json'); fin(); });
    }).catch(function (e) { toast('ब्याकअप बन्न सकेन: ' + (e && e.message), 'bad'); });
  };
  /** Checks a decrypted backup payload; → {ok, book, att, errors[]} (pure — used by restore and tests). */
  function checkBackup(p, mode) {
    var errs0 = [];
    if (!p || p.shgfm !== 'book1' || !p.book || typeof p.book !== 'object' || !Array.isArray(p.book.journals)) return { ok: false, errors: ['यो SHG Finance ब्याकअप होइन।'] };
    if (E.sha256(JSON.stringify(p.book)) !== p.checksum) return { ok: false, errors: ['checksum मिलेन — फाइल परिवर्तन भएको छ। रिस्टोर रोकियो।'] };
    if (p.book.mode !== mode) return { ok: false, errors: ['यो ' + (p.book.mode === 'demo' ? 'डेमो' : 'वास्तविक') + ' किताबको ब्याकअप हो — सोही मोडमा मात्र रिस्टोर गर्नुहोस्।'] };
    var unsafe = E.unsafeId(p.book);
    if (unsafe) return { ok: false, errors: ['ब्याकअपमा असामान्य मान (' + unsafe + ') — सुरक्षाका लागि रिस्टोर रोकियो।'] };
    // bug #22: full schema check (roles, enums, numbers, icons…) when the engine has it
    if (E.validateBook) { var vb = E.validateBook(p.book, { calcIds: D.CALCS.map(function (c) { return c.id; }) }); if (!vb.ok) return { ok: false, errors: ['ब्याकअपको संरचना मिलेन — रिस्टोर रोकियो:'].concat(vb.errors.slice(0, 12)) }; }
    else {
      (p.book.users || []).forEach(function (u, i) { if (!u || !E.ROLES[u.role]) errs0.push('users[' + i + '].role'); });
      if (errs0.length) return { ok: false, errors: ['ब्याकअपको संरचना मिलेन — रिस्टोर रोकियो:'].concat(errs0.slice(0, 12)) };
    }
    var bad = p.book.journals.filter(function (j) { return !j || !Array.isArray(j.lines) || E.journalTotal(j) !== E.sum(j.lines, function (l) { return l.cr; }); }).length;
    if (bad) return { ok: false, errors: [bad + ' जर्नल सन्तुलित छैनन् — रिस्टोर रोकियो।'] };
    var att = {};
    if (p.att && typeof p.att === 'object') {
      if (p.attChecksum && E.sha256(JSON.stringify(p.att)) !== p.attChecksum) return { ok: false, errors: ['रसीद फोटोको checksum मिलेन — रिस्टोर रोकियो।'] };
      Object.keys(p.att).forEach(function (k) { if (/^[A-Za-z0-9_.:-]{1,80}$/.test(k) && U.store.isImgData(p.att[k])) att[k] = p.att[k]; });
    }
    return { ok: true, book: p.book, att: att, errors: [] };
  }
  U.checkBackup = checkBackup;
  FORM.restore = function (f, v) {
    var file = $('input[type=file]', f).files[0]; if (!file) return toast('फाइल छान्नुहोस्।', 'bad');
    var rd = new FileReader();
    rd.onload = function () {
      var obj; try { obj = JSON.parse(rd.result); } catch (e) { return toast('फाइल पढ्न सकिएन।', 'bad'); }
      if (obj && obj.shgfm === 'enc1') {
        if (!v.pass) return toast('यो फाइल इन्क्रिप्ट छ — पासवर्ड लेख्नुहोस्।', 'bad');
        aesKey(v.pass, unb64(obj.salt)).then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(obj.iv) }, k, unb64(obj.data)); })
          .then(function (pt) { check(JSON.parse(new TextDecoder().decode(pt))); }).catch(function () { toast('पासवर्ड मिलेन वा फाइल बिग्रिएको छ।', 'bad'); });
      } else check(obj);
    };
    rd.readAsText(file);
    function check(p) {
      var c = checkBackup(p, B().mode);
      if (!c.ok) { if (c.errors.length > 1) modal('रिस्टोर रोकियो', '<div class="err">' + c.errors.map(esc).join('<br>') + '</div>'); else toast(c.errors[0], 'bad'); return; }
      var nAtt = Object.keys(c.att).length;
      confirmBox('ब्याकअप: ' + esc(ts(p.exportedAt)) + ' · ' + esc(N(p.book.journals.length)) + ' जर्नल · ' + esc(N((p.book.users || []).length)) + ' प्रयोगकर्ता' + (nAtt ? ' · ' + esc(N(nAtt)) + ' रसीद फोटो' : '') + '।<br>हालको किताब यसले बदलिन्छ। पहिले हालको ब्याकअप लिनुभयो?', function () {
        var nb = c.book;
        U.setBook(nb);                                   // runs E.migrate (v1 → v2) and makes it the open book
        E.audit(nb, U_(), 'backup.restore', p.exportedAt);
        save();
        Promise.all(Object.keys(c.att).map(function (k) { return U.store.attPut(k, c.att[k]); })).then(function () { return U.saveNow(); }).then(function () {
          S.user = null; render(); toast('रिस्टोर भयो — फेरि लगइन गर्नुहोस्', 'ok');
        });
      }, { title: 'रिस्टोर गर्ने?', danger: true, yes: 'रिस्टोर' });
    }
  };
  ACT.resetDemo = function () {
    confirmBox('डेमो किताब नयाँ काल्पनिक डाटासहित सुरुबाट बन्छ।', function () {
      U.dropBook('demo').then(function () { U.setBook(E.buildDemo(today())); save(); S.user = null; render(); });
    });
  };
  ACT.eraseReal = function () {
    confirmBox('वास्तविक किताबका सबै कारोबार यो डिभाइसबाट मेटिन्छन्। पहिले स्वचालित ब्याकअप डाउनलोड हुन्छ। पक्का गर्न तल "मेटाउनुहोस्" लेख्नुहोस्।', function (w) {
      if (w !== 'मेटाउनुहोस्') return toast('पुष्टि शब्द मिलेन — केही मेटिएन।', 'warn');
      var b = B();
      U.store.attAll('real').then(function (att) {
        var payload = { shgfm: 'book1', app: E.VERSION, exportedAt: new Date().toISOString(), mode: b.mode, checksum: E.sha256(JSON.stringify(b)), book: b };
        if (Object.keys(att).length) { payload.att = att; payload.attChecksum = E.sha256(JSON.stringify(att)); }
        U.io.download('shg-finance-real-before-erase-' + today() + '.json', JSON.stringify(payload), 'application/json');
        return U.dropBook('real');
      }).then(function () { S.book = null; S.user = null; U.openBook(); render(); });
    }, { title: 'वास्तविक किताब मेटाउने?', reason: 'पुष्टि शब्द', danger: true, yes: 'मेटाउनुहोस्' });
  };

  /* keyboard: Enter on a focusable KPI card behaves like a click */
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.matches && e.target.matches('[data-act][tabindex]')) { e.preventDefault(); e.target.click(); } });

})();
