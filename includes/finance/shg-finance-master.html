:root{
  /* chart series — validated categorical palette, slots 1-8 in fixed order */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;

  --f-display:'Baloo 2','Mukta','Noto Sans Devanagari','SHG Deva','Nirmala UI','Kohinoor Devanagari','Devanagari Sangam MN','Mangal',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-ui:'Mukta','Noto Sans Devanagari','SHG Deva','Nirmala UI','Kohinoor Devanagari','Devanagari Sangam MN','Mangal',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-num:'Noto Sans Devanagari','SHG Deva','Inter','Nirmala UI','Kohinoor Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  --f:var(--f-ui);
  /* shape & depth */
  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:24px; --r-pill:999px;
  --elev-1:0 1px 2px rgb(var(--shadow-rgb)/var(--shadow-a)),0 4px 14px rgb(var(--shadow-rgb)/var(--shadow-a));
  --elev-2:0 2px 6px rgb(var(--shadow-rgb)/calc(var(--shadow-a)*1.2)),0 18px 36px -8px rgb(var(--shadow-rgb)/calc(var(--shadow-a)*2));
  --ring:0 0 0 3px var(--brand-50),0 0 0 4.5px var(--focus);
  --grad-gold:linear-gradient(135deg,var(--gold-1),var(--gold-2));
  --ok-fill:#127044; --bad-fill:#B42323;
  /* motion */
  --ease:cubic-bezier(.2,.8,.2,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --d1:120ms; --d2:220ms; --d3:380ms;
  /* legacy names (older rules and modules keep working) */
  --orange:var(--accent); --orange-600:var(--accent-ink); --gold1:var(--gold-1); --gold2:var(--gold-2);
  --shadow:var(--elev-1); --shadow-lift:var(--elev-2); --inset:inset 0 1px 0 var(--hi);

/* =====================================================================
   2. BASE
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html{font-size:var(--fs);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;scroll-padding-top:calc(var(--top) + 16px)}
@supports (overflow:clip){html{overflow-x:clip}}
body{font-family:var(--f-ui);font-size:1rem;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--link);text-decoration:none}
a:not([class]):hover{text-decoration:underline;text-underline-offset:3px}
img{max-width:100%;display:block}
svg{max-width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
::selection{background:var(--brand-50);color:var(--ink)}
.num,.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums}
code,kbd,.mono{font-family:var(--f-mono);font-size:.86em}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
small,.small{font-size:.8125rem}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.bs{color:var(--muted);font-size:.75rem;white-space:nowrap}
.pos{color:var(--ok)} .neg{color:var(--bad)}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;color:inherit}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.125rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{overflow-wrap:break-word}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.only-narrow{display:none!important}
@media (max-width:599px){.only-wide{display:none!important}.only-narrow{display:revert!important}}

/* =====================================================================
   3. SHELL — top bar · sidebar (desktop) · frosted bottom nav (mobile) · FAB
   ===================================================================== */
.top{position:sticky;top:0;z-index:30;height:calc(var(--top) + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;padding:env(safe-area-inset-top) 14px 0;color:#fff;
  background:radial-gradient(70% 160% at 100% 0%,rgb(240 124 31/.13),transparent 60%),linear-gradient(135deg,var(--top-a),var(--top-b));
  box-shadow:0 1px 0 rgb(255 255 255/.06) inset,0 4px 18px -6px rgb(var(--shadow-rgb)/.45)}
:root[data-theme="amoled"] .top{border-bottom:1px solid #1c1c1c}
.top .logo{width:40px;height:40px;border-radius:12px;background:#fff;padding:3px;object-fit:contain;flex:none;box-shadow:0 2px 8px rgb(0 0 0/.25)}
.top .ttl{min-width:0;flex:1;line-height:1.2}
.top .ttl b{display:block;font-family:var(--f-display);font-size:1.02rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;color:rgb(255 255 255/.86);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tbtn{min-width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#fff;flex:none;
  background:rgb(255 255 255/.12);border:1px solid rgb(255 255 255/.14);padding:0 10px;font-size:.88rem;font-weight:600;transition:background-color var(--d1),transform var(--d1) var(--ease)}
.top .tbtn:hover{background:rgb(255 255 255/.2)}
.top .tbtn:active{transform:scale(.94)}
.top .tbtn:focus-visible{outline-color:#fff}
.top select.tbtn{appearance:none;-webkit-appearance:none;max-width:120px;text-overflow:ellipsis}
.top select.tbtn option{color:#16233C;background:#fff}
.mode{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:999px;line-height:1.4;white-space:nowrap;flex:none}
.mode.demo{background:var(--grad-gold);color:#12264E;box-shadow:inset 0 1px 0 rgb(255 255 255/.45)}
.mode.real{background:#127044;color:#fff}
.side{display:none}
.wrap{padding:16px 16px calc(var(--bottom) + 28px + env(safe-area-inset-bottom));max-width:1320px;margin:0 auto}
/* bug #32 — FAB must never cover the last rows' buttons (UI toggles body.has-fab; :has() is an automatic fallback) */
body.has-fab .wrap{padding-bottom:calc(var(--bottom) + 104px + env(safe-area-inset-bottom))}
#app:has(.fab) .wrap{padding-bottom:calc(var(--bottom) + 104px + env(safe-area-inset-bottom))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--bottom) + env(safe-area-inset-bottom));padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  display:flex;gap:2px;background:var(--nav-bg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  box-shadow:0 -10px 26px -12px rgb(var(--shadow-rgb)/calc(var(--shadow-a)*3))}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.bnav{background:var(--surface)}}
@media (prefers-reduced-transparency:reduce){.bnav{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;border-radius:16px;color:var(--ink-2);font-size:.75rem;font-weight:600;line-height:1.3;
  transition:color var(--d1),transform var(--d1) var(--ease)}
.bnav a:active{transform:scale(.95)}
.bnav a i{font-style:normal;font-size:1.22rem;line-height:1;width:48px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:999px;transition:background-color var(--d2) var(--ease)}
.bnav a.on{color:var(--brand-ink)}
.bnav a.on i{background:var(--brand-50);box-shadow:inset 0 0 0 1px var(--line-2)}
.bnav a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.fab{position:fixed;right:16px;bottom:calc(var(--bottom) + 16px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:20px;
  background:var(--grad-gold);color:#12264E;font-size:2rem;font-weight:500;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 28px -10px rgb(232 137 28/.8),0 2px 6px rgb(var(--shadow-rgb)/.2),inset 0 1px 0 rgb(255 255 255/.5);transition:transform var(--d2) var(--ease),box-shadow var(--d2) var(--ease)}
.fab:hover{transform:translateY(-2px)}
.fab:active{transform:scale(.94)}
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.drawer .panel{position:absolute;top:0;bottom:0;left:0;width:min(86vw,320px);background:var(--surface);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 10px calc(20px + env(safe-area-inset-bottom));
  box-shadow:var(--elev-2);border-radius:0 24px 24px 0}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:9px 12px;border-radius:14px;color:var(--ink-2);font-weight:600;font-size:.95rem;position:relative;transition:background-color var(--d1),color var(--d1)}
.nav a i{font-style:normal;width:26px;text-align:center;font-size:1.1rem;flex:none}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--brand-50);color:var(--brand-ink);font-weight:700}
.nav a.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--brand)}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.nav .badge{margin-left:auto}
@media (min-width:1024px){
  .side{display:block;position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);overflow:auto;padding:16px 12px 24px;background:var(--surface);border-right:1px solid var(--line)}
  .wrap{margin-left:var(--side);padding:24px 28px 40px;max-width:none}
  body.has-fab .wrap,#app:has(.fab) .wrap{padding-bottom:40px}
  .wrap>*{max-width:1280px}
  .bnav,.fab,.menu-btn{display:none!important}
  h1{font-size:1.75rem}
}
/* phones: compact top bar (theme lives in the user menu); tap targets stay ≥ 40px */
@media (max-width:479px){
  .top{gap:6px;padding-left:10px;padding-right:10px}
  .top .tbtn{min-width:40px;height:40px;padding:0 8px}
  .top .tbtn.theme{display:none}
  .top .logo{width:36px;height:36px}
  .top select.tbtn{max-width:76px;padding:0 6px;font-size:.78rem}
  .mode{font-size:.64rem;padding:2px 7px}
}
@media (max-width:374px){.top .ttl small{display:none}}
.demo-ribbon{background:repeating-linear-gradient(135deg,var(--warn-bg) 0 14px,transparent 14px 28px),var(--surface);border:1px dashed var(--warn);color:var(--warn);
  border-radius:var(--r);padding:9px 12px;margin-bottom:14px;font-size:.875rem;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* =====================================================================
   4. COMPONENTS
   ===================================================================== */
/* cards — raised, glass, tappable */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--elev-1),inset 0 1px 0 var(--hi);padding:16px;margin-bottom:16px;min-width:0}
.card.flat{box-shadow:none;background:var(--surface)}
.card.raised{background:linear-gradient(180deg,var(--raise),var(--surface-2));box-shadow:var(--elev-2),inset 0 1px 0 var(--hi)}
.card.tap,.card.is-tap{cursor:pointer;transition:transform var(--d2) var(--ease),box-shadow var(--d2) var(--ease)}
@media (hover:hover){.card.tap:hover,.card.is-tap:hover{transform:translateY(-2px);box-shadow:var(--elev-2)}}
.card.tap:active,.card.is-tap:active{transform:scale(.985)}
.glass{border-radius:var(--r);padding:12px 14px;color:#fff;background:rgb(255 255 255/.07);border:1px solid rgb(255 255 255/.2);box-shadow:inset 0 1px 0 rgb(255 255 255/.16);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgb(0 0 0/.18)}}
@media (prefers-reduced-transparency:reduce){.glass{background:rgb(0 0 0/.22);-webkit-backdrop-filter:none;backdrop-filter:none}}
.card>h2,.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{margin:0;flex:1 1 160px;min-width:0}
.sub{color:var(--muted);font-size:.875rem;margin-top:-6px;margin-bottom:12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.grid>*{min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.stack>*+*{margin-top:12px}

/* buttons — pill, lift on hover (fill never changes: keeps contrast in every palette), press-scale */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-pill);font-weight:600;font-size:.95rem;line-height:1.2;
  background:var(--brand);color:var(--on-brand);border:0;text-decoration:none;white-space:nowrap;cursor:pointer;
  box-shadow:0 8px 18px -10px rgb(var(--shadow-rgb)/.9),inset 0 1px 0 rgb(255 255 255/.18);
  transition:transform var(--d1) var(--ease),box-shadow var(--d2) var(--ease),filter var(--d2) var(--ease)}
@media (hover:hover){.btn:hover{transform:translateY(-1px);box-shadow:var(--elev-2)}}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:var(--r-pill)}
.btn.or{background:var(--grad-gold);color:#12264E;box-shadow:0 10px 22px -10px rgb(232 137 28/.75),inset 0 1px 0 rgb(255 255 255/.45)}
.btn.ok{background:var(--ok-fill);color:#fff}
.btn.bad{background:var(--bad-fill);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-2)}
@media (hover:hover){.btn.ghost:hover{background:var(--hover);box-shadow:inset 0 0 0 1.5px var(--line-strong),var(--elev-1)}}
.btn.soft{background:var(--brand-50);color:var(--brand-ink);box-shadow:none}
.btn.sm{min-height:36px;padding:0 13px;font-size:.84rem}
.btn.xs{min-height:30px;padding:0 10px;font-size:.78rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
/* help "?" — small visually, 40px+ hit area */
.q{position:relative;width:22px;height:22px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;
  background:var(--brand-50);color:var(--brand-ink);border:1px solid var(--line-2);vertical-align:middle;transition:background-color var(--d1),color var(--d1)}
.q::after{content:"";position:absolute;inset:-10px}
.q:hover{background:var(--brand);color:var(--on-brand)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;line-height:1.5}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:600;line-height:1.5;background:var(--surface-2);color:var(--ink-2)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.in,.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.out,.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.due,.tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.info{background:var(--info-bg);color:var(--info)}
/* chips (filters) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:.875rem;font-weight:600;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;text-decoration:none;transition:background-color var(--d1),color var(--d1),border-color var(--d1),transform var(--d1) var(--ease)}
@media (hover:hover){.chip:hover{border-color:var(--line-strong);color:var(--ink)}}
.chip:active{transform:scale(.96)}
.chip.on,.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);box-shadow:0 6px 14px -8px rgb(var(--shadow-rgb)/.9)}
.chip .badge{font-size:.68rem;padding:0 6px}
/* segmented control — raised thumb on the chosen option */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-pill);padding:4px;gap:4px}
.seg button{flex:1;min-width:0;min-height:46px;padding:4px 8px;border-radius:var(--r-pill);font-weight:600;color:var(--ink-2);font-size:.95rem;line-height:1.25;
  transition:background-color var(--d2) var(--ease),color var(--d2) var(--ease),box-shadow var(--d2) var(--ease),transform var(--d1) var(--ease)}
.seg button:active{transform:scale(.97)}
@media (hover:hover){.seg button:not(.on):hover{background:var(--hover);color:var(--ink)}}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2),var(--elev-1)}
.seg button.on.in{background:var(--ok-fill);color:#fff;box-shadow:0 6px 14px -6px rgb(18 112 68/.6)}
.seg button.on.out{background:var(--bad-fill);color:#fff;box-shadow:0 6px 14px -6px rgb(180 35 35/.6)}
.seg button.on.tr{background:var(--brand);color:var(--on-brand);box-shadow:0 6px 14px -8px rgb(var(--shadow-rgb)/.9)}
/* radio-label variant for new modules: <div class="seg"><label><input type=radio><span>…</span></label>… */
.seg label{flex:1;position:relative;min-width:0;cursor:pointer}
.seg label input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg label span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:40px;padding:4px 8px;border-radius:var(--r-pill);font-weight:600;color:var(--ink-2);font-size:.9rem;transition:background-color var(--d2),color var(--d2)}
.seg label input:checked+span{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2),var(--elev-1)}
.seg label input:focus-visible+span{outline:3px solid var(--focus);outline-offset:1px}

/* phones / touch: every control is at least 40px tall (declared after .chip/.btn so it wins) */
@media (pointer:coarse),(max-width:479px){.btn,.btn.sm,.btn.xs,.chip,.seg label span{min-height:40px}.btn.xs{padding:0 12px}}
/* forms */
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:.84rem;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.f input,.f select,.f textarea,.inp{width:100%;min-height:46px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:1rem;
  transition:border-color var(--d2),box-shadow var(--d2)}
.f input[type="checkbox"],.f input[type="radio"]{width:20px;min-height:20px;height:20px}
.f input[type="color"]{padding:4px}
.f textarea{min-height:80px;resize:vertical;line-height:1.55}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
.f input::placeholder,.inp::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
.f .hint{font-size:.78rem;color:var(--muted)}
.f.big input{font-size:1.6rem;font-weight:700;min-height:62px;font-family:var(--f-num);font-variant-numeric:tabular-nums;border-width:1.5px;border-radius:var(--r)}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.fg>*{min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;padding:6px 0;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--brand)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:var(--r-sm);padding:10px 12px;font-size:.9rem;font-weight:600;border-left:4px solid var(--bad)}
.note{background:var(--info-bg);color:var(--info);border-radius:var(--r-sm);padding:10px 12px;font-size:.875rem}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-sm);padding:10px 12px;font-size:.875rem;font-weight:600}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:var(--r-sm);padding:10px 12px;font-size:.875rem;font-weight:600}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.catgrid label{position:relative}
.catgrid input{position:absolute;opacity:0;pointer-events:none}
.catgrid span{display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 10px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);font-size:.86rem;font-weight:600;line-height:1.3;cursor:pointer;
  transition:border-color var(--d1),background-color var(--d1),transform var(--d1) var(--ease)}
.catgrid span:active{transform:scale(.97)}
@media (hover:hover){.catgrid span:hover{border-color:var(--line-strong)}}
.catgrid span i{font-style:normal;font-size:1.2rem}
.catgrid input:checked+span{border-color:var(--brand);background:var(--brand-50);color:var(--ink);box-shadow:0 0 0 2px var(--brand) inset}
.catgrid input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}

/* KPI tiles — raised, status bar + soft orb in the status colour */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr))}
.kpi{--c:var(--line-strong);position:relative;isolation:isolate;display:flex;flex-direction:column;gap:4px;padding:14px 14px 12px 16px;border-radius:var(--r);background:linear-gradient(180deg,var(--raise),var(--surface));
  border:1px solid var(--line);box-shadow:var(--elev-1),inset 0 1px 0 var(--hi);cursor:pointer;text-align:left;overflow:hidden;min-width:0;
  transition:transform var(--d2) var(--ease),box-shadow var(--d2) var(--ease)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.kpi::after{content:"";position:absolute;z-index:-1;right:-34px;top:-34px;width:96px;height:96px;border-radius:50%;background:var(--c);opacity:.1}
.kpi.st-ok{--c:var(--ok)} .kpi.st-warn{--c:var(--warn)} .kpi.st-bad{--c:var(--bad)} .kpi.st-info{--c:var(--brand)}
@media (hover:hover){.kpi:hover{transform:translateY(-2px);box-shadow:var(--elev-2)}}
.kpi:active{transform:scale(.985)}
.kpi .kh{display:flex;align-items:flex-start;gap:6px}
.kpi .kt{flex:1;font-size:.86rem;font-weight:600;color:var(--ink-2);line-height:1.35}
.kpi .kv{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.42rem;font-weight:700;line-height:1.2;overflow-wrap:anywhere;color:var(--ink)}
.kpi .ks{font-size:.75rem;color:var(--muted);line-height:1.45}
.kpi .kf{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.trend{font-size:.75rem;font-weight:700;font-family:var(--f-num)}
/* phones: two money cards per row, details clamped (full detail on tap → ledger) */
@media (max-width:599px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:11px 10px 10px 13px;border-radius:14px;gap:3px}
  .kpi::after{width:70px;height:70px;right:-26px;top:-26px}
  .kpi .kt{font-size:.78rem}
  .kpi .kv{font-size:1.08rem}
  .kpi .ks{font-size:.7rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .kpi .ks.when,.trend .muted{display:none}
  .kpi .q{width:20px;height:20px;font-size:.66rem}
  .kpi .badge{font-size:.64rem;padding:1px 6px}
  .hero{padding:18px 16px}
  .hero h1{font-size:1.28rem}
}
.morecats>summary{cursor:pointer;font-weight:700;font-size:.875rem;color:var(--link);padding:8px 2px;list-style:none;min-height:40px;display:flex;align-items:center}
.morecats>summary::-webkit-details-marker{display:none}
/* hero — ONE soft gradient moment per screen (white text ≥ 4.89:1 measured on every pixel) */
.hero{border-radius:var(--r-lg);padding:22px 20px;margin-bottom:16px;color:#fff;position:relative;isolation:isolate;overflow:hidden;
  background:radial-gradient(120% 90% at 0% 0%,rgb(255 255 255/.07),transparent 55%),linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);
  background:radial-gradient(120% 90% at 0% 0%,rgb(255 255 255/.07),transparent 55%),radial-gradient(70% 70% at 0% 100%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),
    linear-gradient(135deg,var(--hero-a) 0%,color-mix(in srgb,var(--hero-a) 35%,var(--hero-b)) 60%,var(--hero-b) 100%);
  box-shadow:var(--elev-2)}
.hero::after{content:"";position:absolute;z-index:-1;right:-64px;top:-64px;width:190px;height:190px;border-radius:50%;background:var(--grad-gold);opacity:.12}
.hero::before{content:"";position:absolute;z-index:-1;right:40px;bottom:-90px;width:160px;height:160px;border-radius:50%;border:24px solid rgb(255 255 255/.04)}
.hero h1{color:#fff;font-weight:700}
.hero p{color:rgb(255 255 255/.9);margin-top:6px;font-size:.95rem;max-width:62ch}
.hero a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.hero .hd{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.hero .hd span{background:rgb(255 255 255/.1);border:1px solid rgb(255 255 255/.2);border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:600;line-height:1.5;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hero .ask{margin-top:14px;display:flex;gap:8px}
.hero .ask input{flex:1;min-width:0;min-height:48px;border-radius:var(--r-pill);border:0;padding:0 18px;font-size:.95rem;background:rgb(255 255 255/.96);color:#16233C;box-shadow:inset 0 1px 2px rgb(0 0 0/.08)}
.hero .ask input::placeholder{color:#5F6D87}
.hero .ask input:focus{outline:3px solid var(--gold-1);outline-offset:2px}
.hero .ask .btn{background:var(--grad-gold);color:#12264E;box-shadow:0 10px 22px -10px rgb(0 0 0/.5),inset 0 1px 0 rgb(255 255 255/.45)}
.hero .glass{margin-top:12px}
/* quick actions */
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (min-width:720px){.qa{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}}
.qa a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:88px;padding:10px 6px;border-radius:18px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--elev-1),inset 0 1px 0 var(--hi);color:var(--ink);font-size:.8rem;font-weight:600;line-height:1.3;
  transition:transform var(--d2) var(--ease),box-shadow var(--d2) var(--ease)}
@media (hover:hover){.qa a:hover{transform:translateY(-2px);box-shadow:var(--elev-2)}}
.qa a:active{transform:scale(.96)}
.qa a i{font-style:normal;font-size:1.4rem;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--brand-50)}
.qa a.in{background:linear-gradient(180deg,var(--ok-bg),var(--surface));border-color:transparent;color:var(--ok)}
.qa a.out{background:linear-gradient(180deg,var(--bad-bg),var(--surface));border-color:transparent;color:var(--bad)}
.qa a.in i,.qa a.out i{background:var(--surface)}

/* tables — sticky head, zebra rows, right-aligned tabular numbers */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;max-width:100%}
@media (min-width:720px){.tw{max-height:72vh;overflow:auto}}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;line-height:1.45}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:.8rem;font-weight:700;color:var(--ink-2);white-space:nowrap;position:sticky;top:0;z-index:1;border-bottom-color:var(--line-2)}
td.r,th.r,td.num,th.num{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:hover td{background:var(--hover)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line-strong);border-bottom:0;position:sticky;bottom:0;z-index:1}
tr.click{cursor:pointer}
tr.click:focus-visible td{background:var(--hover)}
tr.sec td{background:var(--brand-50);font-weight:700;color:var(--ink)}
tr.rev td{color:var(--muted);text-decoration:line-through}
td .btn+.btn{margin-left:4px}
/* sticky first column for wide entry grids (payroll): <div class="tw sticky1"> */
.tw.sticky1 th:first-child,.tw.sticky1 td:first-child{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.tw.sticky1 th:first-child{z-index:3;background:var(--surface-2)}
/* empty state — friendly, illustrated */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;color:var(--muted);padding:24px 16px;font-size:.92rem;
  border:1.5px dashed var(--line-2);border-radius:var(--r);background:radial-gradient(60% 60% at 50% 0%,var(--brand-50),transparent 70%),var(--surface)}
.empty i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1.7rem;width:58px;height:58px;border-radius:20px;margin-bottom:6px;
  background:var(--grad-gold);box-shadow:var(--elev-2);transform:rotate(-6deg)}
.empty b,.empty .t{font-family:var(--f-display);color:var(--ink);font-size:1.05rem}
.list>div{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.list .li-t{flex:1;min-width:0}
.list .li-t b{display:block;font-size:.92rem;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.list .li-t small{color:var(--muted)}
.ins{display:flex;gap:10px;padding:11px 12px;border-radius:14px;margin-bottom:8px;font-size:.88rem;align-items:flex-start;border:1px solid transparent;transition:transform var(--d1) var(--ease)}
a.ins:active{transform:scale(.99)}
.ins.warn{background:var(--warn-bg);color:var(--warn)} .ins.bad{background:var(--bad-bg);color:var(--bad)} .ins.info{background:var(--info-bg);color:var(--info)}
.ins b{font-weight:700} .ins small{display:block;opacity:.9}
.jprev{border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:12px;background:var(--surface-2)}
.jprev .jl{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:3px 0}
.jprev .jl .num{white-space:nowrap}
.statbar{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat span{display:flex;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);font-weight:600}
.stat b{display:block;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.12rem;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
details.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:12px;box-shadow:var(--elev-1)}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;min-height:48px;font-weight:700;display:flex;gap:10px;align-items:center;border-radius:var(--r)}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform var(--d2) var(--ease)}
details.acc[open]>summary::after{transform:rotate(180deg)}
details.acc>.acc-b{padding:0 16px 16px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.steps span{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted)}
.steps span.done{background:var(--ok-fill);color:#fff;border-color:var(--ok-fill)}
.steps span.skip{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.steps span.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold-2));border-radius:99px;transition:width var(--d3) var(--ease-out)}
.skel{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 37%,var(--surface-2) 63%);background-size:400% 100%;border-radius:var(--r-sm);min-height:1em}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-num);fill:var(--muted);font-size:11px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--brand-deep);color:#fff;font-size:.8rem;padding:6px 10px;border-radius:10px;box-shadow:var(--elev-2);max-width:240px;display:none;font-family:var(--f-num);border:1px solid rgb(255 255 255/.12)}
:root[data-theme="amoled"] .tip{background:#1b1b1b;border-color:#333}

/* modal = bottom sheet on phones, dialog on desktop */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal .box{position:relative;background:var(--surface);color:var(--ink);width:100%;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:22px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--elev-2);border:1px solid var(--line);border-bottom:0}
.modal .box::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line-2)}
.modal .box .mh{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.modal .box .mh h2{flex:1;min-width:0;overflow-wrap:anywhere}
.modal .x{width:40px;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:1.1rem;flex:none;color:var(--ink-2)}
.modal .x:hover{background:var(--hover);color:var(--ink)}
@media (min-width:720px){.modal{align-items:center;padding:16px}.modal .box{max-width:640px;border-radius:var(--r-lg);padding:24px;border-bottom:1px solid var(--line)}.modal .box::before{display:none}}
.modal .box.wide{max-width:960px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bottom) + 92px + env(safe-area-inset-bottom));z-index:95;background:var(--brand-deep);color:#fff;
  padding:11px 18px;border-radius:var(--r-pill);font-size:.92rem;font-weight:600;box-shadow:var(--elev-2);max-width:min(92vw,520px);width:max-content;border:1px solid rgb(255 255 255/.12)}
.toast.ok{background:#11673D} .toast.bad{background:#9B1C1C} .toast.warn{background:#7A4D00}
@media (min-width:1024px){.toast{bottom:28px}}

/* login */
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 16px;
  background:radial-gradient(90% 60% at 100% 0%,rgb(240 124 31/.22),transparent 60%),radial-gradient(80% 60% at 0% 100%,rgb(255 255 255/.08),transparent 60%),linear-gradient(160deg,var(--hero-a),var(--hero-b))}
.login .lbox{width:100%;max-width:440px;background:var(--surface);color:var(--ink);border-radius:28px;padding:26px 20px;box-shadow:0 30px 80px rgb(0 0 0/.4);text-align:center;border:1px solid var(--line)}
.login .llogo{width:150px;margin:0 auto 10px;background:#fff;border-radius:20px;padding:8px;box-shadow:var(--elev-1)}
.login h1{font-size:1.35rem}
.login p{color:var(--muted);font-size:.92rem;margin-top:4px}
.users{display:grid;gap:10px;margin-top:16px;text-align:left}
.users button{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface-2);text-align:left;min-height:64px;
  transition:border-color var(--d1),transform var(--d1) var(--ease),box-shadow var(--d2) var(--ease)}
@media (hover:hover){.users button:hover{border-color:var(--brand);box-shadow:var(--elev-1);transform:translateY(-1px)}}
.users button:active{transform:scale(.98)}
.users .av{width:42px;height:42px;border-radius:50%;background:var(--grad-gold);color:#12264E;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.pin{display:flex;justify-content:center;gap:12px;margin:18px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand);display:block;transition:background-color var(--d1),transform var(--d1) var(--ease)}
.pin i.f{background:var(--brand);transform:scale(1.1)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{min-height:60px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line);font-size:1.4rem;font-weight:600;font-family:var(--f-num);transition:transform var(--d1) var(--ease),background-color var(--d1)}
.pad button:active{background:var(--brand-50);transform:scale(.95)}
.denied{text-align:center;padding:40px 16px}
.denied i{font-size:3rem;font-style:normal;display:block}
.denied>h2{justify-content:center}

/* glossary / learning */
.terms{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.terms button{text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--elev-1);font-weight:600;min-height:56px;
  transition:transform var(--d2) var(--ease),box-shadow var(--d2) var(--ease)}
@media (hover:hover){.terms button:hover{transform:translateY(-2px);box-shadow:var(--elev-2)}}
.terms button small{display:block;color:var(--muted);font-weight:400;margin-top:2px}
.gl-sec{margin-top:12px}
.gl-sec h3{font-size:.84rem;color:var(--muted);margin-bottom:4px}
.formula{font-family:var(--f-num);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}

/* =====================================================================
   5. MODULE CLASSES (trace, statements, website sync, palette picker…)
   ===================================================================== */
/* callouts: <div class="callout warn"><i>⚠️</i><div><b>…</b> text <label class="check">…</label></div></div> */
.callout{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--line);border-left:4px solid var(--line-strong);background:var(--surface-2);color:var(--ink);font-size:.92rem;line-height:1.55;margin:8px 0}
.callout>i:first-child{font-style:normal;font-size:1.15rem;line-height:1.4;flex:none}
.callout>div{flex:1;min-width:0}
.callout b{font-weight:700}
.callout .check{padding:8px 0 0;font-weight:600}
.callout.warn{background:var(--warn-bg);border-color:transparent;border-left-color:var(--warn)} .callout.warn b{color:var(--warn)}
.callout.ok{background:var(--ok-bg);border-color:transparent;border-left-color:var(--ok)} .callout.ok b{color:var(--ok)}
.callout.info{background:var(--info-bg);border-color:transparent;border-left-color:var(--info)} .callout.info b{color:var(--info)}
.callout.bad{background:var(--bad-bg);border-color:transparent;border-left-color:var(--bad)} .callout.bad b{color:var(--bad)}
/* tab bar: <div class="tabs" role="tablist"><a class="on">सिंक</a><a>मिलान</a>… (also aria-selected / aria-current) */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px;margin-bottom:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;overscroll-behavior-x:contain}
.tabs::-webkit-scrollbar{display:none}
.tabs>a,.tabs>button{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:14px;color:var(--ink-2);font-weight:600;font-size:.92rem;white-space:nowrap;text-decoration:none;
  transition:background-color var(--d2) var(--ease),color var(--d2),box-shadow var(--d2)}
@media (hover:hover){.tabs>a:hover,.tabs>button:hover{color:var(--ink);background:var(--hover)}}
.tabs>.on,.tabs>[aria-selected="true"],.tabs>[aria-current="page"]{background:var(--surface);color:var(--brand-ink);box-shadow:0 0 0 1px var(--line-2),var(--elev-1)}
.tabs>.on::after,.tabs>[aria-selected="true"]::after,.tabs>[aria-current="page"]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
/* timeline: <ol class="tl"><li class="tl-item ok"><i class="tl-ico">✓</i><div class="tl-body"><div class="tl-t">…<span class="tl-amt">…</span></div><div class="tl-sub">…</div></div></li></ol> */
.tl{position:relative;list-style:none;margin:0;padding:0}
.tl::before{content:"";position:absolute;left:19px;top:12px;bottom:12px;width:2px;border-radius:2px;background:linear-gradient(var(--line-2),var(--line))}
.tl-item{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:4px 0 16px;list-style:none}
.tl-item:last-child{padding-bottom:2px}
.tl-ico{position:relative;z-index:1;width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1.05rem;font-weight:700;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2);box-shadow:var(--elev-1)}
.tl-item.ok .tl-ico{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tl-item.warn .tl-ico{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tl-item.bad .tl-ico{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tl-item.info .tl-ico{background:var(--info-bg);color:var(--info);border-color:transparent}
.tl-item.web .tl-ico,.tl-item.on .tl-ico{background:var(--brand);color:var(--on-brand);border-color:transparent}
.tl-item.on .tl-body{background:var(--brand-50);border-radius:12px;padding:6px 10px;margin:-6px 0 0 -4px}
.tl-body{min-width:0;padding-top:1px}
.tl-t{display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap;font-weight:600;line-height:1.4;color:var(--ink)}
.tl-sub{font-size:.8125rem;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.tl-meta{font-size:.75rem;color:var(--muted);font-family:var(--f-num)}
.tl-amt{margin-left:auto;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.tl-body .row{margin-top:6px;gap:6px}
/* money path: <div class="flow"><div class="flow-n src"><small>स्रोत</small><b>…</b></div><span class="flow-a">→</span>… */
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:6px 0}
.flow-n{flex:1 1 130px;min-width:0;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi)}
.flow-n small{font-size:.75rem;color:var(--muted);font-weight:600}
.flow-n b{font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.flow-n .amt{font-weight:700}
.flow-n.src{background:var(--brand-50);border-color:var(--line-2)}
.flow-n.in,.flow-n.ok,.flow-n.bank{background:var(--ok-bg);border-color:transparent}
.flow-n.out,.flow-n.bad{background:var(--bad-bg);border-color:transparent}
.flow-n.warn{background:var(--warn-bg);border-color:transparent}
.flow-a{flex:none;align-self:center;color:var(--muted);font-size:1.25rem;font-weight:700;line-height:1}
@media (max-width:599px){.flow{flex-direction:column}.flow-n{flex:none}.flow-a{transform:rotate(90deg);margin:0 auto}}
/* integrity badge: <span class="integrity ok"><i>✓</i>हिसाब अखण्ड <code>a1b2c3</code></span> */
.integrity{display:inline-flex;align-items:center;gap:8px;min-width:0;min-height:34px;padding:4px 12px 4px 5px;border-radius:999px;font-size:.84rem;font-weight:600;line-height:1.3;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);max-width:100%}
.integrity>i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;background:var(--line-strong);color:#fff}
.integrity code{font-size:.75rem;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.integrity.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent} .integrity.ok>i{background:var(--ok-fill)}
.integrity.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent} .integrity.bad>i{background:var(--bad-fill)}
.integrity.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent} .integrity.warn>i{background:#8A5800}
/* website sync steps: <div class="sync-step done"><i>✓</i><div><b>बुकिङ</b><small>१२० नयाँ</small></div><span class="amt">…</span><div class="prog"><i></i></div></div> */
.sync-step{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:8px;font-size:.92rem;color:var(--ink)}
.sync-step>i:first-child{font-style:normal;flex:none;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--surface);color:var(--muted);border:1px solid var(--line-2)}
.sync-step>div:not(.prog){flex:1;min-width:0}
.sync-step b{display:block;font-weight:600;line-height:1.35}
.sync-step small{display:block;color:var(--muted);font-size:.8125rem;overflow-wrap:anywhere}
.sync-step .prog{flex:1 0 100%}
.sync-step.done>i:first-child{background:var(--ok-fill);color:#fff;border-color:transparent}
.sync-step.on>i:first-child,.sync-step.run>i:first-child{background:var(--brand);color:var(--on-brand);border-color:transparent}
.sync-step.on,.sync-step.run{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.sync-step.err,.sync-step.bad{background:var(--bad-bg);border-color:transparent}
.sync-step.err>i:first-child,.sync-step.bad>i:first-child{background:var(--bad-fill);color:#fff;border-color:transparent}
.sync-step.warn{background:var(--warn-bg);border-color:transparent}
.sync-step.err small,.sync-step.bad small,.sync-step.warn small{color:var(--ink-2)}
.sync-step.skip,.sync-step.wait{opacity:.75;border-style:dashed}
.prog.indet i{width:40%!important;background:linear-gradient(90deg,transparent,var(--brand),transparent)}
/* stale-tab / notice banner: <div class="banner"><span>…</span><button class="btn sm">रिलोड</button></div> */
.banner{position:sticky;top:calc(var(--top) + env(safe-area-inset-top));z-index:29;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;padding:10px 16px;margin:0 0 14px;
  background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn);border-radius:var(--r-sm);font-size:.92rem;font-weight:600;box-shadow:var(--elev-2)}
.banner>span,.banner>div{flex:1;min-width:min(100%,200px)}
.banner b{color:var(--warn)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad)} .banner.bad b{color:var(--bad)}
.banner.info{background:var(--info-bg);border-color:var(--info)} .banner.info b{color:var(--info)}
.banner.ok{background:var(--ok-bg);border-color:var(--ok)} .banner.ok b{color:var(--ok)}
body>.banner{margin:0;border-radius:0;border-width:0 0 1px}
@media (min-width:1024px){body>.banner{margin-left:var(--side)}}
/* palette picker: <div class="swatches"><button class="swatch on" data-p="brand" aria-pressed="true" title="श्रीहरि"><span class="sr">श्रीहरि</span></button>… */
.swatches{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.swatch{--sw-a:#12264E;--sw-b:#F07C1F;position:relative;flex:none;width:44px;height:44px;border-radius:50%;padding:0;font-size:0;cursor:pointer;
  background:linear-gradient(135deg,var(--sw-a) 0 52%,var(--sw-b) 52% 100%);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line-2),var(--elev-1);transition:transform var(--d1) var(--ease),box-shadow var(--d2)}
.swatch:active{transform:scale(.92)}
.swatch[data-p="himal"],.swatch[data-palette="himal"]{--sw-a:#0E6E78;--sw-b:#E8A317}
.swatch[data-p="laliguras"],.swatch[data-palette="laliguras"],.swatch[data-p="laligurans"]{--sw-a:#C8102E;--sw-b:#003893}
.swatch[data-p="violet"],.swatch[data-palette="violet"]{--sw-a:#6A1FD1;--sw-b:#00C4CC}
.swatch[data-p="hariyali"],.swatch[data-palette="hariyali"]{--sw-a:#0F7A55;--sw-b:#E8A317}
.swatch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.swatch.on,.swatch[aria-pressed="true"],.swatch[aria-checked="true"],.swatch:has(input:checked){box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--focus)}
.swatch.on::after,.swatch[aria-pressed="true"]::after,.swatch[aria-checked="true"]::after,.swatch:has(input:checked)::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:1rem;font-weight:800;text-shadow:0 1px 3px rgb(0 0 0/.6)}
.swatch:focus-visible,.swatch:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:3px}
/* mobile card-per-row lists (bug #32): <div class="card-rows"><div class="card-row"><div class="cr-h"><b>नाम</b><span class="amt">…</span></div>
   <div class="cr-g">…label/inputs…</div><div class="cr-a">…buttons…</div></div></div> */
.card-rows{display:grid;gap:10px}
.card-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--elev-1),inset 0 1px 0 var(--hi);min-width:0;margin-bottom:10px}
.card-rows>.card-row{margin-bottom:0}
.card-row.sel,.card-row.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-50),var(--elev-1)}
.card-row .cr-h{display:flex;gap:6px 10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px;font-weight:700;line-height:1.35}
.card-row .cr-h>:first-child{min-width:0;overflow-wrap:anywhere}
.card-row .cr-h small{display:block;font-weight:400;color:var(--muted)}
.card-row .cr-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.card-row .cr-g>*{min-width:0}
.card-row .cr-g .wide,.card-row .cr-g .f.big{grid-column:1/-1}
.card-row .cr-k{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.card-row .cr-v{display:block;font-weight:600;overflow-wrap:anywhere}
.card-row .cr-v.amt,.card-row .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.card-row .cr-a{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}
.card-row .f input,.card-row .f select{min-height:42px}
/* A4 statement — paper on screen (always light: tokens re-declared on .stmt), exact A4 in print */
.stmt{--p-ink:#16233C;--p-ink2:#3F4D68;--p-muted:#5F6D87;--p-navy:#12264E;--p-blue:#2E5FA8;--p-line:#E1E8F2;--p-line2:#C9D3E3;--p-zebra:#F3F6FB;
  position:relative;isolation:isolate;display:block;width:100%;max-width:210mm;margin:0 auto 18px;padding:12mm 12mm 10mm;background:#fff;color:var(--p-ink);color-scheme:light;
  border-radius:6px;font-size:.9rem;line-height:1.5;overflow:hidden;
  box-shadow:0 0 0 1px rgb(18 38 78/.06),0 2px 6px rgb(0 0 0/.08),0 24px 48px -16px rgb(var(--shadow-rgb)/.45)}
.stmt h1,.stmt h2,.stmt h3{color:var(--p-navy)}
.stmt a{color:#24518F}
.stmt-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.stmt-head img{width:84px;height:auto;max-height:84px;object-fit:contain}
.stmt-co h1{font:700 1.35rem/1.25 var(--f-display);color:var(--p-navy);margin:0}
.stmt-co p{margin:0;font-size:.8rem;color:var(--p-ink2);line-height:1.45;overflow-wrap:anywhere}
.stmt-badge{text-align:right;padding:10px 14px;border-radius:10px;background:var(--p-navy);color:#fff}
.stmt-badge b{display:block;font:700 1.05rem/1.2 var(--f-display);color:#fff}
.stmt-badge span{font-size:.68rem;letter-spacing:.08em;color:#F5C869;font-family:var(--f-num)}
.stmt-band{height:6px;margin:14px 0 16px;border-radius:4px;background:linear-gradient(90deg,#12264E 0 55%,#2E5FA8 55% 75%,#F5C869 75%,#E8891C)}
.stmt-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--p-line2);border-radius:10px;overflow:hidden;margin:0 0 14px}
.stmt-meta>div{padding:8px 10px;border-right:1px solid var(--p-line);min-width:0}
.stmt-meta>div:last-child{border-right:0}
.stmt-meta dt{font-size:.72rem;color:var(--p-muted)} .stmt-meta dd{margin:0;font-weight:600;font-size:.88rem;overflow-wrap:anywhere}
.stmt-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stmt-sum>div{padding:10px;border-radius:10px;background:#F2F5FA;border:1px solid var(--p-line);min-width:0}
.stmt-sum small{display:block;font-size:.72rem;color:var(--p-muted)}
.stmt-sum b{font:700 1rem/1.3 var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stmt-sum .is-close{background:var(--p-navy);border-color:var(--p-navy);color:#fff} .stmt-sum .is-close small{color:#F5C869}
.stmt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stmt .tw{border:0;border-radius:0;max-height:none;overflow:visible;background:transparent}
.stmt-table{width:100%;border-collapse:collapse;font-size:.84rem;line-height:1.4;color:var(--p-ink)}
.stmt-table thead{display:table-header-group}
.stmt-table th{position:static;background:var(--p-navy);color:#fff;font-weight:600;font-size:.78rem;text-align:left;padding:8px;border:0;white-space:nowrap}
.stmt-table th:first-child{border-top-left-radius:6px} .stmt-table th:last-child{border-top-right-radius:6px}
.stmt-table td{padding:7px 8px;border-bottom:1px solid var(--p-line);vertical-align:top;background:transparent;color:inherit}
.stmt-table tbody tr:nth-child(even) td,.stmt-table tbody tr:hover td{background:transparent}
.stmt-table tbody.rows tr:nth-child(even) td{background:var(--p-zebra)}
.stmt-table .num,.stmt-table th.num,.stmt-table .r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.stmt-table .dr{color:#B42323} .stmt-table .cr{color:#127044}
.stmt-table tr.bf td{background:#FFF3D6;font-weight:600}
.stmt-table tbody.totals td{border-top:1.5px solid var(--p-navy);border-bottom:3px double var(--p-navy);font-weight:700;background:#EEF3FB}
.stmt-words{margin:10px 0 0;font-size:.86rem}
.stmt-sign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 100px;gap:24px;align-items:end;margin-top:44px}
.stmt-sign>div{border-top:1px solid var(--p-navy);padding-top:6px;font-size:.8rem;text-align:center}
.stmt-sign small{display:block;color:var(--p-muted);font-size:.72rem}
.stmt-sign>.stmt-seal{border:1.5px dashed #7D8EAB;border-radius:50%;width:100px;height:100px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--p-muted);text-align:center;padding:0}

/* =====================================================================
   6. MOTION — quiet & fast; transform/opacity only; reduced-motion = off
   ===================================================================== */
@media (prefers-reduced-motion:no-preference){
  body{transition:background-color var(--d3) var(--ease),color var(--d3) var(--ease)}
  .wrap>*{animation:shg-rise 300ms var(--ease-out) both}
  .wrap>*:nth-child(2){animation-delay:30ms} .wrap>*:nth-child(3){animation-delay:60ms} .wrap>*:nth-child(4){animation-delay:90ms}
  .wrap>*:nth-child(5){animation-delay:120ms} .wrap>*:nth-child(n+6){animation-delay:150ms}
  .modal{animation:shg-fade var(--d2) var(--ease) both}
  .modal .box{animation:shg-sheet var(--d3) var(--ease-out) both}
  .drawer.open .scrim{animation:shg-fade var(--d2) var(--ease) both}
  .drawer.open .panel{animation:shg-slide var(--d3) var(--ease-out) both}
  .toast{animation:shg-toast var(--d3) var(--ease-out) both}
  .skel{animation:shg-shimmer 1.4s ease infinite}
  .prog.indet i{animation:shg-indet 1.2s var(--ease) infinite}
  .sync-step.run>i:first-child,.sync-step.on>i:first-child{animation:shg-pulse 1.4s var(--ease) infinite}
}
@media (prefers-reduced-motion:no-preference) and (min-width:720px){.modal .box{animation-name:shg-pop}}
@keyframes shg-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shg-fade{from{opacity:0}to{opacity:1}}
@keyframes shg-sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes shg-pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes shg-slide{from{transform:translateX(-30px);opacity:.5}to{transform:none;opacity:1}}
@keyframes shg-toast{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes shg-shimmer{from{background-position:100% 0}to{background-position:0 0}}
@keyframes shg-indet{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes shg-pulse{0%,100%{box-shadow:0 0 0 0 var(--brand-50)}50%{box-shadow:0 0 0 6px var(--brand-50)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

<noscript><p style="padding:20px">यो एप चलाउन JavaScript चाहिन्छ। (JavaScript is required.)</p></noscript>
<script id="shg-engine">
/* =====================================================================
   SHG FINANCE ENGINE — pure logic, no DOM.
   ---------------------------------------------------------------------
   Everything that does arithmetic lives here so it can be tested with
   Node (tests/finance-master-test.js extracts this <script> and runs it).

   GROUND RULES (read these before you change anything):
   1. Money is ALWAYS an integer number of paise/paisa ("minor units").
      ₹1,250.50 is stored as 125050. Never store 1250.5 — floats drift.
   2. Every money movement is a JOURNAL with lines. Sum(debits) must
      equal Sum(credits) or postJournal() refuses it.
   3. A posted journal is never edited or deleted. Mistakes are undone
      with reverseJournal(), which posts the exact mirror entry.
   4. Business rules (₹200/₹400 commission, approval limits, FX rate …)
      live in state.settings and are effective-dated, so changing a rate
      today never rewrites yesterday's numbers.
   ===================================================================== */
(function (root) {
  'use strict';
  var E = {};
  E.VERSION = '2.0.0';
  E.BOOK_VERSION = 2;

  /* ------------------------------------------------------------------
     1. MONEY
     ------------------------------------------------------------------ */
  var DEV = '०१२३४५६७८९';
  function toAscii(s) {
    return String(s == null ? '' : s).replace(/[०-९]/g, function (d) { return String(DEV.indexOf(d)); });
  }
  E.toAscii = toAscii;
  E.toDev = function (s) { return String(s).replace(/[0-9]/g, function (d) { return DEV[+d]; }); };

  /** "1,23,456.78" | "१२००" | 1500 -> integer minor units, or NaN. */
  function parseMoney(v) {
    if (typeof v === 'number') return isFinite(v) ? Math.round(v * 100) : NaN;
    var s = toAscii(v).replace(/₹|रु\.?|Rs\.?|INR|NPR|,|\s/gi, '');
    if (s === '' || !/^-?\d*(\.\d*)?$/.test(s) || s === '-' || s === '.') return NaN;
    var neg = s.charAt(0) === '-';
    if (neg) s = s.slice(1);
    var p = s.split('.'), ip = p[0] || '0', fp = p[1] || '';
    var minor = parseInt(ip, 10) * 100 + parseInt((fp + '00').slice(0, 2), 10);
    if (fp.length > 2 && +fp.charAt(2) >= 5) minor += 1;   // round half up at the 3rd decimal
    return neg ? -minor : minor;
  }
  E.parseMoney = parseMoney;

  /** 1234567 -> "12,34,567" (Indian grouping). */
  function groupIndian(intStr) {
    if (intStr.length <= 3) return intStr;
    var last3 = intStr.slice(-3), rest = intStr.slice(0, -3);
    return rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
  }
  E.groupIndian = groupIndian;

  /** minor units -> "₹1,23,456.50" / "रु 1,200". */
  function fmt(minor, cur, opt) {
    if (minor == null || isNaN(minor)) return '—';
    opt = opt || {};
    var neg = minor < 0, a = Math.abs(Math.round(minor));
    var ip = Math.floor(a / 100), fp = a % 100;
    var s = groupIndian(String(ip)) + (fp || opt.paise ? '.' + (fp < 10 ? '0' : '') + fp : '');
    var sym = opt.noSym ? '' : (cur === 'NPR' ? 'रु ' : '₹');
    return (neg ? '−' : '') + sym + s;
  }
  E.fmt = fmt;
  /** minor -> plain number string for CSV/XLSX (no symbol, no grouping). */
  E.plain = function (minor) { return (Math.round(minor) / 100).toFixed(2); };
  /** percentage of a minor amount, rounded half-up to the nearest paisa. */
  E.pctOf = function (minor, pct) { return Math.round(minor * pct / 100); };
  E.sum = function (arr, f) { var t = 0; for (var i = 0; i < arr.length; i++) t += f ? f(arr[i]) : arr[i]; return t; };

  /* ------------------------------------------------------------------
     2. DATES (ISO "YYYY-MM-DD" strings everywhere) + Nepali BS
     ------------------------------------------------------------------ */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseIso(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  E.isoOf = isoOf;
  E.today = function () { return isoOf(new Date()); };
  E.validIso = function (s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) return false;
    var d = parseIso(s); return isoOf(d) === s;
  };
  E.addDays = function (iso, n) { var d = parseIso(iso); d.setDate(d.getDate() + n); return isoOf(d); };
  E.daysBetween = function (a, b) {
    var pa = String(a).split('-'), pb = String(b).split('-');
    return Math.round((Date.UTC(+pb[0], +pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], +pa[1] - 1, +pa[2])) / 86400000);
  };
  E.monthStart = function (iso) { return iso.slice(0, 8) + '01'; };
  E.monthEnd = function (iso) { var d = parseIso(iso.slice(0, 8) + '01'); d.setMonth(d.getMonth() + 1); d.setDate(0); return isoOf(d); };
  E.addMonths = function (iso, n) { var d = parseIso(iso.slice(0, 8) + '01'); d.setMonth(d.getMonth() + n); return isoOf(d); };
  /** Is this entity (object, id or country/currency string) the Nepal company? */
  function isNP(ent) {
    if (!ent) return false;
    if (typeof ent === 'string') return /^(np|npr|nepal|नेपाल)$/i.test(ent.trim());
    return ent.id === 'NP' || ent.currency === 'NPR' || /^(nepal|नेपाल)$/i.test(String(ent.country || ''));
  }
  E.isNP = isNP;
  /** Financial year containing iso. India: 1 April – 31 March. Nepal (entity
      country Nepal / id NP / NPR): 1 Shrawan – last day of Asar, from the
      verified BS table; outside the table an approximate 16 July start is
      used and the result carries approx:true. */
  E.fyOf = function (iso, ent) {
    if (isNP(ent)) {
      var b = E.toBS(iso);
      if (b) {
        var y = b.m >= 4 ? b.y : b.y - 1, from = bsShrawan1(y), next = bsShrawan1(y + 1);
        if (from) return { from: from, to: next ? E.addDays(next, -1) : approxNpEnd(y), label: 'आ.व. ' + E.toDev(y + '/' + String(y + 1).slice(2)), bs: y, np: true, approx: !next };
      }
      var ay = +iso.slice(0, 4), s0 = iso.slice(5) >= '07-16' ? ay : ay - 1;
      return { from: s0 + '-07-16', to: (s0 + 1) + '-07-15', label: 'आ.व. (अनुमानित) ' + s0 + '-' + String(s0 + 1).slice(2), np: true, approx: true };
    }
    var y2 = +iso.slice(0, 4), m = +iso.slice(5, 7), s = m >= 4 ? y2 : y2 - 1;
    return { from: s + '-04-01', to: (s + 1) + '-03-31', label: 'FY ' + s + '-' + String(s + 1).slice(2) };
  };
  /** Preset ranges used by the dashboard filter. ent (optional) = the entity object, for the NP fiscal year. */
  E.rangeFor = function (preset, today, ent) {
    var t = today || E.today();
    switch (preset) {
      case 'today': return { from: t, to: t };
      case 'yesterday': var y = E.addDays(t, -1); return { from: y, to: y };
      case 'week': var dow = parseIso(t).getDay(); return { from: E.addDays(t, -dow), to: t };
      case 'month': return { from: E.monthStart(t), to: t };
      case 'lastmonth': var lm = E.addMonths(t, -1); return { from: lm, to: E.monthEnd(lm) };
      case 'fy': var f = E.fyOf(t, ent); return { from: f.from, to: t };
      case 'lastfy': var f0 = E.fyOf(t, ent), pf = E.fyOf(E.addDays(f0.from, -1), ent); return { from: pf.from, to: pf.to };
      default: return { from: E.monthStart(t), to: t };
    }
  };

  /* Bikram Sambat table — copied from assets/js/02-config.js (verified
     years only). Outside the table toBS() returns null and the UI shows
     the AD date alone: a wrong Nepali date is worse than none. */
  var BS_DATA = {
    2080: { start: '2023-04-14', m: [31, 31, 31, 32, 31, 31, 30, 29, 30, 29, 30, 30] },
    2081: { start: '2024-04-13', m: [31, 32, 31, 32, 31, 30, 30, 30, 29, 30, 30, 30] },
    2082: { start: '2025-04-14', m: [30, 32, 31, 32, 31, 30, 30, 30, 29, 30, 30, 30] },
    2083: { start: '2026-04-14', m: [31, 31, 32, 31, 31, 30, 30, 30, 29, 30, 30, 30] },
    2084: { start: '2027-04-14', m: [31, 31, 32, 31, 31, 30, 30, 30, 29, 30, 30, 30] }
  };
  E.BS_DATA = BS_DATA;
  E.BS_MONTHS = ['बैशाख', 'जेठ', 'असार', 'साउन', 'भदौ', 'असोज', 'कार्तिक', 'मंसिर', 'पुष', 'माघ', 'फागुन', 'चैत'];
  E.toBS = function (iso) {
    if (!E.validIso(iso)) return null;
    for (var y in BS_DATA) {
      var rec = BS_DATA[y], total = E.sum(rec.m), off = E.daysBetween(rec.start, iso);
      if (off < 0 || off >= total) continue;
      for (var i = 0; i < 12; i++) {
        if (off < rec.m[i]) return { y: +y, m: i + 1, d: off + 1, monthName: E.BS_MONTHS[i] };
        off -= rec.m[i];
      }
    }
    return null;
  };
  E.bsLabel = function (iso) {
    var b = E.toBS(iso);
    return b ? E.toDev(b.y + ' ') + b.monthName + ' ' + E.toDev(b.d) : '';
  };

  /** AD date of 1 Shrawan of BS year y (null outside the verified table). */
  function bsShrawan1(y) {
    var rec = BS_DATA[y]; if (!rec) return null;
    return E.addDays(rec.start, rec.m[0] + rec.m[1] + rec.m[2]);
  }
  function approxNpEnd(y) { var f = bsShrawan1(y); return (+f.slice(0, 4) + 1) + '-07-15'; }
  E.bsShrawan1 = bsShrawan1;

  /* ------------------------------------------------------------------
