:root{
  --brand:#2E5FA8; --brand-deep:#12264E; --brand-800:#1C3B72; --brand-50:#EEF3FB;
  --orange:#F07C1F; --orange-600:#D96A10; --gold1:#F5C869; --gold2:#E8891C;
  --bg:#F2F5FA; --surface:#FFFFFF; --surface-2:#F7F9FD; --raise:#FFFFFF;
  --ink:#16233C; --ink-2:#3F4D68; --muted:#66748E; --line:#E1E8F2; --line-2:#CBD6E6;
  --ok:#147A47; --ok-bg:#E5F5EC; --warn:#9A6200; --warn-bg:#FFF4DC; --bad:#B42323; --bad-bg:#FCE9E9; --info:#24518F; --info-bg:#E7EFFB;
  /* chart series — validated categorical palette, slots 1-8 in fixed order */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --grid:#E6ECF4;
  --shadow:0 1px 2px rgba(18,38,78,.06),0 6px 18px rgba(18,38,78,.07);
  --shadow-lift:0 2px 6px rgba(18,38,78,.08),0 18px 40px rgba(18,38,78,.14);
  --inset:inset 0 1px 0 rgba(255,255,255,.9);
  --r:18px; --r-sm:12px; --r-xs:8px;
  --f:'Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --f-num:'Inter','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --link:#24518F;
  --side:264px; --top:60px; --bottom:68px;
  --fs:16px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121B2D; --surface-2:#17223A; --raise:#1A2742;
  --ink:#E8EEF8; --ink-2:#BAC6DB; --muted:#8D9BB5; --line:#23314C; --line-2:#2F4063;
  --ok:#4CC38A; --ok-bg:#0F2A1F; --warn:#F2B347; --warn-bg:#2E2410; --bad:#F27474; --bad-bg:#331717; --info:#86B2F2; --info-bg:#14243F;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --grid:#22304A; --brand-50:#162544; --link:#86B2F2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lift:0 4px 10px rgba(0,0,0,.45),0 22px 48px rgba(0,0,0,.5);
  --inset:inset 0 1px 0 rgba(255,255,255,.04);
  color-scheme:dark;
}
:root[data-theme="amoled"]{
  --bg:#000; --surface:#070707; --surface-2:#0E0E0E; --raise:#111;
  --ink:#F2F2F2; --ink-2:#C4C4C4; --muted:#8F8F8F; --line:#1C1C1C; --line-2:#2A2A2A;
  --ok:#4CC38A; --ok-bg:#06180F; --warn:#F2B347; --warn-bg:#1C1405; --bad:#F27474; --bad-bg:#1E0707; --info:#86B2F2; --info-bg:#081428;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --grid:#1A1A1A; --brand-50:#0A1426; --link:#86B2F2;
  --shadow:0 0 0 1px #161616; --shadow-lift:0 0 0 1px #2a2a2a,0 12px 30px rgba(0,0,0,.8); --inset:none;
  color-scheme:dark;
}
:root[data-size="lg"]{--fs:17.5px}
:root[data-size="xl"]{--fs:19px}

/* ---------- 2. BASE ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs);-webkit-text-size-adjust:100%;overflow-x:hidden}
@supports (overflow:clip){html{overflow-x:clip}}
body{font-family:var(--f);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--link);text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid rgba(240,124,31,.6);outline-offset:2px;border-radius:6px}
.num,.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
small,.small{font-size:.8rem}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.bs{color:var(--muted);font-size:.75rem;white-space:nowrap}
.pos{color:var(--ok)} .neg{color:var(--bad)}
h1{font-size:1.45rem;line-height:1.3;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.12rem;font-weight:800;line-height:1.35}
h3{font-size:.98rem;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- 3. SHELL: sidebar (desktop) · top bar · bottom nav (mobile) ---------- */
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 14px;padding-top:env(safe-area-inset-top);
  background:linear-gradient(135deg,var(--brand-deep),#173468 60%,var(--brand-800));color:#fff;box-shadow:0 2px 12px rgba(10,22,40,.25)}
:root[data-theme="amoled"] .top{background:#000;border-bottom:1px solid #1c1c1c}
.top .logo{width:40px;height:40px;border-radius:11px;background:#fff;padding:3px;object-fit:contain;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.top .ttl{min-width:0;flex:1;line-height:1.15}
.top .ttl b{display:block;font-size:.98rem;font-weight:800;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;color:#CFE0F8;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tbtn{min-width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#fff;background:rgba(255,255,255,.1);padding:0 10px;font-size:.85rem;font-weight:600}
.top .tbtn:hover{background:rgba(255,255,255,.18)}
.top select.tbtn{appearance:none;-webkit-appearance:none;max-width:120px}
.top select.tbtn option{color:#000}
.mode{font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.04em}
.mode.demo{background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#2B1600}
.mode.real{background:#1F9D61;color:#fff}
.side{display:none}
.wrap{padding:16px 16px calc(var(--bottom) + 28px + env(safe-area-inset-bottom));max-width:1320px;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--bottom) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(18,38,78,.08)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.68rem;font-weight:600;min-width:0}
.bnav a i{font-style:normal;font-size:1.3rem;line-height:1}
.bnav a.on{color:var(--brand)}
:root[data-theme="dark"] .bnav a.on,:root[data-theme="amoled"] .bnav a.on{color:var(--gold1)}
.bnav a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.fab{position:fixed;right:16px;bottom:calc(var(--bottom) + 16px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:50%;
  background:linear-gradient(180deg,#F79A3E,var(--orange-600));color:#fff;font-size:1.9rem;font-weight:300;box-shadow:0 8px 22px rgba(217,106,16,.45);display:flex;align-items:center;justify-content:center}
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(6,12,24,.5)}
.drawer .panel{position:absolute;top:0;bottom:0;left:0;width:min(86vw,320px);background:var(--surface);overflow:auto;padding:14px 10px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lift)}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink-2);font-weight:600;font-size:.93rem}
.nav a i{font-style:normal;width:26px;text-align:center;font-size:1.1rem}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--brand-50);color:var(--brand)}
:root[data-theme="dark"] .nav a.on,:root[data-theme="amoled"] .nav a.on{color:var(--gold1)}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.nav .badge{margin-left:auto}
@media (min-width:1024px){
  .side{display:block;position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);overflow:auto;padding:14px 10px 24px;background:var(--surface);border-right:1px solid var(--line)}
  .wrap{margin-left:var(--side);padding:22px 28px 40px;max-width:none}
  .wrap>*{max-width:1280px}
  .bnav,.fab,.menu-btn{display:none!important}
  h1{font-size:1.7rem}
}
/* phones: compact top bar (theme lives in the user menu) */
@media (max-width:479px){
  .top{gap:6px;padding:0 10px}
  .top .tbtn{min-width:36px;height:36px;padding:0 8px}
  .top .tbtn.theme{display:none}
  .top .logo{width:36px;height:36px}
  .mode{font-size:.62rem;padding:2px 6px}
}
.demo-ribbon{background:repeating-linear-gradient(135deg,var(--warn-bg) 0 14px,transparent 14px 28px),var(--surface);border:1px dashed var(--warn);color:var(--warn);
  border-radius:var(--r-sm);padding:9px 12px;margin-bottom:14px;font-size:.85rem;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- 4. COMPONENTS ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow),var(--inset);padding:16px;margin-bottom:16px;min-width:0}
.card.flat{box-shadow:none}
.card>h2,.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{margin:0;flex:1;min-width:0}
.sub{color:var(--muted);font-size:.86rem;margin-top:-6px;margin-bottom:12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.stack>*+*{margin-top:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;font-size:.92rem;
  background:var(--brand);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 4px 12px rgba(46,95,168,.28);transition:transform .12s,box-shadow .12s,background .12s;white-space:nowrap}
.btn:hover{background:var(--brand-800)}
.btn:active{transform:translateY(1px)}
.btn.or{background:linear-gradient(180deg,#F59340,var(--orange-600));box-shadow:0 4px 14px rgba(217,106,16,.32)}
.btn.ok{background:var(--ok);box-shadow:none}
.btn.bad{background:var(--bad);box-shadow:none}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2);box-shadow:none}
.btn.ghost:hover{background:var(--brand-50)}
.btn.sm{min-height:34px;padding:0 11px;font-size:.82rem;border-radius:10px}
.btn.xs{min-height:28px;padding:0 9px;font-size:.76rem;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.q{width:22px;height:22px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;
  background:var(--brand-50);color:var(--brand);border:1px solid var(--line-2);vertical-align:middle}
:root[data-theme="dark"] .q,:root[data-theme="amoled"] .q{color:var(--gold1)}
.q:hover{background:var(--brand);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.badge.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:.84rem;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:46px;border-radius:11px;font-weight:800;color:var(--ink-2);font-size:.95rem}
.seg button.on.in{background:var(--ok);color:#fff;box-shadow:0 4px 12px rgba(20,122,71,.3)}
.seg button.on.out{background:var(--bad);color:#fff;box-shadow:0 4px 12px rgba(180,35,35,.3)}
.seg button.on.tr{background:var(--brand);color:#fff}

/* forms */
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:.82rem;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.f input,.f select,.f textarea,.inp{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:1rem}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(46,95,168,.18)}
.f .hint{font-size:.76rem;color:var(--muted)}
.f.big input{font-size:1.6rem;font-weight:800;min-height:60px;font-family:var(--f-num)}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;padding:6px 0}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--brand)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:var(--r-sm);padding:10px 12px;font-size:.88rem;font-weight:600}
.note{background:var(--info-bg);color:var(--info);border-radius:var(--r-sm);padding:10px 12px;font-size:.86rem}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-sm);padding:10px 12px;font-size:.86rem;font-weight:600}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:var(--r-sm);padding:10px 12px;font-size:.86rem;font-weight:600}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.catgrid label{position:relative}
.catgrid input{position:absolute;opacity:0;pointer-events:none}
.catgrid span{display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 10px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:.83rem;font-weight:600;line-height:1.25;cursor:pointer}
.catgrid span i{font-style:normal;font-size:1.2rem}
.catgrid input:checked+span{border-color:var(--brand);background:var(--brand-50);box-shadow:0 0 0 2px var(--brand) inset}
.catgrid input:focus-visible+span{outline:3px solid rgba(240,124,31,.6)}

/* KPI cards — raised 2.5D */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,232px),1fr))}
.kpi{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px 14px 12px;border-radius:var(--r);background:linear-gradient(180deg,var(--raise),var(--surface));
  border:1px solid var(--line);box-shadow:var(--shadow),var(--inset);cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-2)}
.kpi.st-ok::before{background:var(--ok)} .kpi.st-warn::before{background:var(--warn)} .kpi.st-bad::before{background:var(--bad)} .kpi.st-info::before{background:var(--brand)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.kpi .kh{display:flex;align-items:flex-start;gap:6px}
.kpi .kt{flex:1;font-size:.84rem;font-weight:700;color:var(--ink-2);line-height:1.3}
.kpi .kv{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.48rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;word-break:break-word}
.kpi .ks{font-size:.72rem;color:var(--muted);line-height:1.35}
.kpi .kf{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.trend{font-size:.72rem;font-weight:700;font-family:var(--f-num)}
/* phones: two money cards per row, details clamped (full detail on tap → ledger) */
@media (max-width:599px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:11px 10px 10px 12px;border-radius:14px;gap:3px}
  .kpi .kt{font-size:.74rem}
  .kpi .kv{font-size:1.08rem}
  .kpi .ks{font-size:.64rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .kpi .ks.when,.trend .muted{display:none}
  .kpi .q{width:20px;height:20px;font-size:.66rem}
  .kpi .badge{font-size:.6rem;padding:1px 6px}
  .hero{padding:16px 14px}
  .hero h1{font-size:1.25rem}
}
.morecats>summary{cursor:pointer;font-weight:700;font-size:.85rem;color:var(--link);padding:8px 2px;list-style:none}
.morecats>summary::-webkit-details-marker{display:none}
.hero{border-radius:22px;padding:20px 18px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,rgba(240,124,31,.35),transparent 55%),linear-gradient(135deg,var(--brand-deep),#1B3C78);box-shadow:var(--shadow-lift)}
:root[data-theme="amoled"] .hero{background:radial-gradient(120% 140% at 100% 0%,rgba(240,124,31,.22),transparent 55%),#050A14;border:1px solid #1c2638}
.hero h1{color:#fff}
.hero p{color:#D7E4F7;margin-top:6px;font-size:.95rem;max-width:62ch}
.hero .hd{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.hero .hd span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600}
.hero .ask{margin-top:14px;display:flex;gap:8px}
.hero .ask input{flex:1;min-width:0;min-height:48px;border-radius:14px;border:0;padding:0 14px;font-size:.95rem;background:rgba(255,255,255,.95);color:#16233C}
.hero .ask .btn{background:var(--orange);box-shadow:none}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media (min-width:720px){.qa{grid-template-columns:repeat(9,1fr)}}
.qa a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:84px;padding:10px 6px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink);font-size:.78rem;font-weight:700;line-height:1.25}
.qa a i{font-style:normal;font-size:1.55rem}
.qa a.in{background:linear-gradient(180deg,var(--ok-bg),var(--surface));border-color:transparent;color:var(--ok)}
.qa a.out{background:linear-gradient(180deg,var(--bad-bg),var(--surface));border-color:transparent;color:var(--bad)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:.76rem;font-weight:800;color:var(--ink-2);white-space:nowrap;position:sticky;top:0}
td.r,th.r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:800;background:var(--surface-2);border-top:2px solid var(--line-2)}
tr.click{cursor:pointer}
tr.sec td{background:var(--brand-50);font-weight:800;color:var(--ink)}
tr.rev td{color:var(--muted);text-decoration:line-through}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:.9rem}
.empty i{display:block;font-style:normal;font-size:2rem;margin-bottom:6px}
.list>div{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.list .li-t{flex:1;min-width:0}
.list .li-t b{display:block;font-size:.9rem;overflow:hidden;text-overflow:ellipsis}
.list .li-t small{color:var(--muted)}
.ins{display:flex;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:.87rem;align-items:flex-start}
.ins.warn{background:var(--warn-bg);color:var(--warn)} .ins.bad{background:var(--bad-bg);color:var(--bad)} .ins.info{background:var(--info-bg);color:var(--info)}
.ins b{font-weight:700} .ins small{display:block;opacity:.85}
.jprev{border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:12px;background:var(--surface-2)}
.jprev .jl{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;padding:3px 0}
.jprev .jl .num{white-space:nowrap}
.statbar{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat span{display:flex;gap:6px;align-items:center;font-size:.76rem;color:var(--muted);font-weight:700}
.stat b{display:block;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.12rem;font-weight:800;margin-top:2px;word-break:break-word}
details.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:12px;box-shadow:var(--shadow)}
details.acc>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:800;display:flex;gap:10px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.acc[open]>summary::after{content:"▴"}
details.acc>.acc-b{padding:0 16px 16px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.steps span{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted)}
.steps span.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.steps span.skip{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.steps span.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--orange));border-radius:99px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-num);fill:var(--muted);font-size:11px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--brand-deep);color:#fff;font-size:.78rem;padding:6px 9px;border-radius:8px;box-shadow:var(--shadow-lift);max-width:240px;display:none;font-family:var(--f-num)}
:root[data-theme="amoled"] .tip{background:#1b1b1b;border:1px solid #333}

/* modal = bottom sheet on phones, dialog on desktop */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,12,24,.55)}
.modal .box{background:var(--surface);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lift)}
.modal .box .mh{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.modal .box .mh h2{flex:1}
.modal .x{width:38px;height:38px;border-radius:10px;background:var(--surface-2);font-size:1.2rem;flex:none}
@media (min-width:720px){.modal{align-items:center}.modal .box{max-width:640px;border-radius:22px;padding:22px}}
.modal .box.wide{max-width:960px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bottom) + 88px + env(safe-area-inset-bottom));z-index:95;background:var(--brand-deep);color:#fff;padding:11px 16px;border-radius:14px;font-size:.9rem;font-weight:600;box-shadow:var(--shadow-lift);max-width:min(92vw,520px)}
.toast.ok{background:#11673D} .toast.bad{background:#9B1C1C} .toast.warn{background:#7A4D00}
@media (min-width:1024px){.toast{bottom:28px}}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(90% 60% at 100% 0%,rgba(240,124,31,.28),transparent 60%),radial-gradient(80% 60% at 0% 100%,rgba(46,95,168,.35),transparent 60%),linear-gradient(160deg,#0B1A35,var(--brand-deep))}
.login .lbox{width:100%;max-width:440px;background:var(--surface);border-radius:26px;padding:24px 20px;box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center}
.login .llogo{width:150px;margin:0 auto 10px;background:#fff;border-radius:18px;padding:8px}
.login h1{font-size:1.28rem}
.login p{color:var(--muted);font-size:.9rem;margin-top:4px}
.users{display:grid;gap:10px;margin-top:16px;text-align:left}
.users button{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface-2);text-align:left;min-height:62px}
.users button:hover{border-color:var(--brand)}
.users .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,var(--gold1),var(--gold2));color:#2B1600;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.pin{display:flex;justify-content:center;gap:12px;margin:18px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand);display:block}
.pin i.f{background:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{min-height:60px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);font-size:1.4rem;font-weight:700;font-family:var(--f-num)}
.pad button:active{background:var(--brand-50)}
.denied{text-align:center;padding:40px 16px}
.denied i{font-size:3rem;font-style:normal;display:block}
.denied>h2{justify-content:center}

/* glossary / learning */
.terms{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.terms button{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-weight:700;min-height:56px}
.terms button small{display:block;color:var(--muted);font-weight:500;margin-top:2px}
.gl-sec{margin-top:12px}
.gl-sec h3{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.formula{font-family:var(--f-num);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;font-size:.9rem;white-space:pre-wrap}

/* print */
#print{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff!important;color:#000}
  body>*:not(#print){display:none!important}
  #print{display:block!important;font-size:11pt}
  #print .ph{display:flex;gap:12px;align-items:center;border-bottom:2px solid #12264E;padding-bottom:8px;margin-bottom:12px}
  #print .ph img{width:70px}
  #print table{font-size:9.5pt} #print th{background:#EEF3FB!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .wm{color:#B7791F;font-weight:800}
}
</style>

<script id="shg-engine">
/* =====================================================================
   SHG FINANCE ENGINE — pure logic, no DOM.
   ---------------------------------------------------------------------
   Everything that does arithmetic lives here so it can be tested with
   Node (tests/finance-master-test.js extracts this <script> and runs it).

   GROUND RULES (read these before you change anything):
   1. Money is ALWAYS an integer number of paise/paisa ("minor units").
      ₹1,250.50 is stored as 125050. Never store 1250.5 — floats drift.
   2. Every money movement is a JOURNAL with lines. Sum(debits) must
      equal Sum(credits) or postJournal() refuses it.
   3. A posted journal is never edited or deleted. Mistakes are undone
      with reverseJournal(), which posts the exact mirror entry.
   4. Business rules (₹200/₹400 commission, approval limits, FX rate …)
      live in state.settings and are effective-dated, so changing a rate
      today never rewrites yesterday's numbers.
   ===================================================================== */
(function (root) {
  'use strict';
  var E = {};
  E.VERSION = '1.0.0';

  /* ------------------------------------------------------------------
     1. MONEY
     ------------------------------------------------------------------ */
  var DEV = '०१२३४५६७८९';
  function toAscii(s) {
    return String(s == null ? '' : s).replace(/[०-९]/g, function (d) { return String(DEV.indexOf(d)); });
  }
  E.toAscii = toAscii;
  E.toDev = function (s) { return String(s).replace(/[0-9]/g, function (d) { return DEV[+d]; }); };

  /** "1,23,456.78" | "१२००" | 1500 -> integer minor units, or NaN. */
  function parseMoney(v) {
    if (typeof v === 'number') return isFinite(v) ? Math.round(v * 100) : NaN;
    var s = toAscii(v).replace(/₹|रु\.?|Rs\.?|INR|NPR|,|\s/gi, '');
    if (s === '' || !/^-?\d*(\.\d*)?$/.test(s) || s === '-' || s === '.') return NaN;
    var neg = s.charAt(0) === '-';
    if (neg) s = s.slice(1);
    var p = s.split('.'), ip = p[0] || '0', fp = p[1] || '';
    var minor = parseInt(ip, 10) * 100 + parseInt((fp + '00').slice(0, 2), 10);
    if (fp.length > 2 && +fp.charAt(2) >= 5) minor += 1;   // round half up at the 3rd decimal
    return neg ? -minor : minor;
  }
  E.parseMoney = parseMoney;

  /** 1234567 -> "12,34,567" (Indian grouping). */
  function groupIndian(intStr) {
    if (intStr.length <= 3) return intStr;
    var last3 = intStr.slice(-3), rest = intStr.slice(0, -3);
    return rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
  }
  E.groupIndian = groupIndian;

  /** minor units -> "₹1,23,456.50" / "रु 1,200". */
  function fmt(minor, cur, opt) {
    if (minor == null || isNaN(minor)) return '—';
    opt = opt || {};
    var neg = minor < 0, a = Math.abs(Math.round(minor));
    var ip = Math.floor(a / 100), fp = a % 100;
    var s = groupIndian(String(ip)) + (fp || opt.paise ? '.' + (fp < 10 ? '0' : '') + fp : '');
    var sym = opt.noSym ? '' : (cur === 'NPR' ? 'रु ' : '₹');
    return (neg ? '−' : '') + sym + s;
  }
  E.fmt = fmt;
  /** minor -> plain number string for CSV/XLSX (no symbol, no grouping). */
  E.plain = function (minor) { return (Math.round(minor) / 100).toFixed(2); };
  /** percentage of a minor amount, rounded half-up to the nearest paisa. */
  E.pctOf = function (minor, pct) { return Math.round(minor * pct / 100); };
  E.sum = function (arr, f) { var t = 0; for (var i = 0; i < arr.length; i++) t += f ? f(arr[i]) : arr[i]; return t; };

  /* ------------------------------------------------------------------
     2. DATES (ISO "YYYY-MM-DD" strings everywhere) + Nepali BS
     ------------------------------------------------------------------ */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseIso(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  E.isoOf = isoOf;
  E.today = function () { return isoOf(new Date()); };
  E.validIso = function (s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) return false;
    var d = parseIso(s); return isoOf(d) === s;
  };
  E.addDays = function (iso, n) { var d = parseIso(iso); d.setDate(d.getDate() + n); return isoOf(d); };
  E.daysBetween = function (a, b) {
    var pa = String(a).split('-'), pb = String(b).split('-');
    return Math.round((Date.UTC(+pb[0], +pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], +pa[1] - 1, +pa[2])) / 86400000);
  };
  E.monthStart = function (iso) { return iso.slice(0, 8) + '01'; };
  E.monthEnd = function (iso) { var d = parseIso(iso.slice(0, 8) + '01'); d.setMonth(d.getMonth() + 1); d.setDate(0); return isoOf(d); };
  E.addMonths = function (iso, n) { var d = parseIso(iso.slice(0, 8) + '01'); d.setMonth(d.getMonth() + n); return isoOf(d); };
  /** Indian financial year (1 April – 31 March) containing iso. */
  E.fyOf = function (iso) {
    var y = +iso.slice(0, 4), m = +iso.slice(5, 7), s = m >= 4 ? y : y - 1;
    return { from: s + '-04-01', to: (s + 1) + '-03-31', label: 'FY ' + s + '-' + String(s + 1).slice(2) };
  };
  /** Preset ranges used by the dashboard filter. */
  E.rangeFor = function (preset, today) {
    var t = today || E.today();
    switch (preset) {
      case 'today': return { from: t, to: t };
      case 'yesterday': var y = E.addDays(t, -1); return { from: y, to: y };
      case 'week': var dow = parseIso(t).getDay(); return { from: E.addDays(t, -dow), to: t };
      case 'month': return { from: E.monthStart(t), to: t };
      case 'lastmonth': var lm = E.addMonths(t, -1); return { from: lm, to: E.monthEnd(lm) };
      case 'fy': var f = E.fyOf(t); return { from: f.from, to: t };
      default: return { from: E.monthStart(t), to: t };
    }
  };

  /* Bikram Sambat table — copied from assets/js/02-config.js (verified
     years only). Outside the table toBS() returns null and the UI shows
     the AD date alone: a wrong Nepali date is worse than none. */
  var BS_DATA = {
    2080: { start: '2023-04-14', m: [31, 31, 31, 32, 31, 31, 30, 29, 30, 29, 30, 30] },
    2081: { start: '2024-04-13', m: [31, 32, 31, 32, 31, 30, 30, 30, 29, 30, 30, 30] },
    2082: { start: '2025-04-14', m: [30, 32, 31, 32, 31, 30, 30, 30, 29, 30, 30, 30] },
    2083: { start: '2026-04-14', m: [31, 31, 32, 31, 31, 30, 30, 30, 29, 30, 30, 30] },
    2084: { start: '2027-04-14', m: [31, 31, 32, 31, 31, 30, 30, 30, 29, 30, 30, 30] }
  };
  E.BS_DATA = BS_DATA;
  E.BS_MONTHS = ['बैशाख', 'जेठ', 'असार', 'साउन', 'भदौ', 'असोज', 'कार्तिक', 'मंसिर', 'पुष', 'माघ', 'फागुन', 'चैत'];
  E.toBS = function (iso) {
    if (!E.validIso(iso)) return null;
    for (var y in BS_DATA) {
      var rec = BS_DATA[y], total = E.sum(rec.m), off = E.daysBetween(rec.start, iso);
      if (off < 0 || off >= total) continue;
      for (var i = 0; i < 12; i++) {
        if (off < rec.m[i]) return { y: +y, m: i + 1, d: off + 1, monthName: E.BS_MONTHS[i] };
        off -= rec.m[i];
      }
    }
    return null;
  };
  E.bsLabel = function (iso) {
    var b = E.toBS(iso);
    return b ? E.toDev(b.y + ' ') + b.monthName + ' ' + E.toDev(b.d) : '';
  };

  /* ------------------------------------------------------------------
     3. SHA-256 (sync, tiny) — used for PIN hashing and backup checksums.
     ------------------------------------------------------------------ */
  E.sha256 = function (msg) {
    var bytes = unescape(encodeURIComponent(String(msg)));
    var K = [], H = [], i, j, isP = function (n) { for (var f = 2; f * f <= n; f++) if (n % f === 0) return false; return true; };
    var frac = function (x) { return ((x - Math.floor(x)) * 4294967296) | 0; };
    for (i = 2, j = 0; j < 64; i++) if (isP(i)) { if (j < 8) H[j] = frac(Math.pow(i, 1 / 2)); K[j++] = frac(Math.pow(i, 1 / 3)); }
    var l = bytes.length, words = [];
    for (i = 0; i < l; i++) words[i >> 2] |= bytes.charCodeAt(i) << (24 - (i % 4) * 8);
    words[l >> 2] |= 0x80 << (24 - (l % 4) * 8);
    words[((l + 8) >> 6 << 4) + 15] = l * 8;
    var w = [], rr = function (x, n) { return (x >>> n) | (x << (32 - n)); };
    for (i = 0; i < words.length; i += 16) {
      var a = H.slice(0);
      for (j = 0; j < 64; j++) {
        if (j < 16) w[j] = words[i + j] | 0;
        else {
          var s0 = rr(w[j - 15], 7) ^ rr(w[j - 15], 18) ^ (w[j - 15] >>> 3);
          var s1 = rr(w[j - 2], 17) ^ rr(w[j - 2], 19) ^ (w[j - 2] >>> 10);
          w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
        }
        var S1 = rr(a[4], 6) ^ rr(a[4], 11) ^ rr(a[4], 25), ch = (a[4] & a[5]) ^ (~a[4] & a[6]);
        var t1 = (a[7] + S1 + ch + K[j] + w[j]) | 0;
        var S0 = rr(a[0], 2) ^ rr(a[0], 13) ^ rr(a[0], 22), mj = (a[0] & a[1]) ^ (a[0] & a[2]) ^ (a[1] & a[2]);
        var t2 = (S0 + mj) | 0;
        a = [(t1 + t2) | 0].concat(a.slice(0, 3), [(a[3] + t1) | 0], a.slice(4, 7));
      }
      for (j = 0; j < 8; j++) H[j] = (H[j] + a[j]) | 0;
    }
    var out = '';
    for (i = 0; i < 8; i++) out += ('00000000' + (H[i] >>> 0).toString(16)).slice(-8);
    return out;
  };

  /* ------------------------------------------------------------------
     4. CHART OF ACCOUNTS
     type: asset | liability | equity | revenue | expense
     kind: finer grouping the reports use
     cf:   cash-flow class — op (operating) | inv (investing) | fin (financing)
     party: which list a line on this account must name (agent, employee,
            vendor, lender, shareholder, person, entity) — '' = none
     ------------------------------------------------------------------ */
  var COA = [
    ['1010', 'हातमा रहेको नगद', 'Cash in hand', 'asset', 'cash', 'op', ''],
    ['1020', 'कार्यालय पेटी क्यास', 'Office petty cash', 'asset', 'cash', 'op', ''],
    ['1030', 'काउन्टर नगद', 'Counter cash', 'asset', 'cash', 'op', ''],
    ['1110', 'बैंक — मुख्य खाता', 'Bank — main account', 'asset', 'bank', 'op', ''],
    ['1120', 'बैंक — दोस्रो खाता', 'Bank — second account', 'asset', 'bank', 'op', ''],
    ['1150', 'UPI / QR क्लियरिङ', 'UPI / QR clearing', 'asset', 'clearing', 'op', ''],
    ['1160', 'बाटोमा रहेको रकम', 'Money in transit', 'asset', 'clearing', 'op', ''],
    ['1210', 'एजेन्टबाट उठाउन बाँकी', 'Agent receivable (cash held by agents)', 'asset', 'recv', 'op', 'agent'],
    ['1220', 'ग्राहकबाट उठाउन बाँकी', 'Customer receivable', 'asset', 'recv', 'op', 'person'],
    ['1230', 'कर्मचारी/चालक अग्रिम (पेश्की)', 'Staff & driver advances', 'asset', 'adv', 'op', 'employee'],
    ['1250', 'अग्रिम भुक्तानी गरिएको खर्च', 'Prepaid expenses', 'asset', 'adv', 'op', ''],
    ['1270', 'TDS कट्टी भएको (फिर्ता पाउने)', 'TDS receivable', 'asset', 'recv', 'op', ''],
    ['1500', 'स्थिर सम्पत्ति — बस/सवारी', 'Fixed assets — buses & vehicles', 'asset', 'fixed', 'inv', ''],
    ['1510', 'स्थिर सम्पत्ति — उपकरण/फर्निचर', 'Fixed assets — equipment & furniture', 'asset', 'fixed', 'inv', ''],
    ['1590', 'सञ्चित ह्रास (घटाउ)', 'Accumulated depreciation', 'asset', 'contra', 'inv', ''],
    ['1900', 'अन्तर-कम्पनी लिनुपर्ने', 'Intercompany receivable', 'asset', 'ic', 'fin', 'entity'],
    ['2010', 'विक्रेतालाई तिर्न बाँकी', 'Vendors payable', 'liability', 'pay', 'op', 'vendor'],
    ['2020', 'एजेन्ट कमिसन तिर्न बाँकी', 'Agent commission payable', 'liability', 'pay', 'op', 'agent'],
    ['2030', 'तलब तिर्न बाँकी', 'Salaries payable', 'liability', 'pay', 'op', 'employee'],
    ['2040', 'यात्रुलाई फिर्ता/अग्रिम तिर्न बाँकी', 'Passenger refunds & advances payable', 'liability', 'pay', 'op', 'person'],
    ['2050', 'TDS तिर्न बाँकी (सरकारलाई)', 'TDS payable', 'liability', 'tax', 'op', ''],
    ['2055', 'अन्य कट्टी तिर्न बाँकी (PF/ESI)', 'Other statutory deductions payable', 'liability', 'tax', 'op', ''],
    ['2060', 'GST तिर्न बाँकी', 'GST payable', 'liability', 'tax', 'op', ''],
    ['2070', 'ब्याज तिर्न बाँकी', 'Interest payable', 'liability', 'pay', 'fin', 'lender'],
    ['2080', 'लाभांश तिर्न बाँकी', 'Dividend payable', 'liability', 'pay', 'fin', 'shareholder'],

      memo: j.memo || '', ref: j.ref || '', method: j.method || '', cat: j.cat || '', source: j.source || null,
      idem: j.idem || '', attach: j.attach || '', lines: j.lines.map(function (l) {
        var o = { acc: l.acc, dr: l.dr || 0, cr: l.cr || 0 };
        if (l.party) o.party = l.party; if (l.trip) o.trip = l.trip; if (l.sub) o.sub = l.sub; if (l.memo) o.memo = l.memo;
        return o;
      }),
      createdAt: new Date().toISOString(), createdBy: user ? user.name : 'system', approvedBy: j.approvedBy || (user ? user.name : 'system'),
      reversedBy: null, reversalOf: j.reversalOf || null, practice: !!j.practice
    };
    st.journals.push(posted);
    E.audit(st, user, 'journal.post', posted.no + ' ' + fmt(E.journalTotal(posted)) + ' ' + posted.memo);
    return { ok: true, journal: posted, errors: [] };
  };

  /** Undo a posted journal by posting its mirror. Never deletes anything. */
  E.reverseJournal = function (st, id, opt, user) {
    opt = opt || {};
    var j = E.find(st.journals, id);
    if (!j) return { ok: false, errors: ['जर्नल भेटिएन।'] };
    if (j.reversedBy) return { ok: false, errors: ['यो जर्नल पहिले नै उल्टाइसकिएको छ।'] };
    if (j.reversalOf) return { ok: false, errors: ['उल्टाउने जर्नललाई फेरि उल्टाउन मिल्दैन — नयाँ सही इन्ट्री गर्नुहोस्।'] };
    var date = opt.date || j.date;
    if (E.isLocked(st, date)) date = E.addDays(st.settings.lockDate, 1);
    var r = E.postJournal(st, {
      entity: j.entity, date: date, memo: 'उल्टाइयो: ' + j.no + (opt.reason ? ' — ' + opt.reason : ''), ref: j.ref,
      source: j.source, reversalOf: j.id, lines: j.lines.map(function (l) {
        var o = clone(l); o.dr = l.cr; o.cr = l.dr; return o;
      })
    }, user);
    if (r.ok) { j.reversedBy = r.journal.id; E.audit(st, user, 'journal.reverse', j.no + ' -> ' + r.journal.no + ' ' + (opt.reason || '')); }
    return r;
  };

  /** Flat list of lines matching a filter, each carrying its journal. */
  E.lines = function (st, f) {
    f = f || {};
    var out = [];
    st.journals.forEach(function (j) {
      if (f.entity && j.entity !== f.entity) return;
      if (f.from && j.date < f.from) return;
      if (f.to && j.date > f.to) return;
      j.lines.forEach(function (l) {
        if (f.acc && (Array.isArray(f.acc) ? f.acc.indexOf(l.acc) < 0 : l.acc !== f.acc)) return;
        if (f.party && l.party !== f.party) return;
        if (f.trip && l.trip !== f.trip) return;
        if (f.sub && l.sub !== f.sub) return;
        out.push({ j: j, l: l });
      });
    });
    out.sort(function (a, b) { return a.j.date < b.j.date ? -1 : a.j.date > b.j.date ? 1 : (a.j.createdAt < b.j.createdAt ? -1 : 1); });
    return out;
  };

  function natural(st, code, dr, cr) {
    var a = E.account(st, code);
    return a && (a.type === 'asset' || a.type === 'expense') ? dr - cr : cr - dr;
  }
  E.natural = natural;

  /** Balance of one account (natural sign: + means normal). */
  E.balance = function (st, entity, code, f) {
    f = f || {};
    var dr = 0, cr = 0;
    E.lines(st, { entity: entity, acc: code, from: f.from, to: f.to, party: f.party, trip: f.trip, sub: f.sub }).forEach(function (x) { dr += x.l.dr; cr += x.l.cr; });
    return natural(st, code, dr, cr);
  };
  E.sumBalances = function (st, entity, codes, f) { return E.sum(codes, function (c) { return E.balance(st, entity, c, f); }); };
  E.codesWhere = function (st, pred) { return st.accounts.filter(pred).map(function (a) { return a.code; }); };

  /** Per-account debit/credit totals in one pass. */
  E.totals = function (st, entity, f) {
    f = f || {};
    var map = {};
    st.journals.forEach(function (j) {
      if (j.entity !== entity) return;
      if (f.from && j.date < f.from) return;
      if (f.to && j.date > f.to) return;
      j.lines.forEach(function (l) {
        var m = map[l.acc] || (map[l.acc] = { dr: 0, cr: 0 });
        m.dr += l.dr; m.cr += l.cr;
      });
    });
    return map;
  };

  E.trialBalance = function (st, entity, asOf) {
    var t = E.totals(st, entity, { to: asOf }), rows = [], tdr = 0, tcr = 0;
    st.accounts.forEach(function (a) {
      var m = t[a.code]; if (!m) return;
      var net = m.dr - m.cr; if (net === 0) return;
      var r = { code: a.code, name: a.name, type: a.type, dr: net > 0 ? net : 0, cr: net < 0 ? -net : 0 };
      tdr += r.dr; tcr += r.cr; rows.push(r);
    });
    return { rows: rows, dr: tdr, cr: tcr, balanced: tdr === tcr };
  };

  /** Profit & Loss for a period. */
  E.profitLoss = function (st, entity, from, to) {
    var t = E.totals(st, entity, { from: from, to: to });
    var sec = { rev: [], direct: [], opex: [], other_inc: [], other_exp: [] };
    st.accounts.forEach(function (a) {
      var m = t[a.code]; if (!m) return;
      var v = natural(st, a.code, m.dr, m.cr); if (v === 0) return;
      var row = { code: a.code, name: a.name, amount: v };
      if (a.type === 'revenue') (a.kind === 'other' ? sec.other_inc : sec.rev).push(row);
      else if (a.type === 'expense') (a.kind === 'direct' ? sec.direct : a.kind === 'opex' ? sec.opex : sec.other_exp).push(row);
    });
    var s = function (k) { return E.sum(sec[k], function (r) { return r.amount; }); };
    var revenue = s('rev'), direct = s('direct'), opex = s('opex'), oi = s('other_inc'), oe = s('other_exp');
    var gross = revenue - direct, operating = gross - opex, net = operating + oi - oe;
    return { sections: sec, revenue: revenue, direct: direct, gross: gross, opex: opex, operating: operating,
      otherIncome: oi, otherExpense: oe, net: net, totalIncome: revenue + oi, totalExpense: direct + opex + oe };
  };

  /** Balance sheet as of a date. Current earnings = all P&L to date. */
  E.balanceSheet = function (st, entity, asOf) {
    var t = E.totals(st, entity, { to: asOf });
    var out = { assets: [], liabilities: [], equity: [] }, ta = 0, tl = 0, te = 0, pl = 0;
    st.accounts.forEach(function (a) {
      var m = t[a.code]; if (!m) return;
      var v = natural(st, a.code, m.dr, m.cr); if (v === 0) return;
      var row = { code: a.code, name: a.name, amount: v, kind: a.kind };
      if (a.type === 'asset') { out.assets.push(row); ta += v; }
      else if (a.type === 'liability') { out.liabilities.push(row); tl += v; }
      else if (a.type === 'equity') { out.equity.push(row); te += v; }
      else if (a.type === 'revenue') pl += v;
      else if (a.type === 'expense') pl -= v;
    });
    out.equity.push({ code: '—', name: 'यस अवधिसम्मको नाफा/(घाटा) (बन्द नगरिएको)', amount: pl, kind: 'current' });
    te += pl;
    out.totalAssets = ta; out.totalLiabilities = tl; out.totalEquity = te; out.currentEarnings = pl;
    out.balanced = ta === tl + te;
    return out;
  };

  /** Direct-method cash flow. Each non-cash line's (cr-dr) goes to its account's class. */
  E.cashFlow = function (st, entity, from, to) {
    var cls = { op: 0, inv: 0, fin: 0 }, detail = {};
    var isCash = function (code) { var a = E.account(st, code); return a && E.CASH_KINDS[a.kind]; };
    var cashCodes = E.codesWhere(st, function (a) { return E.CASH_KINDS[a.kind]; });
    st.journals.forEach(function (j) {
      if (j.entity !== entity || j.date < from || j.date > to) return;
      var touches = j.lines.some(function (l) { return isCash(l.acc); });
      if (!touches) return;
      j.lines.forEach(function (l) {
        if (isCash(l.acc)) return;
        var a = E.account(st, l.acc), v = l.cr - l.dr;
        cls[a.cf] += v;
        var k = a.cf + ':' + a.code;
        detail[k] = (detail[k] || 0) + v;
      });
    });
    var opening = E.sumBalances(st, entity, cashCodes, { to: E.addDays(from, -1) });
    var closing = E.sumBalances(st, entity, cashCodes, { to: to });
    var rows = Object.keys(detail).map(function (k) {
      var p = k.split(':'), a = E.account(st, p[1]);
      return { cf: p[0], code: a.code, name: a.name, amount: detail[k] };
    }).filter(function (r) { return r.amount !== 0; });
    return { op: cls.op, inv: cls.inv, fin: cls.fin, net: cls.op + cls.inv + cls.fin, opening: opening, closing: closing,
      ties: opening + cls.op + cls.inv + cls.fin === closing, rows: rows };
  };

  E.cashPosition = function (st, entity, asOf) {
    var rows = E.cashAccounts(st, entity).map(function (a) { return { code: a.code, name: a.name, kind: a.kind, amount: E.balance(st, entity, a.code, { to: asOf }) }; });
    var bank = E.sum(rows.filter(function (r) { return r.kind === 'bank'; }), function (r) { return r.amount; });
    var cash = E.sum(rows.filter(function (r) { return r.kind === 'cash'; }), function (r) { return r.amount; });
    var clearing = E.sumBalances(st, entity, E.codesWhere(st, function (a) { return a.kind === 'clearing'; }), { to: asOf });
    return { rows: rows, bank: bank, cash: cash, total: bank + cash, clearing: clearing };
  };

  /** Balances per party on an account. */
  E.partyBalances = function (st, entity, code, asOf) {
    var map = {};
    E.lines(st, { entity: entity, acc: code, to: asOf }).forEach(function (x) {
      var k = x.l.party || '';
      map[k] = (map[k] || 0) + natural(st, code, x.l.dr, x.l.cr);
    });
    return map;
  };

  /* ------------------------------------------------------------------
     8. APPROVALS (maker–checker)
     ------------------------------------------------------------------ */
  E.requiredLevel = function (st, dir, amount, special) {
    if (special) return 3;
    if (dir === 'in') return 1;
    var a = st.settings.approval;
    return amount <= a.t1 ? 1 : amount <= a.t2 ? 2 : 3;
  };

  var HOOKS = {};
  E.HOOKS = HOOKS;

  /** Post now if the user's level allows, otherwise queue for approval. */
  E.commit = function (st, user, j, opt) {
    opt = opt || {};
    var level = opt.level == null ? 1 : opt.level;
    var errs = E.validateJournal(st, j);
    if (errs.length) return { ok: false, errors: errs };
    if (E.levelOf(user.role) >= level) {
      var r = E.postJournal(st, j, user);
      if (r.ok && opt.hook && !r.duplicate) HOOKS[opt.hook.name](st, opt.hook.args, r.journal, 'posted');
      return r;
    }
    if (!E.can(user.role, 'post') && !(opt.counter && E.can(user.role, 'submit.counter'))) {
      return { ok: false, errors: ['तपाईंको भूमिकाले यो इन्ट्री गर्न मिल्दैन।'] };
    }
    var p = { id: E.uid('p'), journal: j, level: level, label: opt.label || j.memo, amount: E.journalTotal(j), hook: opt.hook || null,
      createdBy: user.name, createdById: user.id, createdAt: new Date().toISOString(), status: 'submitted', history: [] };
    st.pending.push(p);
    E.audit(st, user, 'approval.submit', p.label + ' ' + fmt(p.amount) + ' (level ' + level + ')');
    return { ok: true, queued: true, pending: p, errors: [] };
  };

  E.approve = function (st, pid, user, note) {
    var p = E.find(st.pending, pid);
    if (!p || p.status !== 'submitted') return { ok: false, errors: ['यो अनुरोध भेटिएन वा पहिले नै निर्णय भइसक्यो।'] };
    if (!E.can(user.role, 'approve')) return { ok: false, errors: ['तपाईंलाई स्वीकृत गर्ने अधिकार छैन।'] };
    if (E.levelOf(user.role) < p.level) return { ok: false, errors: ['यो रकमका लागि माथिल्लो तहको स्वीकृति चाहिन्छ।'] };
    if (st.settings.approval.segregation && p.createdById === user.id) return { ok: false, errors: ['आफैँले बनाएको भुक्तानी आफैँले स्वीकृत गर्न मिल्दैन (maker–checker)।'] };
    var j = clone(p.journal); j.approvedBy = user.name;
    var r = E.postJournal(st, j, user);
    if (!r.ok) return r;
    p.status = 'approved'; p.journalId = r.journal.id;
    p.history.push({ t: new Date().toISOString(), u: user.name, a: 'approved', note: note || '' });
    if (p.hook && !r.duplicate) HOOKS[p.hook.name](st, p.hook.args, r.journal, 'posted');
    E.audit(st, user, 'approval.approve', p.label + ' -> ' + r.journal.no);
    return r;
  };

  E.reject = function (st, pid, user, reason) {
    var p = E.find(st.pending, pid);
    if (!p || p.status !== 'submitted') return { ok: false, errors: ['भेटिएन।'] };
    if (!E.can(user.role, 'approve')) return { ok: false, errors: ['तपाईंलाई अस्वीकृत गर्ने अधिकार छैन।'] };
    p.status = 'rejected';
    p.history.push({ t: new Date().toISOString(), u: user.name, a: 'rejected', note: reason || '' });
    if (p.hook) HOOKS[p.hook.name](st, p.hook.args, null, 'rejected');
    E.audit(st, user, 'approval.reject', p.label + ' — ' + (reason || ''));
    return { ok: true };
  };

  /** Possible duplicates for a new entry (same UTR, or same amount+date+account+category). */
  E.findDuplicates = function (st, d) {
    var out = [];
    st.journals.forEach(function (j) {
      if (j.entity !== d.entity || j.reversedBy || j.reversalOf) return;
      if (d.ref && j.ref && j.ref.toLowerCase() === String(d.ref).toLowerCase()) { out.push({ j: j, why: 'उही UTR/कारोबार नम्बर' }); return; }
      if (d.amount && E.journalTotal(j) === d.amount && j.date === d.date && j.cat && j.cat === d.cat) out.push({ j: j, why: 'उही मिति, रकम र प्रकार' });
    });
    return out;
  };

  /* ------------------------------------------------------------------
     9. MONEY IN / OUT  →  journal
     d = {dir, cat, amount, account (cash/bank code), party, trip, date,
          entity, ref, method, memo, tds, loanType, sub}
     ------------------------------------------------------------------ */
  E.buildMoneyJournal = function (st, d) {
    var c = E.cat(st, d.cat);
    if (!c) return { errors: ['कारोबारको प्रकार छान्नुहोस्।'] };
    var acc = c.acc === '@loan' ? E.LOAN_ACCS[d.loanType || 'director'] : c.acc;
    var amt = d.amount, tds = d.tds || 0, lines = [];
    if (!(amt > 0)) return { errors: ['रकम लेख्नुहोस्।'] };
    if (tds < 0 || tds >= amt) return { errors: ['TDS रकम मिलेन।'] };
    var counter = { acc: acc, party: d.party || undefined, trip: c.trip ? d.trip : undefined, sub: d.sub || undefined };
    if (c.dir === 'in') {
      lines.push({ acc: d.account, dr: amt, cr: 0 });
      lines.push(Object.assign({}, counter, { dr: 0, cr: amt }));
    } else {
      lines.push(Object.assign({}, counter, { dr: amt, cr: 0 }));
      lines.push({ acc: d.account, dr: 0, cr: amt - tds });
      if (tds) lines.push({ acc: '2050', dr: 0, cr: tds, memo: 'TDS कट्टी' });
    }
    lines.forEach(function (l) { Object.keys(l).forEach(function (k) { if (l[k] === undefined || l[k] === '') delete l[k]; }); });
    return {
      journal: { entity: d.entity, date: d.date, memo: d.memo || c.ne, ref: d.ref || '', method: d.method || '', cat: c.id, idem: d.idem || '', attach: d.attach || '', lines: lines },
      level: E.requiredLevel(st, c.dir, amt, c.special), cat: c
    };
  };

  E.buildTransferJournal = function (st, d) {
    if (d.from === d.to) return { errors: ['एउटै खाताबाट सोही खातामा ट्रान्सफर हुँदैन।'] };
    return { journal: { entity: d.entity, date: d.date, memo: d.memo || 'आन्तरिक ट्रान्सफर', ref: d.ref || '', method: d.method || 'transfer', cat: 'transfer', idem: d.idem || '',
      lines: [{ acc: d.to, dr: d.amount, cr: 0 }, { acc: d.from, dr: 0, cr: d.amount }] }, level: E.requiredLevel(st, 'out', d.amount, false) };
  };

  /** Plain-Nepali explanation of what a journal does to the company. */
  E.explain = function (st, j, cur) {
    var says = [], cash = 0, profit = 0, liab = 0, eq = 0, other = 0;
    j.lines.forEach(function (l) {
      var a = E.account(st, l.acc); if (!a) return;
      var v = natural(st, l.acc, l.dr || 0, l.cr || 0);
      var up = v > 0, amt = fmt(Math.abs(v), cur);
      if (E.CASH_KINDS[a.kind]) { cash += v; says.push(a.name + ' ' + amt + ' ले ' + (up ? 'बढ्छ' : 'घट्छ') + '।'); }
      else if (a.type === 'expense') { profit -= v; says.push(a.name + ' (खर्च) ' + amt + ' ले ' + (up ? 'बढ्छ' : 'घट्छ') + '।'); }
      else if (a.type === 'revenue') { profit += v; says.push(a.name + ' (आम्दानी) ' + amt + ' ले ' + (up ? 'बढ्छ' : 'घट्छ') + '।'); }
      else if (a.type === 'liability') { liab += v; says.push(a.name + ' (तिर्नुपर्ने दायित्व) ' + amt + ' ले ' + (up ? 'बढ्छ' : 'घट्छ') + '।'); }
      else if (a.type === 'equity') { eq += v; says.push(a.name + ' ' + amt + ' ले ' + (up ? 'बढ्छ' : 'घट्छ') + '।'); }
      else { other += v; says.push(a.name + ' ' + amt + ' ले ' + (up ? 'बढ्छ' : 'घट्छ') + '।'); }
    });
    var tail = [];
    if (profit) tail.push('अन्य कुरा उस्तै भए कम्पनीको नाफा ' + fmt(Math.abs(profit), cur) + ' ले ' + (profit > 0 ? 'बढ्छ' : 'घट्छ') + '।');
    else tail.push('यसले नाफा/घाटा बदल्दैन।');
    if (liab > 0 && cash > 0) tail.push('यसलाई बिक्री वा नाफा मानिँदैन — यो फिर्ता/तिर्नुपर्ने रकम हो।');
    if (eq > 0 && cash > 0) tail.push('यो शेयर पूँजी हो, नाफा होइन।');
    if (other > 0 && cash < 0 && !profit) tail.push('पैसा अर्को सम्पत्ति/पेश्कीमा गयो — यो खर्च होइन, हिसाब फर्छ्यौट हुँदा मात्र खर्च लेखिन्छ।');
    if (cash === 0 && !profit && j.lines.every(function (l) { var a = E.account(st, l.acc); return a && E.CASH_KINDS[a.kind]; }))
      tail.push('कम्पनीको कुल नगद तथा बैंक रकम उत्तिकै रहन्छ — यो आम्दानी वा खर्च होइन।');
    return { lines: says, summary: tail, cash: cash, profit: profit, liability: liab, equity: eq };
  };

  /* ------------------------------------------------------------------
     10. AGENTS & COMMISSION
     ------------------------------------------------------------------ */
  E.nextAgentCode = function (st) {
    var max = 0;
    st.agents.forEach(function (a) { var m = /SHG-(\d+)/.exec(a.code); if (m) max = Math.max(max, +m[1]); });
    return 'SHG-' + ('000' + (max + 1)).slice(-4);
  };
  E.addAgent = function (st, a, user) {
    var code = (a.code || '').trim().toUpperCase() || E.nextAgentCode(st);
    if (!/^[A-Z0-9][A-Z0-9-]{0,19}$/.test(code)) return { ok: false, errors: ['एजेन्ट कोडमा अंग्रेजी अक्षर, अंक र - मात्र (जस्तै SHG-0012)।'] };
    if (st.agents.some(function (x) { return x.code === code; })) return { ok: false, errors: ['यो एजेन्ट कोड पहिले नै छ: ' + code] };
    var ag = { id: E.uid('a'), code: code, name: a.name, phone: a.phone || '', area: a.area || '', tier: a.tier === 'team' ? 'team' : 'direct',
      override: a.override || { mode: '', value: 0 }, active: true, createdAt: new Date().toISOString() };
    st.agents.push(ag);
    E.audit(st, user, 'agent.add', code + ' ' + a.name);
    return { ok: true, agent: ag };
  };

  E.ruleAt = function (st, date) {
    var rules = st.settings.commissionRules.slice().sort(function (a, b) { return a.from < b.from ? -1 : 1; });
    var r = rules[0];
    rules.forEach(function (x) { if (x.from <= date) r = x; });
    return r;
  };
  /** New effective-dated commission rule (₹200 → ₹400 etc). Old sales keep their snapshot. */
  E.setCommissionRule = function (st, rule, user) {
    if (!E.validIso(rule.from)) return { ok: false, errors: ['लागू हुने मिति मिलेन।'] };
    if (!(rule.direct >= 0 && rule.team >= 0 && rule.percent >= 0 && rule.percent <= 100)) return { ok: false, errors: ['दर मिलेन।'] };
    var list = st.settings.commissionRules.filter(function (x) { return x.from !== rule.from; });
    var r = { from: rule.from, mode: rule.mode === 'percent' ? 'percent' : 'flat', direct: rule.direct, team: rule.team, percent: +rule.percent,
      by: user ? user.name : 'system', at: new Date().toISOString(), note: rule.note || '' };
    list.push(r);
    st.settings.commissionRules = list;
    E.audit(st, user, 'commission.rule', r.from + ' ' + r.mode + ' direct ' + fmt(r.direct) + ' team ' + fmt(r.team) + ' ' + r.percent + '%');
    return { ok: true, rule: r };
  };
  /** Commission for a sale: agent override > company rule for the agent's tier. */
  E.commissionFor = function (st, agent, pax, amount, date) {
    var rule = E.ruleAt(st, date), ov = agent.override || {};
    var mode = ov.mode || rule.mode;
    if (mode === 'percent') {
      var pct = ov.mode === 'percent' ? +ov.value : rule.percent;
      return { amount: E.pctOf(amount, pct), basis: pct + '% × ' + fmt(amount), mode: 'percent', rate: pct, ruleFrom: rule.from };
    }
    var rate = ov.mode === 'flat' ? ov.value : (agent.tier === 'team' ? rule.team : rule.direct);
    return { amount: rate * pax, basis: pax + ' यात्रु × ' + fmt(rate), mode: 'flat', rate: rate, ruleFrom: rule.from };
  };

  /** Record an agent's ticket sale: revenue + commission accrual in ONE journal. */
  E.recordAgentSale = function (st, s, user) {
    var ag = E.find(st.agents, s.agentId);
    if (!ag) return { ok: false, errors: ['एजेन्ट छान्नुहोस्।'] };
    if (!(s.pax > 0) || !(s.amount > 0)) return { ok: false, errors: ['यात्रु संख्या र टिकट रकम लेख्नुहोस्।'] };
    var com = s.commissionOverride != null && s.commissionOverride >= 0
      ? { amount: s.commissionOverride, basis: 'हातैले तोकिएको: ' + (s.overrideReason || ''), mode: 'manual' }
      : E.commissionFor(st, ag, s.pax, s.amount, s.date);
    var sale = { id: E.uid('s'), agentId: ag.id, date: s.date, pax: s.pax, amount: s.amount, tripId: s.tripId || '', entity: s.entity,
      collectedBy: s.collectedBy === 'company' ? 'company' : 'agent', account: s.account || '', commission: com.amount, basis: com.basis,
      pnr: s.pnr || '', status: 'pending', journalId: '', createdAt: new Date().toISOString() };
    var debit = sale.collectedBy === 'agent' ? { acc: '1210', party: ag.id, dr: s.amount, cr: 0 } : { acc: s.account, dr: s.amount, cr: 0 };
    var lines = [debit, { acc: '4010', dr: 0, cr: s.amount, trip: sale.tripId || undefined }];
    if (com.amount > 0) {
      lines.push({ acc: '5040', party: ag.id, dr: com.amount, cr: 0, trip: sale.tripId || undefined });
      lines.push({ acc: '2020', party: ag.id, dr: 0, cr: com.amount });
    }
    lines.forEach(function (l) { if (!l.trip) delete l.trip; });
    var j = { entity: s.entity, date: s.date, memo: ag.code + ' बिक्री: ' + s.pax + ' यात्रु' + (sale.pnr ? ' (' + sale.pnr + ')' : ''), ref: sale.pnr,
      cat: 'agent_sale', source: { type: 'agentSale', id: sale.id }, idem: 'sale:' + (sale.pnr ? ag.id + ':' + sale.pnr : sale.id), lines: lines };
    if (sale.pnr && st.agentSales.some(function (x) { return x.agentId === ag.id && x.pnr === sale.pnr && x.status !== 'cancelled' && x.status !== 'rejected'; }))
      return { ok: false, errors: ['यही PNR/बुकिङमा यो एजेन्टको कमिसन पहिले नै लेखिएको छ — दोहोरो कमिसन रोकियो।'] };
    st.agentSales.push(sale);
    var r = E.commit(st, user, j, { level: 1, label: j.memo, hook: { name: 'agentSale', args: { id: sale.id } } });
    if (!r.ok) st.agentSales.pop();
    r.sale = sale; r.commission = com;
    return r;
  };
  HOOKS.agentSale = function (st, args, j, what) {
    var s = E.find(st.agentSales, args.id); if (!s) return;
    if (what === 'posted') { s.status = 'active'; s.journalId = j.id; } else s.status = 'rejected';
  };

  /** Cancel a sale: revenue goes to 4015 (refund) and, by policy, commission is reversed. */
  E.cancelAgentSale = function (st, saleId, opt, user) {
    opt = opt || {};
    var s = E.find(st.agentSales, saleId);
    if (!s || s.status !== 'active') return { ok: false, errors: ['सक्रिय बिक्री भेटिएन।'] };
    var reverseCom = opt.reverseCommission == null ? st.settings.reverseCommissionOnCancel : !!opt.reverseCommission;
    var credit = s.collectedBy === 'agent' ? { acc: '1210', party: s.agentId, dr: 0, cr: s.amount } : { acc: opt.refundAccount || s.account, dr: 0, cr: s.amount };
    var lines = [{ acc: '4015', dr: s.amount, cr: 0, trip: s.tripId || undefined }, credit];
    if (reverseCom && s.commission > 0) {
      lines.push({ acc: '2020', party: s.agentId, dr: s.commission, cr: 0 });
      lines.push({ acc: '5040', party: s.agentId, dr: 0, cr: s.commission, trip: s.tripId || undefined });
    }
    lines.forEach(function (l) { if (!l.trip) delete l.trip; });
    var ag = E.find(st.agents, s.agentId);
    var r = E.commit(st, user, { entity: s.entity, date: opt.date || E.today(), memo: ag.code + ' बिक्री रद्द' + (reverseCom ? ' + कमिसन फिर्ता' : ''),
      cat: 'agent_cancel', source: { type: 'agentCancel', id: s.id }, idem: 'cancel:' + s.id, lines: lines }, { level: 1, hook: { name: 'agentCancel', args: { id: s.id } } });
    return r;
  };
  HOOKS.agentCancel = function (st, args, j, what) {
    var s = E.find(st.agentSales, args.id); if (s && what === 'posted') { s.status = 'cancelled'; s.cancelJournalId = j.id; }
  };

  /** Net settlement: agent keeps the commission out of the cash they hold. */
  E.netSettle = function (st, entity, agentId, date, user) {
    if (!st.settings.netSettlementAllowed) return { ok: false, errors: ['नेट सेटलमेन्ट सेटिङमा बन्द छ — कमिसन छुट्टै भुक्तानी गर्नुहोस्।'] };
    var recv = E.balance(st, entity, '1210', { party: agentId, to: date });
    var pay = E.balance(st, entity, '2020', { party: agentId, to: date });
    var amt = Math.min(recv, pay);
    if (!(amt > 0)) return { ok: false, errors: ['मिलान गर्नुपर्ने रकम छैन (एजेन्टसँग नगद वा कमिसन बाँकी छैन)।'] };
    var ag = E.find(st.agents, agentId);
    return E.commit(st, user, { entity: entity, date: date, memo: ag.code + ' कमिसन नगदबाटै मिलान (नेट सेटलमेन्ट)', cat: 'net_settle',
      lines: [{ acc: '2020', party: agentId, dr: amt, cr: 0 }, { acc: '1210', party: agentId, dr: 0, cr: amt }] }, { level: 1 });
  };

  E.agentPosition = function (st, entity, agentId, asOf) {
    var held = E.balance(st, entity, '1210', { party: agentId, to: asOf });
    var payable = E.balance(st, entity, '2020', { party: agentId, to: asOf });
    return { held: held, payable: payable, net: held - payable };
  };
  E.agentSummary = function (st, entity, from, to) {
    return st.agents.map(function (ag) {
      var sales = st.agentSales.filter(function (s) { return s.agentId === ag.id && s.entity === entity && s.date >= from && s.date <= to && (s.status === 'active' || s.status === 'cancelled'); });
      var act = sales.filter(function (s) { return s.status === 'active'; });
      var pos = E.agentPosition(st, entity, ag.id, to);
      return { agent: ag, pax: E.sum(act, function (s) { return s.pax; }), sales: E.sum(act, function (s) { return s.amount; }),
        cancelled: sales.length - act.length, commission: E.sum(act, function (s) { return s.commission; }), held: pos.held, payable: pos.payable, net: pos.net };
    });
  };
  /** Statement lines for one agent: + means agent owes the company. */
  E.agentStatement = function (st, entity, agentId, from, to) {
    var open = E.agentPosition(st, entity, agentId, E.addDays(from, -1)).net;
    var rows = [], run = open;
    E.lines(st, { entity: entity, acc: ['1210', '2020'], party: agentId, from: from, to: to }).forEach(function (x) {
      var v = x.l.dr - x.l.cr;   // 1210 debit = owes more; 2020 debit = we owe less → also +
      run += v;
      rows.push({ date: x.j.date, no: x.j.no, memo: x.j.memo, acc: x.l.acc, change: v, balance: run });
    });
    return { opening: open, rows: rows, closing: run };
  };

  /* ------------------------------------------------------------------
     11. SHARES & CAPITAL
     ------------------------------------------------------------------ */
  E.addPerson = function (st, p, user) {
    var o = { id: E.uid('p'), name: p.name, kind: p.kind || 'pending', phone: p.phone || '', idNo: p.idNo || '', address: p.address || '',
      entity: p.entity || 'IN', note: p.note || '', createdAt: new Date().toISOString(), history: [] };
    st.people.push(o);
    E.audit(st, user, 'person.add', o.name + ' (' + o.kind + ')');
    return o;
  };

  /** Holdings per holder per class from allotments ± transfers (as of a date). */
  E.holdings = function (st, asOf) {
    var h = {};
    var add = function (pid, cls, n) { var k = pid + '|' + cls; h[k] = (h[k] || 0) + n; };
    st.allotments.forEach(function (a) { if (a.status === 'approved' && (!asOf || a.date <= asOf)) add(a.holderId, a.cls, a.shares); });
    st.transfers.forEach(function (t) { if (t.status === 'approved' && (!asOf || t.date <= asOf)) { add(t.fromId, t.cls, -t.shares); add(t.toId, t.cls, t.shares); } });
    return h;
  };

  /** Paid money (face + premium) received against one allotment. */
  E.allotmentPaid = function (st, allotId) {
    var t = 0;
    st.journals.forEach(function (j) { j.lines.forEach(function (l) { if (l.sub === allotId && (l.acc === '3010' || l.acc === '3020')) t += l.cr - l.dr; }); });
    return t;
  };

  E.capTable = function (st, asOf) {
    var h = E.holdings(st, asOf), rows = {}, totalEq = 0;
    Object.keys(h).forEach(function (k) {
      var p = k.split('|'), n = h[k]; if (!n) return;
      var r = rows[p[0]] || (rows[p[0]] = { id: p[0], name: E.partyName(st, p[0]), eq: 0, pref: 0, nominal: 0, due: 0, paid: 0 });
      var cls = E.find(st.shareClasses, p[1]);
      if (cls && cls.voting) { r.eq += n; totalEq += n; } else r.pref += n;
      r.nominal += n * (cls ? cls.face : 0);
    });
    st.allotments.forEach(function (a) {
      if (a.status !== 'approved' || (asOf && a.date > asOf)) return;
      var r = rows[a.holderId] || (rows[a.holderId] = { id: a.holderId, name: E.partyName(st, a.holderId), eq: 0, pref: 0, nominal: 0, due: 0, paid: 0 });
      r.due += a.shares * a.issuePrice;
      r.paid += E.allotmentPaid(st, a.id);
    });
    var list = Object.keys(rows).map(function (k) { var r = rows[k]; r.pct = totalEq ? r.eq * 100 / totalEq : 0; r.unpaid = r.due - r.paid; return r; })
      .sort(function (a, b) { return b.eq - a.eq; });
    return { rows: list, totalEq: totalEq, totalPref: E.sum(list, function (r) { return r.pref; }), nominal: E.sum(list, function (r) { return r.nominal; }),
      due: E.sum(list, function (r) { return r.due; }), paid: E.sum(list, function (r) { return r.paid; }) };
  };

  /** Pure ownership maths for one equal-rights class. */
  E.ownership = function (holders) {
    var total = E.sum(holders, function (h) { return h.shares; });
    return holders.map(function (h) { return { name: h.name, shares: h.shares, pct: total ? h.shares * 100 / total : 0 }; });
  };
  E.shareMaths = function (shares, face, issuePrice, paid) {
    var nominal = shares * face, due = shares * issuePrice;
    return { nominal: nominal, premium: shares * (issuePrice - face), due: due, outstanding: due - (paid || 0) };
  };

  /** Record a legal allotment (CEO only). Optional money received now. */
  E.allotShares = function (st, a, user) {
    if (E.levelOf(user.role) < 3) return { ok: false, errors: ['शेयर बाँडफाँट CEO/निर्देशकले मात्र गर्न सक्छ।'] };
    var cls = E.find(st.shareClasses, a.cls || 'EQ');
    if (!cls) return { ok: false, errors: ['शेयर वर्ग भेटिएन।'] };
    if (!(a.shares > 0) || a.shares !== Math.round(a.shares)) return { ok: false, errors: ['शेयर संख्या पूर्णाङ्क हुनुपर्छ।'] };
    var issuePrice = a.issuePrice || cls.face;
    if (issuePrice < cls.face) return { ok: false, errors: ['अंकित मूल्यभन्दा कममा शेयर जारी गर्न मिल्दैन (discount issue निषेधित)।'] };
    if (st.mode === 'real' && !a.docRef) return { ok: false, errors: ['बोर्ड निर्णय / बाँडफाँट कागजातको नम्बर अनिवार्य छ।'] };
    var authorized = st.settings.capital.authorized;
    var issuedNominal = E.capTable(st).nominal;
    if (authorized > 0 && issuedNominal + a.shares * cls.face > authorized)
      return { ok: false, errors: ['अधिकृत पूँजी (' + fmt(authorized) + ') नाघ्छ। पहिले अधिकृत पूँजी कानुनी रूपमा बढाउनुहोस् (SH-7)।'] };
    var al = { id: E.uid('al'), date: a.date, holderId: a.holderId, cls: cls.id, shares: a.shares, face: cls.face, issuePrice: issuePrice,
      docRef: a.docRef || '', certNo: a.certNo || '', status: 'approved', by: user.name, createdAt: new Date().toISOString() };
    st.allotments.push(al);
    var p = E.find(st.people, a.holderId);
    if (p && (p.kind === 'pending' || !p.kind)) p.kind = cls.voting ? 'equity' : 'preference';
    E.audit(st, user, 'shares.allot', E.partyName(st, a.holderId) + ' ' + a.shares + ' ' + cls.id + ' @ ' + fmt(issuePrice));
    var r = { ok: true, allotment: al };
    if (a.paidNow > 0) r.payment = E.payForShares(st, al.id, a.paidNow, a.account, a.date, a.entity || 'IN', user, a.fromPending);
    return r;
  };

  /** Money received for shares: split into face (3010) and premium (3020) pro-rata. */
  E.payForShares = function (st, allotId, amount, account, date, entity, user, fromPending) {
    var al = E.find(st.allotments, allotId);
    if (!al) return { ok: false, errors: ['बाँडफाँट भेटिएन।'] };
    var due = al.shares * al.issuePrice - E.allotmentPaid(st, al.id);
    if (amount > due) return { ok: false, errors: ['बाँकी भन्दा बढी रकम (' + fmt(due) + ' मात्र बाँकी)।'] };
    var face = Math.round(amount * al.face / al.issuePrice), prem = amount - face;
    var lines = [fromPending ? { acc: '2990', party: al.holderId, dr: amount, cr: 0 } : { acc: account, dr: amount, cr: 0 },
      { acc: '3010', party: al.holderId, sub: al.id, dr: 0, cr: face }];
    if (prem) lines.push({ acc: '3020', party: al.holderId, sub: al.id, dr: 0, cr: prem });
    return E.commit(st, user, { entity: entity, date: date, memo: 'शेयर रकम प्राप्त: ' + E.partyName(st, al.holderId), cat: 'share_pay', source: { type: 'allotment', id: al.id }, lines: lines }, { level: 3 });
  };

  E.transferShares = function (st, t, user) {
    if (E.levelOf(user.role) < 3) return { ok: false, errors: ['शेयर हस्तान्तरण CEO/निर्देशकले मात्र दर्ता गर्न सक्छ।'] };
    var h = E.holdings(st, t.date), have = h[t.fromId + '|' + (t.cls || 'EQ')] || 0;
    if (!(t.shares > 0) || t.shares > have) return { ok: false, errors: ['बेच्नेसँग पर्याप्त शेयर छैन (' + have + ' मात्र)।'] };
    if (t.fromId === t.toId) return { ok: false, errors: ['एउटै व्यक्तिलाई हस्तान्तरण हुँदैन।'] };
    if (st.mode === 'real' && !t.docRef) return { ok: false, errors: ['SH-4 / हस्तान्तरण कागजातको नम्बर अनिवार्य छ।'] };
    var tr = { id: E.uid('tr'), date: t.date, fromId: t.fromId, toId: t.toId, cls: t.cls || 'EQ', shares: t.shares, price: t.price || 0,
      docRef: t.docRef || '', status: 'approved', by: user.name };
    st.transfers.push(tr);
    var p = E.find(st.people, t.toId); if (p && p.kind === 'pending') p.kind = 'equity';
    E.audit(st, user, 'shares.transfer', E.partyName(st, t.fromId) + ' -> ' + E.partyName(st, t.toId) + ' ' + t.shares);
    return { ok: true, transfer: tr };
  };

  /** "Give N new shares to someone" — preview only, nothing is saved. */
  E.dilution = function (current, newShares, issuePrice, face, authorized, issuedNominal) {
    var before = E.sum(current, function (h) { return h.shares; }), after = before + newShares;
    var rows = current.map(function (h) {
      var b = before ? h.shares * 100 / before : 0, a = after ? h.shares * 100 / after : 0;
      return { name: h.name, shares: h.shares, before: b, after: a, change: a - b };
    });
    rows.push({ name: 'नयाँ शेयरधनी', shares: newShares, before: 0, after: after ? newShares * 100 / after : 0, change: after ? newShares * 100 / after : 0, isNew: true });
    var nominalUp = newShares * face, premium = newShares * Math.max(0, issuePrice - face);
    var headroom = authorized > 0 ? authorized - issuedNominal - nominalUp : null;
    return { rows: rows, before: before, after: after, nominalUp: nominalUp, premium: premium, cashIn: newShares * issuePrice, headroom: headroom };
  };

  E.capitalSummary = function (st, entity, asOf) {
    var ct = E.capTable(st, asOf), b = function (codes) { return E.sumBalances(st, entity, codes, { to: asOf }); };
    var bs = E.balanceSheet(st, entity, asOf), cp = E.cashPosition(st, entity, asOf);
    return {
      authorized: st.settings.capital.authorized, authorizedVerified: st.settings.capital.authorizedVerified,
      issued: ct.nominal, subscribed: ct.nominal, calledUp: ct.nominal, paidUp: b(['3010']), unpaid: ct.due - ct.paid,
      premium: b(['3020']), reserves: b(['3030']), directorLoan: b(['2100']), unsecuredLoans: b(['2110', '2120']),
      retained: b(['3040']) + bs.currentEarnings, opening: b(['3050']), cash: cp.cash, bank: cp.bank,
      fixedAssets: b(['1500', '1510', '1590']), totalLiabilities: bs.totalLiabilities, netAssets: bs.totalAssets - bs.totalLiabilities,
      pendingClassification: b(['2990'])
    };
  };

  /* Dividends: preview → declare (CEO, legal checklist) → pay via Money Out */
  E.dividendPreview = function (st, pool, recordDate, tdsPct) {
    var ct = E.capTable(st, recordDate), alloc = 0;
    var rows = ct.rows.filter(function (r) { return r.eq > 0; }).map(function (r) {
      var gross = Math.floor(pool * r.eq / ct.totalEq); alloc += gross;
      return { id: r.id, name: r.name, shares: r.eq, pct: r.pct, gross: gross };
    });
    for (var i = 0; alloc < pool && rows.length; i = (i + 1) % rows.length) { rows[i].gross++; alloc++; }   // largest-remainder pennies
    rows.forEach(function (r) { r.tds = E.pctOf(r.gross, tdsPct || 0); r.net = r.gross - r.tds; });
    return { rows: rows, pool: pool, totalShares: ct.totalEq };
  };
  E.declareDividend = function (st, d, user) {
    if (E.levelOf(user.role) < 3) return { ok: false, errors: ['लाभांश घोषणा CEO/बोर्डको अधिकार हो।'] };
    if (!d.resolution) return { ok: false, errors: ['बोर्ड/साधारण सभाको निर्णय नम्बर अनिवार्य छ।'] };
    if (!d.caConfirmed) return { ok: false, errors: ['वितरणयोग्य नाफा CA ले पुष्टि गरेको चिन्ह लगाउनुहोस्।'] };
    var pv = E.dividendPreview(st, d.pool, d.recordDate, d.tdsPct);
    if (!pv.rows.length) return { ok: false, errors: ['रेकर्ड मितिमा कुनै साधारण शेयरधनी छैन।'] };
    var lines = pv.rows.map(function (r) { return { acc: '3060', party: r.id, dr: r.gross, cr: 0 }; });
    pv.rows.forEach(function (r) {
      lines.push({ acc: '2080', party: r.id, dr: 0, cr: r.net });
      if (r.tds) lines.push({ acc: '2050', dr: 0, cr: r.tds, memo: 'लाभांश TDS ' + r.name });
    });
    var dec = { id: E.uid('dv'), date: d.date, recordDate: d.recordDate, pool: d.pool, tdsPct: d.tdsPct || 0, resolution: d.resolution, rows: pv.rows, status: 'pending' };
    st.dividends.push(dec);
    var r = E.commit(st, user, { entity: d.entity || 'IN', date: d.date, memo: 'लाभांश घोषणा (' + d.resolution + ')', cat: 'dividend', source: { type: 'dividend', id: dec.id }, lines: lines },
      { level: 3, hook: { name: 'dividend', args: { id: dec.id } } });
    if (!r.ok) st.dividends.pop();
    return r;
  };
  HOOKS.dividend = function (st, args, j, what) { var d = E.find(st.dividends, args.id); if (d) { d.status = what === 'posted' ? 'declared' : 'rejected'; if (j) d.journalId = j.id; } };

  /* ------------------------------------------------------------------
     12. LOANS
     ------------------------------------------------------------------ */
  E.addLoan = function (st, l, user) {
    var loan = { id: E.uid('l'), lenderId: l.lenderId, type: l.type || 'director', acc: E.LOAN_ACCS[l.type || 'director'], principal: l.principal,
      rate: +l.rate || 0, method: l.method === 'compound' ? 'compound' : 'simple', perYear: +l.perYear || 12, start: l.start, maturity: l.maturity || '',
      docRef: l.docRef || '', entity: l.entity || 'IN', tdsPct: +l.tdsPct || 0, note: l.note || '', createdAt: new Date().toISOString() };
    st.loans.push(loan);
    E.audit(st, user, 'loan.add', E.partyName(st, loan.lenderId) + ' ' + fmt(loan.principal) + ' @' + loan.rate + '%');
    var r = { ok: true, loan: loan };
    if (l.receiveNow && l.account) {
      r.receipt = E.commit(st, user, { entity: loan.entity, date: loan.start, memo: E.LOAN_NE[loan.type] + ' प्राप्त: ' + E.partyName(st, loan.lenderId), ref: l.ref || '',
        cat: 'in_loan', lines: [{ acc: l.account, dr: loan.principal, cr: 0 }, { acc: loan.acc, party: loan.lenderId, sub: loan.id, dr: 0, cr: loan.principal }] }, { level: 3 });
    }

  };
  E.loanOutstanding = function (st, loan, asOf) { return E.balance(st, loan.entity, loan.acc, { party: loan.lenderId, sub: loan.id, to: asOf }); };

  /** Interest accrued on the actual outstanding principal, day by day. */
  E.loanInterest = function (st, loan, asOf) {
    var ev = E.lines(st, { entity: loan.entity, acc: loan.acc, party: loan.lenderId, sub: loan.id, to: asOf });
    var bal = 0, last = null, acc = 0, r = loan.rate / 100;
    var accrue = function (to) {
      if (last === null || bal <= 0) return;
      var days = E.daysBetween(last, to); if (days <= 0) return;
      if (loan.method === 'compound') { var base = bal + acc; acc += base * (Math.pow(1 + r / loan.perYear, loan.perYear * days / 365) - 1); }
      else acc += bal * r * days / 365;
    };
    ev.forEach(function (x) { accrue(x.j.date); bal += x.l.cr - x.l.dr; last = x.j.date; });
    accrue(asOf);
    // paid = interest that actually left cash/bank; expensed = interest already in the P&L (7110)
    var paid = 0, expensed = 0;
    E.lines(st, { entity: loan.entity, acc: ['7110', '2070'], party: loan.lenderId, sub: loan.id, to: asOf }).forEach(function (x) {
      if (x.l.acc === '7110') expensed += x.l.dr - x.l.cr;
      if (x.j.lines.some(function (l) { var a = E.account(st, l.acc); return a && E.CASH_KINDS[a.kind]; })) paid += x.l.dr - x.l.cr;
    });
    var accrued = Math.round(acc);
    return { accrued: accrued, paid: paid, expensed: expensed, due: Math.max(0, accrued - paid), toExpense: Math.max(0, accrued - expensed), principal: bal };
  };
  /** Book interest that has built up but is not yet in the P&L: Dr 7110, Cr 2070. */
  E.accrueInterest = function (st, loanId, asOf, user) {
