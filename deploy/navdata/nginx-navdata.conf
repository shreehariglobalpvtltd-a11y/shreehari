    # SHARI NAV map data (5 Oct 2026) — built by tools/navdata/02-build.sh into
    # /srv/shg-nav/www/navdata, OUTSIDE the webroot, so a code deploy never
    # touches it. Goes in the www.shreehariglobal.in server block (after the
    # /uploads/ block). ^~ keeps the asset/deny regex locations out of it.
    location ^~ /navdata/ {
        root /srv/shg-nav/www;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        location ^~ /navdata/tiles/ {
            # tilemaker writes gzip-compressed vector tiles; a tile we do not
            # have (sea, outside the area) is an empty 204, never a 404
            types { application/x-protobuf pbf; }
            add_header Content-Encoding "gzip" always;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =204;
        }
        location ^~ /navdata/fonts/ {
            types { application/x-protobuf pbf; }
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }
        location ^~ /navdata/sprites/ {
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }
        try_files $uri =404;
    }
