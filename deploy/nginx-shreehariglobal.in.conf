# =====================================================================
#  S Hari Global Pvt Ltd — nginx site config for the Hostinger VPS
#  Master prompt §3, §21, §26, §39
#
#  The live site runs on Hostinger SHARED hosting today, where Apache
#  reads the .htaccess files scattered through the tree. nginx does not
#  read .htaccess AT ALL — every protection has to be restated here, or
#  it silently disappears on the day you move. This file is that
#  restatement, rule for rule.
#
#  INSTALL
#    sudo cp nginx-shreehariglobal.in.conf /etc/nginx/sites-available/shreehariglobal.in
#    sudo ln -s /etc/nginx/sites-available/shreehariglobal.in /etc/nginx/sites-enabled/
#    sudo nginx -t          # MUST say "syntax is ok" before you reload
#    sudo systemctl reload nginx
#
#  TLS: run certbot BEFORE enabling the HTTPS block, or nginx will fail
#  to start on a certificate that does not exist yet:
#    sudo certbot --nginx -d shreehariglobal.in -d www.shreehariglobal.in
# =====================================================================

# ---- 1. HTTP -> HTTPS -------------------------------------------------
# Cache policy for static assets: a year + immutable when the URL carries a
# ?v= stamp (the app stamps every asset), a week otherwise. (24 Sep 2026)
map $args $shg_asset_cache {
    default   "public, max-age=604800";
    "~v="     "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name shreehariglobal.in www.shreehariglobal.in;

    # Let certbot renew without being bounced to HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://www.shreehariglobal.in$request_uri;
    }
}

# ---- 2. apex -> www ---------------------------------------------------
# APP_URL is https://www.shreehariglobal.in. Ticket links, QR payloads and
# admin redirects are all built from it, so the site must be reachable at
# exactly one canonical host — two hosts means two session cookie scopes
# and customers losing their sign-in by following their own ticket link.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shreehariglobal.in;

    ssl_certificate     /etc/letsencrypt/live/shreehariglobal.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shreehariglobal.in/privkey.pem;

    return 301 https://www.shreehariglobal.in$request_uri;
}

# ---- 3. the site ------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.shreehariglobal.in;

    root  /var/www/shreehariglobal.in/public_html;
    index index.php index.html;

    ssl_certificate     /etc/letsencrypt/live/shreehariglobal.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shreehariglobal.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Payment screenshots are up to 10 MB (MAX_UPLOAD_BYTES). nginx's
    # default is 1 MB, which would reject them with a bare 413 long before
    # PHP ever sees the request.
    client_max_body_size 12M;

    # -- Security headers (mirrors the .htaccess + PHP layer) ------------
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(self), microphone=(self), camera=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # -- No directory listing, ever (Apache: Options -Indexes) -----------
    autoindex off;

    # ================================================================
    #  DENIED PATHS
    #  Each block replaces a .htaccess that nginx cannot read. `internal`
    #  is not used: these must be refused outright, not merely hidden.
    # ================================================================

    # Application internals. Nothing here is ever fetched by a browser:
    # includes/ holds the service classes, config/ the live database
    # credentials and APP_KEY, database/ the schema and migrations,
    # backup/ the nightly gzipped dumps, logs/ the error log.
    location ~ ^/(config|includes|database|backup|logs|cron|invoice|tickets)/ {
        deny all;
        return 404;
    }

    # tests/ boots the app and several files WRITE to the database.
    # preflight.php is the one deliberate exception — it gates itself
    # behind a signed-in admin and is meant to be run after a deploy.
    location ~ ^/tests/ {
        deny all;
        return 404;
    }
    location = /tests/preflight.php {
        include        snippets/fastcgi-php.conf;
        fastcgi_pass   unix:/run/php/php8.3-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # The raw application template — index.php renders it; serving it
    # directly would hand out the unprocessed markup.
    location = /app.template.html { deny all; return 404; }

    # The installer imports schema.sql (41 DROP TABLE statements) and
    # resets the superadmin. The site is installed; this is a
    # total-data-loss / account-takeover risk and nothing else.
    location = /install.php { deny all; return 404; }

    # Dotfiles, database dumps, docs, logs, archives, stray editor copies.
    location ~ /\.                                        { deny all; return 404; }
    location ~* \.(bak|sql|log|ini|sample|dist|md|txt~)$   { deny all; return 404; }
    location ~* \.(zip|tar|gz|tgz|bz2|xz|rar|7z)$          { deny all; return 404; }
    location ~* \.(backup|old|orig|save|copy)\.[a-z0-9]+$  { deny all; return 404; }

    # uploads/ is customer-supplied content. A PHP file that reaches it —
    # by a bypassed MIME check, or a bug — must be served as bytes, never
    # executed. This is the nginx equivalent of `php_flag engine off`.
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; return 404; }
        # 17 Sep 2026: departure sheets carry passenger names and mobiles.
        # Every reader goes through PHP (admin/challan.php, admin/manifest.php,
        # download-chalan.php with a signed key) — never the raw file.
        location ^~ /uploads/challan/ { deny all; return 404; }
        location ^~ /uploads/chalani/ { deny all; return 404; }
        # Agent KYC scans and passenger ID documents: served only by
        # admin/agent-kyc-file.php and admin/passenger-doc.php (audited).
        location ^~ /uploads/agents-kyc/ { deny all; return 404; }
        location ^~ /uploads/passengers/ { deny all; return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ================================================================
    #  CACHING
    # ================================================================

    # The service worker and manifest must revalidate on every load, or a
    # cached copy freezes the app on an old version and updates stop
    # shipping. This must come BEFORE the long-cache static rule below.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(css|js|png|jpe?g|webp|svg|woff2?|ico)$ {
        # A stamped asset (?v=…) never changes under its URL — a year and
        # immutable, so a repeat visit makes zero conditional requests. An
        # unstamped one keeps the 7-day rule. (24 Sep 2026)
        expires 7d;
        add_header Cache-Control $shg_asset_cache;
        # Serve a pre-compressed neighbour (app.css.gz / .br, written by the
        # build) instead of compressing on every request. brotli_static needs
        # the ngx_brotli module — uncomment once it is installed.
        gzip_static on;
        # brotli_static on;
        access_log off;
        try_files $uri =404;
    }

    # Live seat events: one long response per open seat map, streamed line
    # by line. nginx must not buffer it and must not gzip it, and it may run
    # for seat_events_seconds (25 s) plus a heartbeat. (24 Sep 2026)
    location = /api/seat-events.php {
        try_files $uri =404;
        include        snippets/fastcgi-php.conf;
        fastcgi_pass   unix:/run/php/php8.3-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTPS on;
        fastcgi_buffering off;
        fastcgi_read_timeout 90s;
        gzip off;
        add_header Cache-Control "no-cache" always;
        add_header X-Accel-Buffering "no" always;
    }

    # ================================================================
    #  PHP
    # ================================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Refuse a path that only LOOKS like PHP (/uploads/x.php/y.jpg).
        # Without this, cgi.fix_pathinfo can hand PHP-FPM a file the
        # location rules above were meant to keep it away from.
        try_files $uri =404;

        include        snippets/fastcgi-php.conf;
        fastcgi_pass   unix:/run/php/php8.3-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTPS on;

        # Ticket PDF generation and the WhatsApp send are the slow paths.
        fastcgi_read_timeout 120s;
    }

    # ================================================================
    #  COMPRESSION
    # ================================================================
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml text/xml;
    # brotli is ~15-25 % smaller than gzip on JS/CSS/JSON. Needs the ngx_brotli
    # module (nginx.org package "nginx-module-brotli"); uncomment once loaded:
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_types      text/plain text/css application/javascript application/json
    #                   application/manifest+json image/svg+xml text/xml;

    # ================================================================
    #  LOGS
    # ================================================================
    access_log /var/log/nginx/shreehariglobal.access.log;
    error_log  /var/log/nginx/shreehariglobal.error.log warn;
}
