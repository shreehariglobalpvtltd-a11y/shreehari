# SHARI NAV live hub - goes inside the  server_name www.shreehariglobal.in  (443) block,
# before the PHP location. ^~ keeps every /live/ path away from PHP-FPM.
# Test with  nginx -t  before  systemctl reload nginx.
    location ^~ /live/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
